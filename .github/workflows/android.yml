name: Build, Sign and Verify Ycash Android Node

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  ANDROID_API: "35"
  ANDROID_NDK: "27.2.12479018"
  RUST_TARGET: "aarch64-linux-android"

  # Temporary CI signing.
  # A new debug keystore is generated for each workflow run.
  CI_KEYSTORE: "${{ github.workspace }}/ci-debug.keystore"
  CI_KEY_ALIAS: "ycash-debug"
  CI_KEYSTORE_PASSWORD: "ycash-debug-password"
  CI_KEY_PASSWORD: "ycash-debug-password"

jobs:
  build:
    name: Build, Align, Sign and Verify Ycash Android Node
    runs-on: ubuntu-24.04

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # 2. PREPARE PROJECT ROOT
      #
      # Supports:
      #
      # A) Project already extracted at repository root:
      #
      #    Cargo.toml
      #    crates/
      #    android-app/
      #
      # OR
      #
      # B) Repository contains ANY ZIP file containing the
      #    Ycash Android Node project.
      #
      # ZIP filename does NOT matter.
      #
      # The workflow searches ALL .zip files recursively and
      # identifies a valid project by checking for:
      #
      #    Cargo.toml
      #    crates/
      #    android-app/
      #
      # The project may also be inside a nested directory in
      # the ZIP.
      # =========================================================
      - name: Prepare project root
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "PREPARING Ycash PROJECT ROOT"
          echo "=========================================="

          echo
          echo "Current repository:"
          pwd

          echo
          echo "Repository contents:"
          ls -la

          # -----------------------------------------------------
          # Already at repository root?
          # -----------------------------------------------------
          if [ -f "Cargo.toml" ] && \
             [ -d "crates" ] && \
             [ -d "android-app" ]; then

            echo
            echo "Valid Ycash project already exists at repository root."
            echo "Using existing project."

          else

            echo
            echo "Valid project not found at repository root."
            echo
            echo "Searching ALL ZIP files recursively..."
            echo "ZIP filename is ignored."

            ZIP=""

            # ---------------------------------------------------
            # Find every ZIP recursively.
            #
            # No filename pattern is required.
            # ---------------------------------------------------
            mapfile -d '' ZIP_FILES < <(
              find . \
                -type f \
                -iname '*.zip' \
                -not -path './.git/*' \
                -print0 \
                | sort -z
            )

            if [ "${#ZIP_FILES[@]}" -eq 0 ]; then
              echo
              echo "ERROR: No ZIP files were found."
              echo
              echo "Repository files:"
              find . -maxdepth 6 -type f | sort
              exit 1
            fi

            echo
            echo "ZIP files discovered:"
            for candidate in "${ZIP_FILES[@]}"; do
              echo "  - $candidate"
            done

            # ---------------------------------------------------
            # Test every ZIP.
            #
            # A ZIP is considered a candidate when it contains:
            #
            #    Cargo.toml
            #
            # and either:
            #
            #    crates/
            #
            # and:
            #
            #    android-app/
            #
            # This works whether those files are at ZIP root or
            # inside a nested project directory.
            # ---------------------------------------------------

            for candidate in "${ZIP_FILES[@]}"; do

              echo
              echo "------------------------------------------"
              echo "Checking ZIP:"
              echo "$candidate"
              echo "------------------------------------------"

              # -------------------------------------------------
              # Verify ZIP is readable.
              # -------------------------------------------------
              if ! unzip -tq "$candidate" >/dev/null 2>&1; then
                echo "SKIP: Invalid or corrupted ZIP."
                continue
              fi

              echo "ZIP integrity: OK"

              # -------------------------------------------------
              # Check for Cargo.toml.
              # -------------------------------------------------
              if ! unzip -Z1 "$candidate" 2>/dev/null \
                | grep -qE '(^|/)Cargo\.toml$'; then

                echo "SKIP: No Cargo.toml."
                continue
              fi

              echo "Cargo.toml: FOUND"

              # -------------------------------------------------
              # Check for crates directory/content.
              #
              # ZIP listings sometimes do not contain explicit
              # directory entries, so also accept files below
              # crates/.
              # -------------------------------------------------
              if ! unzip -Z1 "$candidate" 2>/dev/null \
                | grep -qE '(^|/)crates(/|/)'; then

                echo "SKIP: No crates/ directory."
                continue
              fi

              echo "crates/: FOUND"

              # -------------------------------------------------
              # Check for android-app directory/content.
              # -------------------------------------------------
              if ! unzip -Z1 "$candidate" 2>/dev/null \
                | grep -qE '(^|/)android-app(/|/)'; then

                echo "SKIP: No android-app/ directory."
                continue
              fi

              echo "android-app/: FOUND"

              # -------------------------------------------------
              # Valid project ZIP found.
              # -------------------------------------------------
              ZIP="$candidate"

              echo
              echo "=========================================="
              echo "VALID YCASH PROJECT ZIP FOUND"
              echo "=========================================="
              echo "$ZIP"

              break
            done

            # ---------------------------------------------------
            # No valid ZIP found.
            # ---------------------------------------------------
            if [ -z "$ZIP" ]; then

              echo
              echo "=========================================="
              echo "ERROR: NO VALID YCASH PROJECT ZIP"
              echo "=========================================="

              echo
              echo "ZIP files that were checked:"

              for candidate in "${ZIP_FILES[@]}"; do
                echo "  - $candidate"
              done

              echo
              echo "Repository files:"
              find . -maxdepth 6 -type f | sort

              exit 1
            fi

            # ---------------------------------------------------
            # Extract selected project.
            # ---------------------------------------------------
            rm -rf .ycash-project
            mkdir -p .ycash-project

            echo
            echo "=========================================="
            echo "EXTRACTING SELECTED PROJECT"
            echo "=========================================="

            echo "ZIP:"
            echo "$ZIP"

            unzip -q "$ZIP" -d .ycash-project

            # ---------------------------------------------------
            # Locate the project directory.
            #
            # We search for Cargo.toml and then walk upward
            # looking for the directory containing the required
            # project structure.
            # ---------------------------------------------------

            PROJECT_ROOT=""

            while IFS= read -r -d '' cargo_file; do

              candidate_root="$(dirname "$cargo_file")"

              echo
              echo "Checking extracted Cargo project:"
              echo "$candidate_root"

              if [ -d "$candidate_root/crates" ] && \
                 [ -d "$candidate_root/android-app" ]; then

                PROJECT_ROOT="$candidate_root"

                echo "Valid project root found:"
                echo "$PROJECT_ROOT"

                break
              fi

            done < <(
              find .ycash-project \
                -type f \
                -name Cargo.toml \
                -print0
            )

            # ---------------------------------------------------
            # Safety check.
            # ---------------------------------------------------
            if [ -z "$PROJECT_ROOT" ]; then

              echo
              echo "ERROR: ZIP contained Cargo.toml but no valid"
              echo "Ycash project structure was found."

              echo
              echo "Expected:"
              echo "  Cargo.toml"
              echo "  crates/"
              echo "  android-app/"

              echo
              echo "Extracted files:"
              find .ycash-project \
                -maxdepth 8 \
                -type f \
                | sort

              exit 1
            fi

            # ---------------------------------------------------
            # Copy project to GitHub repository root.
            # ---------------------------------------------------
            echo
            echo "Copying project to repository root..."

            cp -a "$PROJECT_ROOT"/. .

            rm -rf .ycash-project

          fi

          # =====================================================
          # FINAL PROJECT ROOT VERIFICATION
          # =====================================================

          echo
          echo "=========================================="
          echo "FINAL PROJECT ROOT"
          echo "=========================================="

          pwd

          echo
          echo "Root contents:"
          ls -la

          echo
          echo "Checking required files..."

          test -f Cargo.toml
          test -d crates
          test -d android-app

          echo
          echo "Cargo.toml:"
          ls -lh Cargo.toml

          echo
          echo "Project directories:"

          for dir in \
            crates \
            android-app \
            cpp \
            tests \
            tools \
            .github
          do
            if [ -d "$dir" ]; then
              echo "  OK: $dir/"
            else
              echo "  NOTE: $dir/ not present"
            fi
          done

          echo
          echo "=========================================="
          echo "PROJECT ROOT READY"
          echo "=========================================="

      # =========================================================
      # 3. JAVA 17
      # =========================================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # =========================================================
      # 4. ANDROID SDK
      # =========================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      # =========================================================
      # 5. ANDROID PLATFORM + NDK
      # =========================================================
      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;35.0.0" \
            "ndk;${ANDROID_NDK}"

          echo
          echo "Android SDK installed."

      # =========================================================
      # 6. RUST
      # =========================================================
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.RUST_TARGET }}

      # =========================================================
      # 7. CONFIGURE ANDROID RUST LINKER
      # =========================================================
      - name: Configure Android Rust linker
        shell: bash
        run: |
          set -euo pipefail

          NDK="$ANDROID_HOME/ndk/${ANDROID_NDK}"
          LLVM="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          echo "NDK:"
          echo "$NDK"

          echo
          echo "LLVM:"
          echo "$LLVM"

          test -x "$LLVM/aarch64-linux-android${ANDROID_API}-clang"
          test -x "$LLVM/llvm-ar"

          mkdir -p .cargo

          cat > .cargo/config.toml <<EOF
          [target.aarch64-linux-android]
          linker = "$LLVM/aarch64-linux-android${ANDROID_API}-clang"
          ar = "$LLVM/llvm-ar"
          EOF

          echo
          echo "Cargo Android linker configuration:"
          cat .cargo/config.toml

          echo "CC_aarch64_linux_android=$LLVM/aarch64-linux-android${ANDROID_API}-clang" >> "$GITHUB_ENV"
          echo "CXX_aarch64_linux_android=$LLVM/aarch64-linux-android${ANDROID_API}-clang++" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$LLVM/llvm-ar" >> "$GITHUB_ENV"
          echo "RANLIB_aarch64_linux_android=$LLVM/llvm-ranlib" >> "$GITHUB_ENV"

      # =========================================================
      # 8. VERIFY RUST WORKSPACE
      # =========================================================
      - name: Verify Rust workspace
        shell: bash
        run: |
          set -euo pipefail

          echo "Rust version:"
          rustc --version

          echo
          echo "Cargo version:"
          cargo --version

          echo
          echo "Checking Cargo workspace..."

          test -f Cargo.toml

          cargo metadata \
            --format-version 1 \
            --no-deps

          echo
          echo "Cargo workspace verified."

      # =========================================================
      # 9. CARGO CACHE
      # =========================================================
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ycash-${{ runner.os }}-${{ env.RUST_TARGET }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ycash-${{ runner.os }}-${{ env.RUST_TARGET }}-
            ycash-${{ runner.os }}-

      # =========================================================
      # 10. BUILD RUST ANDROID NODE
      # =========================================================
      - name: Build Ycash ARM64 Android node
        shell: bash
        run: |
          set -euo pipefail

          cargo build \
            --release \
            --target "${RUST_TARGET}" \
            -p ycash-android-node

      # =========================================================
      # 11. VERIFY ARM64 NODE
      # =========================================================
      - name: Verify ARM64 node binary
        shell: bash
        run: |
          set -euo pipefail

          NODE="target/${RUST_TARGET}/release/ycash-android-node"

          test -f "$NODE"
          test -x "$NODE"

          echo "Node binary:"
          ls -lh "$NODE"

          echo
          echo "File type:"
          file "$NODE"

          echo
          echo "ELF information:"
          readelf -h "$NODE" | grep -E \
            "Class:|Machine:|Type:"

          echo
          echo "Native dependencies:"
          readelf -d "$NODE" | grep NEEDED || true

      # =========================================================
      # 12. BUNDLE EXACT RUST NODE INTO APK ASSETS
      # =========================================================
      - name: Bundle Rust node into Android app
        shell: bash
        run: |
          set -euo pipefail

          NODE="target/${RUST_TARGET}/release/ycash-android-node"
          ASSETS="android-app/app/src/main/assets"

          mkdir -p "$ASSETS"

          rm -f "$ASSETS/ycash-android-node"

          cp "$NODE" "$ASSETS/ycash-android-node"

          chmod 755 "$ASSETS/ycash-android-node"

          test -f "$ASSETS/ycash-android-node"

          echo "Bundled node:"
          ls -lh "$ASSETS/ycash-android-node"

      # =========================================================
      # 13. VERIFY ANDROID PROJECT
      # =========================================================
      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          test -f android-app/settings.gradle
          test -f android-app/app/build.gradle
          test -f android-app/app/src/main/AndroidManifest.xml
          test -f android-app/app/src/main/assets/ycash-android-node

          echo "Android project verified."

      # =========================================================
      # 14. GRADLE
      # =========================================================
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # =========================================================
      # 15. BUILD APK
      # =========================================================
      - name: Build Android APK with Gradle
        working-directory: android-app
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            assembleDebug

      # =========================================================
      # 16. LOCATE GRADLE APK
      # =========================================================
      - name: Locate Gradle APK
        id: locate_apk
        shell: bash
        run: |
          set -euo pipefail

          APK="android-app/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"

          echo "Gradle APK:"
          ls -lh "$APK"

      # =========================================================
      # 17. VERIFY BUNDLED RUST NODE
      # =========================================================
      - name: Verify native node in Gradle APK
        shell: bash
        run: |
          set -euo pipefail

          APK="${{ steps.locate_apk.outputs.apk }}"

          echo "Checking bundled Rust node..."

          unzip -l "$APK" | grep \
            "assets/ycash-android-node"

          echo
          echo "Required bundled files are present."

      # =========================================================
      # 18. GENERATE TEMPORARY DEBUG KEY
      # =========================================================
      - name: Generate temporary debug signing key
        shell: bash
        run: |
          set -euo pipefail

          rm -f "$CI_KEYSTORE"

          keytool \
            -genkeypair \
            -v \
            -keystore "$CI_KEYSTORE" \
            -storepass "$CI_KEYSTORE_PASSWORD" \
            -keypass "$CI_KEY_PASSWORD" \
            -alias "$CI_KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname \
              "CN=Ycash CI Debug, OU=Development, O=Ycash, L=CI, ST=CI, C=GB"

          test -f "$CI_KEYSTORE"

          echo
          echo "Temporary CI signing key generated."

      # =========================================================
      # 19. ZIPALIGN
      # =========================================================
      - name: Zipalign APK
        shell: bash
        run: |
          set -euo pipefail

          INPUT="android-app/app/build/outputs/apk/debug/app-debug.apk"
          ALIGNED="android-app/app/build/outputs/apk/debug/ycash-android-node-aligned.apk"

          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"

          test -x "$ZIPALIGN"
          test -f "$INPUT"

          rm -f "$ALIGNED"

          "$ZIPALIGN" \
            -f \
            -p \
            4 \
            "$INPUT" \
            "$ALIGNED"

          test -f "$ALIGNED"

          echo "Aligned APK:"
          ls -lh "$ALIGNED"

      # =========================================================
      # 20. VERIFY ZIPALIGN
      # =========================================================
      - name: Verify zip alignment
        shell: bash
        run: |
          set -euo pipefail

          ALIGNED="android-app/app/build/outputs/apk/debug/ycash-android-node-aligned.apk"

          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"

          "$ZIPALIGN" \
            -c \
            -p \
            -v \
            4 \
            "$ALIGNED"

      # =========================================================
      # 21. SIGN ALIGNED APK
      # =========================================================
      - name: Sign aligned APK
        shell: bash
        run: |
          set -euo pipefail

          ALIGNED="android-app/app/build/outputs/apk/debug/ycash-android-node-aligned.apk"

          SIGNED="android-app/app/build/outputs/apk/debug/ycash-android-node-debug-signed.apk"

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          test -x "$APKSIGNER"
          test -f "$ALIGNED"

          rm -f "$SIGNED"

          "$APKSIGNER" sign \
            --ks "$CI_KEYSTORE" \
            --ks-key-alias "$CI_KEY_ALIAS" \
            --ks-pass "pass:$CI_KEYSTORE_PASSWORD" \
            --key-pass "pass:$CI_KEY_PASSWORD" \
            --out "$SIGNED" \
            "$ALIGNED"

          test -f "$SIGNED"

          echo
          echo "Signed APK:"
          ls -lh "$SIGNED"

      # =========================================================
      # 22. VERIFY APK SIGNATURE
      # =========================================================
      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          SIGNED="android-app/app/build/outputs/apk/debug/ycash-android-node-debug-signed.apk"

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          "$APKSIGNER" verify \
            --verbose \
            "$SIGNED"

          echo
          echo "APK signature verification passed."

      # =========================================================
      # 23. VERIFY FINAL APK CONTENTS
      # =========================================================
      - name: Verify final signed APK contents
        shell: bash
        run: |
          set -euo pipefail

          SIGNED="android-app/app/build/outputs/apk/debug/ycash-android-node-debug-signed.apk"

          echo "Checking final APK..."

          echo
          echo "Rust node:"
          unzip -l "$SIGNED" | grep \
            "assets/ycash-android-node"

          echo
          echo "Final APK contents verified."

      # =========================================================
      # 24. FINAL APK INFORMATION
      # =========================================================
      - name: Display final APK information
        shell: bash
        run: |
          set -euo pipefail

          SIGNED="android-app/app/build/outputs/apk/debug/ycash-android-node-debug-signed.apk"

          echo "=========================================="
          echo "FINAL APK"
          echo "=========================================="

          ls -lh "$SIGNED"

          echo
          echo "SHA-256:"
          sha256sum "$SIGNED"

      # =========================================================
      # 25. UPLOAD SIGNED APK
      # =========================================================
      - name: Upload signed debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ycash-android-node-debug-signed
          path: android-app/app/build/outputs/apk/debug/ycash-android-node-debug-signed.apk
          if-no-files-found: error

      # =========================================================
      # 26. UPLOAD RAW ARM64 NODE
      # =========================================================
      - name: Upload ARM64 node
        uses: actions/upload-artifact@v4
        with:
          name: ycash-android-node-arm64
          path: target/${{ env.RUST_TARGET }}/release/ycash-android-node
          if-no-files-found: error

      # =========================================================
      # 27. CLEAN TEMPORARY SIGNING KEY
      # =========================================================
      - name: Remove temporary signing key
        if: always()
        shell: bash
        run: |
          rm -f "$CI_KEYSTORE"

          echo "Temporary signing key removed."
