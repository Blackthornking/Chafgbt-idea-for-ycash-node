name: Extract ZIP

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find ZIP file
        id: zip
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "No ZIP file found in repository root."
            exit 1
          fi

          echo "Found ZIP: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP
        shell: bash
        run: |
          mkdir -p extracted
          unzip -o "${{ steps.zip.outputs.zip }}" -d extracted

      - name: Show extracted files
        shell: bash
        run: |
          echo "Extracted project:"
          find extracted -maxdepth 3 -type f | sort

      - name: Upload extracted project
        uses: actions/upload-artifact@v4
        with:
          name: extracted-project
          path: extracted/
