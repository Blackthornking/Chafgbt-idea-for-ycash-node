name: Build Ycash Android Node

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  ANDROID_API: "35"
  ANDROID_NDK: "27.2.12479018"
  RUST_TARGET: "aarch64-linux-android"
  VCPKG_TRIPLET: "arm64-android"

  CI_KEY_ALIAS: "ycash-temp"
  CI_KEYSTORE_PASSWORD: "temporary123"
  CI_KEY_PASSWORD: "temporary123"

jobs:
  build:
    name: Build Android ARM64 Ycash Node
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. FIND AND EXTRACT PROJECT ZIP
      # ============================================================
      - name: Find project ZIP
        id: find_zip
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find "$GITHUB_WORKSPACE" \
            -maxdepth 1 \
            -type f \
            -iname '*.zip' \
            -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "::error::No ZIP file found in repository root."
            exit 1
          fi

          echo "Using ZIP: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/extracted"
          mkdir -p "$GITHUB_WORKSPACE/extracted"

          unzip -q -o \
            "${{ steps.find_zip.outputs.zip }}" \
            -d "$GITHUB_WORKSPACE/extracted"

          echo "===== Extracted files ====="

          find "$GITHUB_WORKSPACE/extracted" \
            -maxdepth 5 \
            -type f \
            | sort \
            | head -300

      # ============================================================
      # 3. LOCATE ANDROID PROJECT
      # ============================================================
      - name: Locate Android project
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="$(find "$GITHUB_WORKSPACE/extracted" \
            -name settings.gradle.kts \
            -type f \
            -print -quit)"

          if [ -z "$PROJECT" ]; then
            echo "::error::Could not find settings.gradle.kts."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT")"
          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"

          echo "Android project: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 4. CREATE DEFAULT YCASH CONFIG
      #
      # This creates a safe default configuration inside the
      # Android project's assets.
      #
      # APK location:
      #
      #   assets/ycash/ycash.conf
      #
      # The Android application can copy this file into its
      # writable private node data directory on first launch.
      #
      # IMPORTANT:
      # APK assets are read-only. The Options UI must edit the
      # writable copy after it has been copied by the application.
      # ============================================================
      - name: Create default ycash.conf
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          CONFIG_DIR="app/src/main/assets/ycash"
          CONFIG_FILE="$CONFIG_DIR/ycash.conf"

          mkdir -p "$CONFIG_DIR"

          cat > "$CONFIG_FILE" <<'EOF'
          # ============================================================
          # Ycash Android Node Configuration
          # ============================================================
          #
          # This is the default configuration packaged with the
          # Android Ycash node.
          #
          # On first launch, the Android application should copy this
          # file to its writable private node data directory.
          #
          # The Options screen should modify the writable copy.
          #
          # ============================================================

          # Run as a server/node.
          server=1

          # Listen for peer connections.
          listen=1

          # Local RPC interface.
          rpcbind=127.0.0.1

          # Only allow local Android application RPC access.
          rpcallowip=127.0.0.1

          # Maintain transaction index.
          txindex=1
          EOF

          echo "=========================================="
          echo "DEFAULT YCASH CONFIG CREATED"
          echo "=========================================="

          test -f "$CONFIG_FILE"

          echo
          echo "Config path:"
          echo "$CONFIG_FILE"

          echo
          echo "Config contents:"
          cat "$CONFIG_FILE"

          echo
          echo "Config size:"
          wc -c "$CONFIG_FILE"

      # ============================================================
      # 5. FIX JVM TARGETS
      # ============================================================
      - name: Fix Kotlin/Java JVM target mismatch
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_FILE="app/build.gradle.kts"

          if [ ! -f "$GRADLE_FILE" ]; then
            echo "::error::$GRADLE_FILE not found."
            exit 1
          fi

          if grep -q "compileOptions" "$GRADLE_FILE"; then
            echo "compileOptions already present."
          else
            python3 - "$GRADLE_FILE" <<'PYEOF'
          import sys

          path = sys.argv[1]

          with open(path, encoding="utf-8") as f:
              content = f.read()

          patch = r'''
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          '''

          marker = "buildFeatures { buildConfig = true }"

          if marker in content:
              content = content.replace(
                  marker,
                  marker + "\n" + patch,
                  1
              )
          elif "\ndependencies" in content:
              content = content.replace(
                  "\n}\n\ndependencies",
                  "\n" + patch + "\n}\n\ndependencies",
                  1
              )

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          PYEOF
          fi

          echo "===== app/build.gradle.kts ====="
          cat "$GRADLE_FILE"

      # ============================================================
      # 6. JAVA
      # ============================================================
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ============================================================
      # 7. ANDROID SDK / NDK
      # ============================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager "platform-tools"
          sdkmanager "platforms;android-${ANDROID_API}"
          sdkmanager "build-tools;35.0.0"
          sdkmanager "ndk;${ANDROID_NDK}"

          yes | sdkmanager --licenses >/dev/null || true

      # ============================================================
      # 8. RUST
      # ============================================================
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.RUST_TARGET }}

      # ============================================================
      # 9. LOCATE YCASHD
      # ============================================================
      - name: Locate ycashd source
        id: ycashd
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="$(
            find "$GITHUB_WORKSPACE/extracted" \
              -type f \
              -name configure.ac \
              -path '*ycashd*' \
              -print -quit || true
          )"

          if [ -z "$SOURCE" ]; then
            SOURCE="$(
              find "$GITHUB_WORKSPACE/extracted" \
                -type f \
                -name configure.ac \
                -print -quit || true
            )"
          fi

          if [ -z "$SOURCE" ]; then
            echo "::error::Could not locate ycashd source."
            exit 1
          fi

          YDIR="$(dirname "$SOURCE")"
          YDIR="$(cd "$YDIR" && pwd)"

          echo "ycashd source: $YDIR"
          echo "ycashd_dir=$YDIR" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 10. INSPECT SOURCE
      # ============================================================
      - name: Inspect source tree
        shell: bash
        run: |
          set -euo pipefail

          YDIR="${{ steps.ycashd.outputs.ycashd_dir }}"

          echo "===== ycashd ====="
          ls -la "$YDIR"

          test -f "$YDIR/configure.ac"
          test -f "$YDIR/Makefile.am"

          echo "===== Rust ====="
          test -f "$YDIR/Cargo.toml" || true

      # ============================================================
      # 11. ANDROID ARM64 TOOLCHAIN
      # ============================================================
      - name: Configure Android ARM64 environment
        shell: bash
        run: |
          set -euo pipefail

          NDK="$ANDROID_HOME/ndk/$ANDROID_NDK"

          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          echo "NDK=$NDK"
          echo "TOOLCHAIN=$TOOLCHAIN"

          test -x "$TOOLCHAIN/aarch64-linux-android35-clang"
          test -x "$TOOLCHAIN/aarch64-linux-android35-clang++"

          echo "CC=$TOOLCHAIN/aarch64-linux-android35-clang" >> "$GITHUB_ENV"
          echo "CXX=$TOOLCHAIN/aarch64-linux-android35-clang++" >> "$GITHUB_ENV"
          echo "AR=$TOOLCHAIN/llvm-ar" >> "$GITHUB_ENV"
          echo "RANLIB=$TOOLCHAIN/llvm-ranlib" >> "$GITHUB_ENV"
          echo "STRIP=$TOOLCHAIN/llvm-strip" >> "$GITHUB_ENV"

          echo "$TOOLCHAIN" >> "$GITHUB_PATH"

          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"

      # ============================================================
      # 12. LOCATE MATCHING NDK LIBC++ RUNTIME
      # ============================================================
      - name: Locate matching NDK libc++ runtime
        id: libcxx
        shell: bash
        run: |
          set -euo pipefail

          NDK="$ANDROID_NDK_HOME"

          LIBCXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so"

          echo "NDK:"
          echo "$NDK"

          echo "Expected libc++ runtime:"
          echo "$LIBCXX"

          if [ ! -f "$LIBCXX" ]; then
            echo "::error::Matching libc++_shared.so was not found."

            find "$NDK" \
              -name libc++_shared.so \
              -type f \
              -print

            exit 1
          fi

          echo "libc++_shared.so found."

          file "$LIBCXX"
          ls -lh "$LIBCXX"

          echo "libcxx=$LIBCXX" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 13. CARGO ANDROID LINKER
      # ============================================================
      - name: Point Cargo at the NDK linker
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.cargo"

          cat > "$HOME/.cargo/config.toml" <<EOF
          [target.aarch64-linux-android]
          linker = "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API}-clang"
          EOF

          cat "$HOME/.cargo/config.toml"

      # ============================================================
      # 14. AUTOTOOLS
      # ============================================================
      - name: Install autotools for vcpkg
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            autoconf \
            autoconf-archive \
            automake \
            libtool

      # ============================================================
      # 15. VCPKG
      # ============================================================
      - name: Set up vcpkg
        shell: bash
        run: |
          set -euo pipefail

          git clone \
            --depth 1 \
            https://github.com/microsoft/vcpkg.git \
            "$HOME/vcpkg"

          "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics

          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"

      # ============================================================
      # 16. BUILD ANDROID DEPENDENCIES
      # ============================================================
      - name: Build Boost, libevent, libsodium for Android ARM64
        shell: bash
        run: |
          set -euo pipefail

          "$VCPKG_ROOT/vcpkg" install \
            boost-system \
            boost-filesystem \
            boost-program-options \
            boost-thread \
            boost-chrono \
            boost-signals2 \
            boost-multi-index \
            boost-assign \
            boost-format \
            boost-iostreams \
            boost-interprocess \
            boost-math \
            boost-random \
            boost-uuid \
            boost-dynamic-bitset \
            boost-scope-exit \
            libevent \
            libsodium \
            --triplet "$VCPKG_TRIPLET"

          VCPKG_INSTALLED="$VCPKG_ROOT/installed/$VCPKG_TRIPLET"

          test -d "$VCPKG_INSTALLED/include/boost"
          test -f "$VCPKG_INSTALLED/include/sodium.h"

          echo "VCPKG_INSTALLED=$VCPKG_INSTALLED" >> "$GITHUB_ENV"

      # ============================================================
      # 17. BUILD REAL YCASHD
      # ============================================================
      - name: Build ycashd for Android ARM64
        working-directory: ${{ steps.ycashd.outputs.ycashd_dir }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Starting Android ARM64 ycashd build..."

          find . -name "*.sh" -exec chmod +x {} +

          rustup show
          rustup target add aarch64-linux-android

          if [ -x ./autogen.sh ]; then
            ./autogen.sh
          fi

          export PKG_CONFIG_LIBDIR="$VCPKG_INSTALLED/lib/pkgconfig"
          unset PKG_CONFIG_PATH || true

          export CPPFLAGS="-I$VCPKG_INSTALLED/include"
          export LDFLAGS="-L$VCPKG_INSTALLED/lib"

          ./configure \
            --host=aarch64-linux-android \
            --with-boost="$VCPKG_INSTALLED" \
            --enable-online-rust \
            --disable-wallet \
            --disable-mining \
            --disable-tests \
            --disable-bench

          make -j"$(nproc)"

      # ============================================================
      # 18. FIND YCASHD BINARY
      # ============================================================
      - name: Find ycashd binary
        id: binary
        shell: bash
        run: |
          set -euo pipefail

          YDIR="${{ steps.ycashd.outputs.ycashd_dir }}"

          BIN="$(
            find "$YDIR" \
              -type f \
              \( -name ycashd -o -name ycashd.exe \) \
              -perm -111 \
              -print -quit || true
          )"

          if [ -z "$BIN" ]; then
            echo "::error::Android ARM64 ycashd binary was not produced."

            find "$YDIR" \
              -type f \
              -perm -111 \
              | head -100

            exit 1
          fi

          BIN="$(cd "$(dirname "$BIN")" && pwd)/$(basename "$BIN")"

          file "$BIN"
          ls -lh "$BIN"

          echo "binary=$BIN" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 19. INSPECT YCASHD ELF DEPENDENCIES
      # ============================================================
      - name: Inspect ycashd native dependencies
        shell: bash
        run: |
          set -euo pipefail

          BIN="${{ steps.binary.outputs.binary }}"

          echo "=========================================="
          echo "YCASHD ELF DEPENDENCIES"
          echo "=========================================="

          file "$BIN"

          echo
          echo "DT_NEEDED entries:"

          readelf -d "$BIN" \
            | grep "NEEDED" \
            || true

          echo
          echo "Searching for libc++ dependency:"

          if readelf -d "$BIN" | grep -q "libc++_shared.so"; then
            echo "libc++_shared.so is a required dependency."
          else
            echo "::warning::libc++_shared.so is not shown directly in DT_NEEDED."
            echo "The dependency chain will still be checked after packaging."
          fi

      # ============================================================
      # 20. PACKAGE YCASHD + MATCHING LIBC++
      # ============================================================
      - name: Package ycashd and libc++ into Android application
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.locate.outputs.project_dir }}"
          BIN="${{ steps.binary.outputs.binary }}"
          LIBCXX="${{ steps.libcxx.outputs.libcxx }}"

          JNI_DIR="$PROJECT/app/src/main/jniLibs/arm64-v8a"

          mkdir -p "$JNI_DIR"

          rm -f "$JNI_DIR/libycashd.so"
          rm -f "$JNI_DIR/libc++_shared.so"

          cp "$BIN" "$JNI_DIR/libycashd.so"

          echo "===== ycashd before stripping ====="
          ls -lh "$JNI_DIR/libycashd.so"
          file "$JNI_DIR/libycashd.so"

          if [ -x "${STRIP:-}" ]; then
            "$STRIP" --strip-unneeded "$JNI_DIR/libycashd.so"
          else
            echo "::warning::llvm-strip not found; shipping unstripped ycashd."
          fi

          chmod 755 "$JNI_DIR/libycashd.so"

          cp "$LIBCXX" "$JNI_DIR/libc++_shared.so"

          chmod 644 "$JNI_DIR/libc++_shared.so"

          echo
          echo "=========================================="
          echo "PACKAGED NATIVE LIBRARIES"
          echo "=========================================="

          ls -lh "$JNI_DIR/libycashd.so"
          ls -lh "$JNI_DIR/libc++_shared.so"

          file "$JNI_DIR/libycashd.so"
          file "$JNI_DIR/libc++_shared.so"

          echo
          echo "Native library directory:"
          find "$JNI_DIR" \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

          test -f "$JNI_DIR/libycashd.so"
          test -f "$JNI_DIR/libc++_shared.so"

      # ============================================================
      # 21. VERIFY PACKAGED NATIVE LIBRARIES
      # ============================================================
      - name: Verify packaged native libraries
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.locate.outputs.project_dir }}"

          DAEMON="$PROJECT/app/src/main/jniLibs/arm64-v8a/libycashd.so"
          LIBCXX="$PROJECT/app/src/main/jniLibs/arm64-v8a/libc++_shared.so"

          test -f "$DAEMON"
          test -f "$LIBCXX"

          echo "=========================================="
          echo "PACKAGED NATIVE LIBRARY VERIFICATION"
          echo "=========================================="

          echo
          echo "ycashd:"
          file "$DAEMON"
          ls -lh "$DAEMON"

          echo
          echo "libc++_shared.so:"
          file "$LIBCXX"
          ls -lh "$LIBCXX"

          echo
          echo "===== ycashd DT_NEEDED ====="

          readelf -d "$DAEMON" \
            | grep "NEEDED" \
            || true

          echo
          echo "===== libc++ DT_NEEDED ====="

          readelf -d "$LIBCXX" \
            | grep "NEEDED" \
            || true

          echo
          echo "===== Confirm libc++ runtime ====="

          if [ ! -s "$LIBCXX" ]; then
            echo "::error::libc++_shared.so is empty."
            exit 1
          fi

          echo "libc++_shared.so exists and is non-empty."

      # ============================================================
      # 22. VERIFY PACKAGED YCASHD
      # ============================================================
      - name: Verify packaged ycashd
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.locate.outputs.project_dir }}"

          DAEMON="$PROJECT/app/src/main/jniLibs/arm64-v8a/libycashd.so"

          test -f "$DAEMON"
          test -x "$DAEMON"

          echo "===== ycashd ELF header ====="

          file "$DAEMON"

          if ! file "$DAEMON" | grep -qi "pie executable"; then
            echo "::error::ycashd is not a PIE executable; Android may refuse to run it."
            exit 1
          fi

          echo "===== ycashd permissions ====="

          ls -l "$DAEMON"

      # ============================================================
      # 23. CONFIRM NATIVE LIBRARY PACKAGING SETTINGS
      # ============================================================
      - name: Confirm native library packaging
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="app/src/main/AndroidManifest.xml"
          GRADLE_FILE="app/build.gradle.kts"

          if [ ! -f "$MANIFEST" ]; then
            echo "::error::$MANIFEST not found."
            exit 1
          fi

          if [ ! -f "$GRADLE_FILE" ]; then
            echo "::error::$GRADLE_FILE not found."
            exit 1
          fi

          echo "===== AndroidManifest.xml native extraction ====="

          if ! grep -q 'android:extractNativeLibs="true"' "$MANIFEST"; then
            echo "::error::extractNativeLibs is not true."
            exit 1
          fi

          echo "extractNativeLibs=true confirmed."

          echo
          echo "===== Gradle JNI packaging ====="

          if ! grep -q 'useLegacyPackaging = true' "$GRADLE_FILE"; then
            echo "::error::jniLibs.useLegacyPackaging = true was not found."
            exit 1
          fi

          echo "useLegacyPackaging=true confirmed."

          echo
          echo "Native library packaging settings are correct."

      # ============================================================
      # 24. VERIFY DEFAULT YCASH CONFIG BEFORE APK BUILD
      #
      # This confirms that the config created in step 4 still exists
      # immediately before Gradle packages the application.
      # ============================================================
      - name: Verify default ycash.conf
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          CONFIG_FILE="app/src/main/assets/ycash/ycash.conf"

          echo "=========================================="
          echo "VERIFY DEFAULT YCASH CONFIG"
          echo "=========================================="

          if [ ! -f "$CONFIG_FILE" ]; then
            echo "::error::ycash.conf is missing."
            exit 1
          fi

          if [ ! -s "$CONFIG_FILE" ]; then
            echo "::error::ycash.conf is empty."
            exit 1
          fi

          echo "Config found:"
          echo "$CONFIG_FILE"

          echo
          echo "===== Config ====="
          cat "$CONFIG_FILE"

          echo
          echo "Config verification successful."

      # ============================================================
      # 25. PREPARE GRADLE
      # ============================================================
      - name: Prepare Gradle
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f gradlew ]; then
            echo "Gradle wrapper not present; generating one."

            if ! command -v gradle >/dev/null 2>&1; then
              echo "Installing Gradle locally..."

              GRADLE_VERSION="8.7"

              curl -fsSL \
                "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
                -o "$RUNNER_TEMP/gradle.zip"

              rm -rf "$RUNNER_TEMP/gradle"

              unzip -q \
                "$RUNNER_TEMP/gradle.zip" \
                -d "$RUNNER_TEMP"

              export PATH="$RUNNER_TEMP/gradle/gradle-${GRADLE_VERSION}/bin:$PATH"
            fi

            gradle wrapper \
              --gradle-version 8.7
          fi

          chmod +x gradlew

          echo "Gradle wrapper:"
          ./gradlew --version

      # ============================================================
      # 26. GENERATE TEMPORARY SIGNING KEY
      # ============================================================
      - name: Generate temporary signing key
        shell: bash
        run: |
          set -euo pipefail

          KEYSTORE="$RUNNER_TEMP/ycash-temp-release.keystore"

          rm -f "$KEYSTORE"

          keytool \
            -genkeypair \
            -v \
            -keystore "$KEYSTORE" \
            -storetype JKS \
            -storepass "$CI_KEYSTORE_PASSWORD" \
            -keypass "$CI_KEY_PASSWORD" \
            -alias "$CI_KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -dname "CN=Ycash Temporary Build, OU=Development, O=Ycash, L=Local, ST=Local, C=GB"

          chmod 600 "$KEYSTORE"

          echo "KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"

          echo "Temporary CI signing key generated."

      # ============================================================
      # 27. BUILD RELEASE APK
      # ============================================================
      - name: Build release APK
        id: build_apk
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleRelease

          echo "===== Release APKs ====="

          find "$PWD/app/build/outputs/apk" \
            -type f \
            -name '*.apk' \
            -print

      # ============================================================
      # 28. LOCATE APK
      # ============================================================
      - name: Locate unsigned APK
        id: unsigned_apk
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find "$PWD/app/build/outputs/apk" \
              -type f \
              -name '*.apk' \
              -print -quit
          )"

          if [ -z "$APK" ]; then
            echo "::error::No APK was produced."

            find "$PWD/app/build" \
              -type f \
              | sort \
              | head -300

            exit 1
          fi

          APK="$(realpath "$APK")"

          echo "Unsigned APK:"
          echo "$APK"

          file "$APK"
          ls -lh "$APK"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 29. VERIFY CONFIG IS INSIDE APK
      #
      # This is the new critical APK-level config check.
      # ============================================================
      - name: Verify ycash.conf inside APK
        shell: bash
        run: |
          set -euo pipefail

          APK="${{ steps.unsigned_apk.outputs.apk }}"

          test -f "$APK"

          echo "=========================================="
          echo "VERIFYING YCASH CONFIG INSIDE APK"
          echo "=========================================="

          if ! unzip -l "$APK" \
              | grep -q 'assets/ycash/ycash.conf'; then
            echo "::error::ycash.conf is missing from APK."
            exit 1
          fi

          echo "ycash.conf FOUND inside APK."

          echo
          echo "===== APK config entry ====="

          unzip -l "$APK" \
            | grep 'assets/ycash/ycash.conf'

          echo
          echo "===== Extracting config for verification ====="

          TEMP_CONFIG="$RUNNER_TEMP/ycash.conf"

          rm -f "$TEMP_CONFIG"

          unzip -p "$APK" \
            'assets/ycash/ycash.conf' \
            > "$TEMP_CONFIG"

          test -s "$TEMP_CONFIG"

          echo
          echo "===== Packaged config contents ====="

          cat "$TEMP_CONFIG"

          echo
          echo "Ycash configuration successfully packaged into APK."

      # ============================================================
      # 30. VERIFY REQUIRED NATIVE LIBRARIES ARE IN APK
      # ============================================================
      - name: Verify native libraries inside APK
        shell: bash
        run: |
          set -euo pipefail

          APK="${{ steps.unsigned_apk.outputs.apk }}"

          test -f "$APK"

          echo "=========================================="
          echo "VERIFYING NATIVE LIBRARIES IN APK"
          echo "=========================================="

          echo
          echo "Searching APK for libycashd.so..."

          if ! unzip -l "$APK" | grep -q 'lib/arm64-v8a/libycashd.so'; then
            echo "::error::libycashd.so is missing from APK."
            exit 1
          fi

          echo "libycashd.so FOUND."

          echo
          echo "Searching APK for libc++_shared.so..."

          if ! unzip -l "$APK" | grep -q 'lib/arm64-v8a/libc++_shared.so'; then
            echo "::error::libc++_shared.so is missing from APK."
            exit 1
          fi

          echo "libc++_shared.so FOUND."

          echo
          echo "===== Native libraries in APK ====="

          unzip -l "$APK" \
            | grep 'lib/arm64-v8a/'

          echo
          echo "Both required ARM64 native libraries are inside the APK."

      # ============================================================
      # 31. VERIFY LIBRARY COMPRESSION
      # ============================================================
      - name: Verify native libraries are stored uncompressed
        shell: bash
        run: |
          set -euo pipefail

          APK="${{ steps.unsigned_apk.outputs.apk }}"

          echo "=========================================="
          echo "NATIVE LIBRARY COMPRESSION CHECK"
          echo "=========================================="

          echo
          echo "ycashd:"
          unzip -v "$APK" \
            | grep 'lib/arm64-v8a/libycashd.so' \
            || true

          echo
          echo "libc++:"
          unzip -v "$APK" \
            | grep 'lib/arm64-v8a/libc++_shared.so' \
            || true

          echo
          echo "The Gradle packaging configuration is expected to store"
          echo "these native libraries uncompressed."

      # ============================================================
      # 32. ZIPALIGN APK
      # ============================================================
      - name: Zipalign APK
        id: aligned
        shell: bash
        run: |
          set -euo pipefail

          INPUT="${{ steps.unsigned_apk.outputs.apk }}"

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          ZIPALIGN="$BUILD_TOOLS/zipalign"

          ALIGNED="$RUNNER_TEMP/YcashNode-Android-ARM64-aligned.apk"

          echo "INPUT=$INPUT"
          echo "ALIGNED=$ALIGNED"

          test -f "$INPUT"
          test -x "$ZIPALIGN"

          rm -f "$ALIGNED"

          "$ZIPALIGN" \
            -f \
            -p \
            4 \
            "$INPUT" \
            "$ALIGNED"

          test -f "$ALIGNED"

          echo "Aligned APK:"
          ls -lh "$ALIGNED"

          echo "apk=$ALIGNED" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 33. SIGN FINAL APK
      # ============================================================
      - name: Sign final APK with temporary CI key
        id: signed
        shell: bash
        run: |
          set -euo pipefail

          INPUT="${{ steps.aligned.outputs.apk }}"

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          APKSIGNER="$BUILD_TOOLS/apksigner"

          SIGNED="$RUNNER_TEMP/YcashNode-Android-ARM64-SIGNED.apk"

          echo "INPUT=$INPUT"
          echo "SIGNED=$SIGNED"

          test -f "$INPUT"
          test -x "$APKSIGNER"
          test -f "$KEYSTORE"

          rm -f "$SIGNED"

          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-type JKS \
            --ks-pass "pass:$CI_KEYSTORE_PASSWORD" \
            --key-pass "pass:$CI_KEY_PASSWORD" \
            --ks-key-alias "$CI_KEY_ALIAS" \
            --out "$SIGNED" \
            "$INPUT"

          test -f "$SIGNED"

          echo "Signed APK:"
          ls -lh "$SIGNED"

          echo "apk=$SIGNED" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 34. VERIFY APK SIGNATURE
      # ============================================================
      - name: Verify final APK signature
        shell: bash
        run: |
          set -euo pipefail

          APK="${{ steps.signed.outputs.apk }}"

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          APKSIGNER="$BUILD_TOOLS/apksigner"

          test -f "$APK"
          test -x "$APKSIGNER"

          echo "===== APK SIGNATURE VERIFICATION ====="

          "$APKSIGNER" verify \
            --verbose \
            "$APK"

          echo "===== APK VERIFIED ====="

      # ============================================================
      # 35. VERIFY FINAL APK ALIGNMENT
      # ============================================================
      - name: Verify APK alignment
        shell: bash
        run: |
          set -euo pipefail

          APK="${{ steps.signed.outputs.apk }}"

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          ZIPALIGN="$BUILD_TOOLS/zipalign"

          test -f "$APK"
          test -x "$ZIPALIGN"

          "$ZIPALIGN" \
            -c \
            -p \
            4 \
            "$APK"

          echo "APK alignment verified."

      # ============================================================
      # 36. FINAL SIGNED APK CONFIG VERIFICATION
      #
      # Repeat the config check on the ACTUAL signed APK.
      # ============================================================
      - name: Verify final signed APK ycash.conf
        shell: bash
        run: |
          set -euo pipefail

          APK="${{ steps.signed.outputs.apk }}"

          test -f "$APK"

          echo "=========================================="
          echo "FINAL SIGNED APK CONFIG VERIFICATION"
          echo "=========================================="

          if ! unzip -l "$APK" \
              | grep -q 'assets/ycash/ycash.conf'; then
            echo "::error::Final signed APK is missing ycash.conf."
            exit 1
          fi

          echo "ycash.conf FOUND."

          echo
          echo "===== Final packaged config ====="

          unzip -p "$APK" \
            'assets/ycash/ycash.conf'

          echo
          echo
          echo "Final signed APK contains ycash.conf."

      # ============================================================
      # 37. FINAL APK NATIVE LIBRARY VERIFICATION
      # ============================================================
      - name: Verify final signed APK native libraries
        shell: bash
        run: |
          set -euo pipefail

          APK="${{ steps.signed.outputs.apk }}"

          test -f "$APK"

          echo "=========================================="
          echo "FINAL SIGNED APK NATIVE VERIFICATION"
          echo "=========================================="

          echo
          echo "libycashd.so:"

          if ! unzip -l "$APK" \
              | grep -q 'lib/arm64-v8a/libycashd.so'; then
            echo "::error::Final signed APK is missing libycashd.so."
            exit 1
          fi

          echo "FOUND"

          echo
          echo "libc++_shared.so:"

          if ! unzip -l "$APK" \
              | grep -q 'lib/arm64-v8a/libc++_shared.so'; then
            echo "::error::Final signed APK is missing libc++_shared.so."
            exit 1
          fi

          echo "FOUND"

          echo
          echo "===== Final native libraries ====="

          unzip -l "$APK" \
            | grep 'lib/arm64-v8a/'

          echo
          echo "SUCCESS:"
          echo "Both libycashd.so and libc++_shared.so are present"
          echo "in the final signed ARM64 APK."

      # ============================================================
      # 38. FINAL APK INSPECTION
      # ============================================================
      - name: Inspect final APK
        shell: bash
        run: |
          set -euo pipefail

          APK="${{ steps.signed.outputs.apk }}"

          test -f "$APK"

          echo "=========================================="
          echo "FINAL Ycash NODE APK"
          echo "=========================================="

          ls -lh "$APK"

          file "$APK"

          echo
          echo "===== Signing ====="

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose \
            "$APK"

          echo
          echo "===== APK contents ====="

          unzip -l "$APK" \
            | grep -E \
              'lib/arm64-v8a|assets/ycash/ycash.conf|AndroidManifest.xml' \
            | head -100

          echo
          echo "===== ycashd compression method ====="

          unzip -v "$APK" \
            | grep "libycashd.so" \
            || true

          echo
          echo "===== libc++ compression method ====="

          unzip -v "$APK" \
            | grep "libc++_shared.so" \
            || true

          echo
          echo "===== ycash.conf ====="

          unzip -p "$APK" \
            'assets/ycash/ycash.conf' \
            || true

      # ============================================================
      # 39. COPY FINAL APK TO WORKSPACE
      # ============================================================
      - name: Prepare final APK artifact
        shell: bash
        run: |
          set -euo pipefail

          APK="${{ steps.signed.outputs.apk }}"

          OUT="$GITHUB_WORKSPACE/YcashNode-Android-ARM64-SIGNED.apk"

          test -f "$APK"

          rm -f "$OUT"

          cp "$APK" "$OUT"

          test -f "$OUT"

          echo "Final artifact:"
          ls -lh "$OUT"

      # ============================================================
      # 40. UPLOAD SIGNED ANDROID APK
      # ============================================================
      - name: Upload signed Android APK
        uses: actions/upload-artifact@v4
        with:
          name: YcashNode-Android-ARM64-SIGNED
          path: ${{ github.workspace }}/YcashNode-Android-ARM64-SIGNED.apk
          if-no-files-found: error

      # ============================================================
      # 41. UPLOAD YCASHD SEPARATELY
      # ============================================================
      - name: Upload ycashd ARM64 binary
        uses: actions/upload-artifact@v4
        with:
          name: ycashd-Android-ARM64-unstripped
          path: ${{ steps.binary.outputs.binary }}
          if-no-files-found: error

      # ============================================================
      # 42. CREATE BUILD INFORMATION
      # ============================================================
      - name: Create build information
        shell: bash
        run: |
          set -euo pipefail

          APK="${{ steps.signed.outputs.apk }}"

          cat > "$RUNNER_TEMP/ycash-build-info.txt" <<EOF
          Ycash Android Node
          ==================

          Architecture:
          ARM64 / aarch64

          Android API:
          ${ANDROID_API}

          Android NDK:
          ${ANDROID_NDK}

          Rust target:
          ${RUST_TARGET}

          Build:
          Release

          APK:
          YcashNode-Android-ARM64-SIGNED.apk

          Signing:
          Temporary CI-generated development key

          Permanent production signing key:
          NOT USED

          ycashd:
          Embedded in app nativeLibraryDir as libycashd.so

          C++ runtime:
          Matching libc++_shared.so from NDK ${ANDROID_NDK}

          Native library directory:
          lib/arm64-v8a/

          Required native libraries:
          libycashd.so
          libc++_shared.so

          Native extraction:
          Required for exec of ycashd

          Default configuration:
          assets/ycash/ycash.conf

          Configuration:
          Packaged into APK

          Configuration editing:
          Android application should copy the packaged config
          to its writable private node directory on first launch.

          APK signature:
          Verified with apksigner

          APK alignment:
          Verified with zipalign -c -p 4

          Final config verification:
          assets/ycash/ycash.conf PRESENT

          Final native-library verification:
          libycashd.so PRESENT
          libc++_shared.so PRESENT
          EOF

          cat "$RUNNER_TEMP/ycash-build-info.txt"

      # ============================================================
      # 43. UPLOAD BUILD INFORMATION
      # ============================================================
      - name: Upload build information
        uses: actions/upload-artifact@v4
        with:
          name: YcashNode-build-information
          path: ${{ runner.temp }}/ycash-build-info.txt
          if-no-files-found: error
