name: Build Ycash Android Node

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  ANDROID_API: "35"
  ANDROID_NDK: "27.2.12479018"
  RUST_TARGET: "aarch64-linux-android"

  # Temporary CI signing key.
  # A new key is generated for every workflow run.
  CI_KEYSTORE: "${{ github.workspace }}/ci-debug.keystore"
  CI_KEY_ALIAS: "ycash-debug"
  CI_KEYSTORE_PASSWORD: "ycash-debug-password"
  CI_KEY_PASSWORD: "ycash-debug-password"

jobs:
  build:
    name: Build, Align, Sign and Verify
    runs-on: ubuntu-22.04

    steps:

      # ---------------------------------------------------------
      # 1. Checkout
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Java 17
      # ---------------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ---------------------------------------------------------
      # 3. Android SDK
      # ---------------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;35.0.0" \
            "ndk;${ANDROID_NDK}"

      # ---------------------------------------------------------
      # 4. Rust
      # ---------------------------------------------------------
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.RUST_TARGET }}

      # ---------------------------------------------------------
      # 5. Configure Android Rust linker
      # ---------------------------------------------------------
      - name: Configure Android linker
        shell: bash
        run: |
          NDK="$ANDROID_HOME/ndk/${ANDROID_NDK}"
          LLVM="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          echo "NDK: $NDK"
          echo "LLVM: $LLVM"

          test -x "$LLVM/aarch64-linux-android35-clang"
          test -x "$LLVM/llvm-ar"

          mkdir -p .cargo

          cat > .cargo/config.toml <<EOF
          [target.aarch64-linux-android]
          linker = "$LLVM/aarch64-linux-android35-clang"
          ar = "$LLVM/llvm-ar"
          EOF

      # ---------------------------------------------------------
      # 6. Rust workspace check
      # ---------------------------------------------------------
      - name: Check Rust workspace
        shell: bash
        run: |
          cargo metadata --format-version 1 --no-deps

      # ---------------------------------------------------------
      # 7. Cargo cache
      # ---------------------------------------------------------
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ycash-${{ runner.os }}-${{ env.RUST_TARGET }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ycash-${{ runner.os }}-${{ env.RUST_TARGET }}-
            ycash-${{ runner.os }}-

      # ---------------------------------------------------------
      # 8. Build ARM64 Rust node
      # ---------------------------------------------------------
      - name: Build Ycash ARM64 node
        shell: bash
        run: |
          cargo build \
            --release \
            --target "${RUST_TARGET}" \
            -p ycash-android-node

      # ---------------------------------------------------------
      # 9. Verify Rust node binary
      # ---------------------------------------------------------
      - name: Verify ARM64 node
        shell: bash
        run: |
          NODE="target/${RUST_TARGET}/release/ycash-android-node"

          test -f "$NODE"
          test -x "$NODE"

          echo "Node:"
          file "$NODE"

          echo
          echo "ELF:"
          readelf -h "$NODE" | grep -E \
            "Class:|Machine:|Type:"

          echo
          echo "Dependencies:"
          readelf -d "$NODE" | grep NEEDED || true

      # ---------------------------------------------------------
      # 10. Copy exact node into Android assets
      # ---------------------------------------------------------
      - name: Bundle Rust node into Android app
        shell: bash
        run: |
          NODE="target/${RUST_TARGET}/release/ycash-android-node"
          ASSETS="android-app/app/src/main/assets"

          mkdir -p "$ASSETS"

          rm -f "$ASSETS/ycash-android-node"

          cp "$NODE" "$ASSETS/ycash-android-node"

          chmod 755 "$ASSETS/ycash-android-node"

          test -f "$ASSETS/ycash-android-node"

          ls -lh "$ASSETS/ycash-android-node"

      # ---------------------------------------------------------
      # 11. Verify Android project
      # ---------------------------------------------------------
      - name: Verify Android project
        shell: bash
        run: |
          test -f android-app/settings.gradle
          test -f android-app/app/build.gradle
          test -f android-app/app/src/main/AndroidManifest.xml
          test -f android-app/app/src/main/assets/ycash-android-node

      # ---------------------------------------------------------
      # 12. Set up Gradle
      # ---------------------------------------------------------
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # ---------------------------------------------------------
      # 13. Build APK
      #
      # IMPORTANT:
      # Gradle/AGP is the ONLY APK packager.
      # We do NOT unzip/rebuild/repack the APK.
      # ---------------------------------------------------------
      - name: Build Android APK with Gradle
        working-directory: android-app
        shell: bash
        run: |
          gradle \
            --no-daemon \
            --stacktrace \
            assembleDebug

      # ---------------------------------------------------------
      # 14. Locate Gradle-generated APK
      # ---------------------------------------------------------
      - name: Locate Gradle APK
        id: locate_apk
        shell: bash
        run: |
          APK="android-app/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"

          echo "Gradle-generated APK:"
          ls -lh "$APK"

      # ---------------------------------------------------------
      # 15. Check native libraries BEFORE alignment/signing
      # ---------------------------------------------------------
      - name: Verify native libraries in Gradle APK
        shell: bash
        run: |
          APK="${{ steps.locate_apk.outputs.apk }}"

          echo "Checking Gradle-produced APK..."

          unzip -l "$APK" | grep "lib/arm64-v8a/"

          echo
          echo "Checking libc++_shared.so..."

          unzip -l "$APK" | grep \
            "lib/arm64-v8a/libc++_shared.so"

          echo
          echo "Checking libycashd.so..."

          unzip -l "$APK" | grep \
            "lib/arm64-v8a/libycashd.so"

          echo
          echo "Checking bundled node..."

          unzip -l "$APK" | grep \
            "assets/ycash-android-node"

      # ---------------------------------------------------------
      # 16. Generate temporary signing keystore
      # ---------------------------------------------------------
      - name: Generate temporary signing key
        shell: bash
        run: |
          rm -f "$CI_KEYSTORE"

          keytool \
            -genkeypair \
            -v \
            -keystore "$CI_KEYSTORE" \
            -storepass "$CI_KEYSTORE_PASSWORD" \
            -keypass "$CI_KEY_PASSWORD" \
            -alias "$CI_KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname \
              "CN=Ycash CI Debug, OU=Development, O=Ycash, L=CI, ST=CI, C=GB"

          test -f "$CI_KEYSTORE"

          echo "Temporary signing key created."

      # ---------------------------------------------------------
      # 17. Zipalign
      #
      # IMPORTANT:
      # This operates on the complete Gradle-generated APK.
      # It does NOT reconstruct the APK contents.
      # ---------------------------------------------------------
      - name: Zipalign APK
        shell: bash
        run: |
          INPUT="android-app/app/build/outputs/apk/debug/app-debug.apk"
          ALIGNED="android-app/app/build/outputs/apk/debug/ycash-android-node-aligned.apk"

          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"

          test -x "$ZIPALIGN"
          test -f "$INPUT"

          rm -f "$ALIGNED"

          "$ZIPALIGN" \
            -f \
            -p \
            4 \
            "$INPUT" \
            "$ALIGNED"

          test -f "$ALIGNED"

          echo "Aligned APK:"
          ls -lh "$ALIGNED"

      # ---------------------------------------------------------
      # 18. Verify zip alignment
      # ---------------------------------------------------------
      - name: Verify zip alignment
        shell: bash
        run: |
          ALIGNED="android-app/app/build/outputs/apk/debug/ycash-android-node-aligned.apk"
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"

          "$ZIPALIGN" \
            -c \
            -P 4 \
            -v \
            "$ALIGNED"

      # ---------------------------------------------------------
      # 19. Sign aligned APK
      # ---------------------------------------------------------
      - name: Sign aligned APK
        shell: bash
        run: |
          ALIGNED="android-app/app/build/outputs/apk/debug/ycash-android-node-aligned.apk"
          SIGNED="android-app/app/build/outputs/apk/debug/ycash-android-node-debug-signed.apk"

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          test -x "$APKSIGNER"
          test -f "$ALIGNED"

          rm -f "$SIGNED"

          "$APKSIGNER" sign \
            --ks "$CI_KEYSTORE" \
            --ks-key-alias "$CI_KEY_ALIAS" \
            --ks-pass "pass:$CI_KEYSTORE_PASSWORD" \
            --key-pass "pass:$CI_KEY_PASSWORD" \
            --out "$SIGNED" \
            "$ALIGNED"

          test -f "$SIGNED"

          echo "Signed APK:"
          ls -lh "$SIGNED"

      # ---------------------------------------------------------
      # 20. Verify APK signature
      # ---------------------------------------------------------
      - name: Verify APK signature
        shell: bash
        run: |
          SIGNED="android-app/app/build/outputs/apk/debug/ycash-android-node-debug-signed.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          "$APKSIGNER" verify \
            --verbose \
            "$SIGNED"

      # ---------------------------------------------------------
      # 21. Verify native libraries AFTER signing
      # ---------------------------------------------------------
      - name: Verify final signed APK contents
        shell: bash
        run: |
          SIGNED="android-app/app/build/outputs/apk/debug/ycash-android-node-debug-signed.apk"

          echo "Final APK contents:"
          unzip -l "$SIGNED" | grep "lib/arm64-v8a/"

          echo
          echo "libc++_shared.so:"
          unzip -l "$SIGNED" | grep \
            "lib/arm64-v8a/libc++_shared.so"

          echo
          echo "libycashd.so:"
          unzip -l "$SIGNED" | grep \
            "lib/arm64-v8a/libycashd.so"

          echo
          echo "Bundled Ycash node:"
          unzip -l "$SIGNED" | grep \
            "assets/ycash-android-node"

          echo
          echo "Final APK verification passed."

      # ---------------------------------------------------------
      # 22. Upload final signed APK
      # ---------------------------------------------------------
      - name: Upload signed debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ycash-android-node-debug-signed
          path: android-app/app/build/outputs/apk/debug/ycash-android-node-debug-signed.apk
          if-no-files-found: error

      # ---------------------------------------------------------
      # 23. Upload raw ARM64 node
      # ---------------------------------------------------------
      - name: Upload ARM64 node
        uses: actions/upload-artifact@v4
        with:
          name: ycash-android-node-arm64
          path: target/${{ env.RUST_TARGET }}/release/ycash-android-node
          if-no-files-found: error

      # ---------------------------------------------------------
      # 24. Clean temporary signing key
      # ---------------------------------------------------------
      - name: Remove temporary signing key
        if: always()
        shell: bash
        run: |
          rm -f "$CI_KEYSTORE"
