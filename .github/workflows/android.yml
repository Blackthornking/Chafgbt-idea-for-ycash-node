name: Build Ycash Android Node

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  ANDROID_API: "35"
  ANDROID_NDK: "27.2.12479018"
  RUST_TARGET: "aarch64-linux-android"
  VCPKG_TRIPLET: "arm64-android"

  CI_KEY_ALIAS: "ycash-temp"
  CI_KEYSTORE_PASSWORD: "temporary123"
  CI_KEY_PASSWORD: "temporary123"

jobs:
  build:
    name: Build Android ARM64 Ycash Node
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. FIND AND EXTRACT PROJECT ZIP
      # ============================================================
      - name: Find project ZIP
        id: find_zip
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find "$GITHUB_WORKSPACE" \
            -maxdepth 1 \
            -type f \
            -iname '*.zip' \
            -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "::error::No ZIP file found in repository root."
            exit 1
          fi

          echo "Using ZIP: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/extracted"
          mkdir -p "$GITHUB_WORKSPACE/extracted"

          unzip -q -o \
            "${{ steps.find_zip.outputs.zip }}" \
            -d "$GITHUB_WORKSPACE/extracted"

          echo "===== Extracted files ====="

          find "$GITHUB_WORKSPACE/extracted" \
            -maxdepth 5 \
            -type f \
            | sort \
            | head -300

      # ============================================================
      # 3. LOCATE ANDROID PROJECT
      # ============================================================
      - name: Locate Android project
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="$(find "$GITHUB_WORKSPACE/extracted" \
            -name settings.gradle.kts \
            -type f \
            -print -quit)"

          if [ -z "$PROJECT" ]; then
            echo "::error::Could not find settings.gradle.kts."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT")"
          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"

          echo "Android project: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 4. FIX JVM TARGETS
      # ============================================================
      - name: Fix Kotlin/Java JVM target mismatch
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_FILE="app/build.gradle.kts"

          if [ ! -f "$GRADLE_FILE" ]; then
            echo "::error::$GRADLE_FILE not found."
            exit 1
          fi

          if grep -q "compileOptions" "$GRADLE_FILE"; then
            echo "compileOptions already present."
          else
            python3 - "$GRADLE_FILE" <<'PYEOF'
          import sys

          path = sys.argv[1]

          with open(path, encoding="utf-8") as f:
              content = f.read()

          patch = r'''
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          '''

          marker = "buildFeatures { buildConfig = true }"

          if marker in content:
              content = content.replace(
                  marker,
                  marker + "\n" + patch,
                  1
              )
          elif "\ndependencies" in content:
              content = content.replace(
                  "\n}\n\ndependencies",
                  "\n" + patch + "\n}\n\ndependencies",
                  1
              )

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          PYEOF
          fi

          echo "===== app/build.gradle.kts ====="
          cat "$GRADLE_FILE"

      # ============================================================
      # 4b. FORCE NATIVE LIBRARY PACKAGING
      # ============================================================
      - name: Force uncompressed native library packaging
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_FILE="app/build.gradle.kts"
          MANIFEST="app/src/main/AndroidManifest.xml"
          PROPERTIES="gradle.properties"

          test -f "$GRADLE_FILE"
          test -f "$MANIFEST"

          echo "===== Forcing native library packaging ====="

          python3 - "$GRADLE_FILE" <<'PYEOF'
          import sys
          import re

          path = sys.argv[1]

          with open(path, encoding="utf-8") as f:
              content = f.read()

          # Remove an existing generated packaging block so the
          # workflow is safe to run repeatedly.
          content = re.sub(
              r'\n\s*packaging\s*\{\s*jniLibs\s*\{\s*useLegacyPackaging\s*=\s*true\s*\}\s*\}',
              '',
              content,
              flags=re.MULTILINE
          )

          match = re.search(r'(?m)^android\s*\{', content)

          if not match:
              raise SystemExit(
                  "Could not find android { block in app/build.gradle.kts"
              )

          insertion = '''
              packaging {
                  jniLibs {
                      useLegacyPackaging = true
                  }
              }
          '''

          pos = match.end()

          content = (
              content[:pos]
              + "\n"
              + insertion
              + content[pos:]
          )

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          PYEOF

          touch "$PROPERTIES"

          if grep -q \
            '^android.packagingOptions.jniLibs.useLegacyPackaging=' \
            "$PROPERTIES"; then

            sed -i \
              's/^android\.packagingOptions\.jniLibs\.useLegacyPackaging=.*/android.packagingOptions.jniLibs.useLegacyPackaging=true/' \
              "$PROPERTIES"

          else

            printf \
              '\nandroid.packagingOptions.jniLibs.useLegacyPackaging=true\n' \
              >> "$PROPERTIES"

          fi

          python3 - "$MANIFEST" <<'PYEOF'
          import sys
          import re

          path = sys.argv[1]

          with open(path, encoding="utf-8") as f:
              content = f.read()

          if re.search(
              r'android:extractNativeLibs\s*=',
              content
          ):
              content = re.sub(
                  r'android:extractNativeLibs\s*=\s*"[^"]*"',
                  'android:extractNativeLibs="true"',
                  content,
                  count=1
              )
          else:
              app_match = re.search(
                  r'<application\b',
                  content
              )

              if not app_match:
                  raise SystemExit(
                      "Could not find <application> in AndroidManifest.xml"
                  )

              pos = app_match.end()

              content = (
                  content[:pos]
                  + '\n        android:extractNativeLibs="true"'
                  + content[pos:]
              )

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          PYEOF

          echo
          echo "===== Native packaging configuration ====="

          grep -n -A8 -B2 \
            "packaging" \
            "$GRADLE_FILE" || true

          grep -n \
            "useLegacyPackaging" \
            "$PROPERTIES" || true

          grep -n \
            "extractNativeLibs" \
            "$MANIFEST" || true

      # ============================================================
      # 5. JAVA
      # ============================================================
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ============================================================
      # 6. ANDROID SDK / NDK
      # ============================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager "platform-tools"
          sdkmanager "platforms;android-${ANDROID_API}"
          sdkmanager "build-tools;35.0.0"
          sdkmanager "ndk;${ANDROID_NDK}"

          yes | sdkmanager --licenses >/dev/null || true

      # ============================================================
      # 7. RUST
      # ============================================================
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.RUST_TARGET }}

      # ============================================================
      # 8. LOCATE YCASHD
      # ============================================================
      - name: Locate ycashd source
        id: ycashd
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="$(
            find "$GITHUB_WORKSPACE/extracted" \
              -type f \
              -name configure.ac \
              -path '*ycashd*' \
              -print -quit || true
          )"

          if [ -z "$SOURCE" ]; then
            SOURCE="$(
              find "$GITHUB_WORKSPACE/extracted" \
                -type f \
                -name configure.ac \
                -print -quit || true
            )"
          fi

          if [ -z "$SOURCE" ]; then
            echo "::error::Could not locate ycashd source."
            exit 1
          fi

          YDIR="$(dirname "$SOURCE")"
          YDIR="$(cd "$YDIR" && pwd)"

          echo "ycashd source: $YDIR"
          echo "ycashd_dir=$YDIR" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 9. INSPECT SOURCE
      # ============================================================
      - name: Inspect source tree
        shell: bash
        run: |
          set -euo pipefail

          YDIR="${{ steps.ycashd.outputs.ycashd_dir }}"

          echo "===== ycashd ====="
          ls -la "$YDIR"

          test -f "$YDIR/configure.ac"
          test -f "$YDIR/Makefile.am"

          echo "===== Rust ====="
          test -f "$YDIR/Cargo.toml" || true

      # ============================================================
      # 10. ANDROID ARM64 TOOLCHAIN
      # ============================================================
      - name: Configure Android ARM64 environment
        shell: bash
        run: |
          set -euo pipefail

          NDK="$ANDROID_HOME/ndk/$ANDROID_NDK"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          echo "NDK=$NDK"
          echo "TOOLCHAIN=$TOOLCHAIN"

          test -x \
            "$TOOLCHAIN/aarch64-linux-android35-clang"

          test -x \
            "$TOOLCHAIN/aarch64-linux-android35-clang++"

          echo \
            "CC=$TOOLCHAIN/aarch64-linux-android35-clang" \
            >> "$GITHUB_ENV"

          echo \
            "CXX=$TOOLCHAIN/aarch64-linux-android35-clang++" \
            >> "$GITHUB_ENV"

          echo \
            "AR=$TOOLCHAIN/llvm-ar" \
            >> "$GITHUB_ENV"

          echo \
            "RANLIB=$TOOLCHAIN/llvm-ranlib" \
            >> "$GITHUB_ENV"

          echo \
            "STRIP=$TOOLCHAIN/llvm-strip" \
            >> "$GITHUB_ENV"

          echo "$TOOLCHAIN" >> "$GITHUB_PATH"

          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"

      # ============================================================
      # 11. CARGO ANDROID LINKER
      # ============================================================
      - name: Point Cargo at the NDK linker
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.cargo"

          cat > "$HOME/.cargo/config.toml" <<EOF
          [target.aarch64-linux-android]
          linker = "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API}-clang"
          EOF

          cat "$HOME/.cargo/config.toml"

      # ============================================================
      # 12. AUTOTOOLS
      # ============================================================
      - name: Install autotools for vcpkg
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            autoconf \
            autoconf-archive \
            automake \
            libtool

      # ============================================================
      # 13. VCPKG
      # ============================================================
      - name: Set up vcpkg
        shell: bash
        run: |
          set -euo pipefail

          git clone \
            --depth 1 \
            https://github.com/microsoft/vcpkg.git \
            "$HOME/vcpkg"

          "$HOME/vcpkg/bootstrap-vcpkg.sh" \
            -disableMetrics

          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"

      # ============================================================
      # 14. BUILD ANDROID DEPENDENCIES
      # ============================================================
      - name: Build Boost, libevent, libsodium for Android ARM64
        shell: bash
        run: |
          set -euo pipefail

          "$VCPKG_ROOT/vcpkg" install \
            boost-system \
            boost-filesystem \
            boost-program-options \
            boost-thread \
            boost-chrono \
            boost-signals2 \
            boost-multi-index \
            boost-assign \
            boost-format \
            boost-iostreams \
            boost-interprocess \
            boost-math \
            boost-random \
            boost-uuid \
            boost-dynamic-bitset \
            boost-scope-exit \
            libevent \
            libsodium \
            --triplet "$VCPKG_TRIPLET"

          VCPKG_INSTALLED="$VCPKG_ROOT/installed/$VCPKG_TRIPLET"

          test -d \
            "$VCPKG_INSTALLED/include/boost"

          test -f \
            "$VCPKG_INSTALLED/include/sodium.h"

          echo \
            "VCPKG_INSTALLED=$VCPKG_INSTALLED" \
            >> "$GITHUB_ENV"

      # ============================================================
      # 15. BUILD REAL YCASHD
      # ============================================================
      - name: Build ycashd for Android ARM64
        working-directory: ${{ steps.ycashd.outputs.ycashd_dir }}
        shell: bash
        run: |
          set -euo pipefail

          echo \
            "Starting Android ARM64 ycashd build..."

          find . \
            -name "*.sh" \
            -exec chmod +x {} +

          rustup show

          rustup target add \
            aarch64-linux-android

          if [ -x ./autogen.sh ]; then
            ./autogen.sh
          fi

          export \
            PKG_CONFIG_LIBDIR="$VCPKG_INSTALLED/lib/pkgconfig"

          unset PKG_CONFIG_PATH || true

          export \
            CPPFLAGS="-I$VCPKG_INSTALLED/include"

          export \
            CXXFLAGS="${CXXFLAGS:-} -stdlib=libc++"

          export \
            LDFLAGS="-L$VCPKG_INSTALLED/lib -stdlib=libc++ -fPIE -pie -llog"

          ./configure \
            --host=aarch64-linux-android \
            --with-boost="$VCPKG_INSTALLED" \
            --enable-online-rust \
            --disable-wallet \
            --disable-mining \
            --disable-tests \
            --disable-bench

          make -j"$(nproc)"

      # ============================================================
      # 16. FIND YCASHD BINARY
      # ============================================================
      - name: Find ycashd binary
        id: binary
        shell: bash
        run: |
          set -euo pipefail

          YDIR="${{ steps.ycashd.outputs.ycashd_dir }}"

          BIN="$(
            find "$YDIR" \
              -type f \
              \( -name ycashd -o -name ycashd.exe \) \
              -perm -111 \
              -print -quit || true
          )"

          if [ -z "$BIN" ]; then
            echo \
              "::error::Android ARM64 ycashd binary was not produced."

            find "$YDIR" \
              -type f \
              -perm -111 \
              | head -100

            exit 1
          fi

          BIN="$(cd "$(dirname "$BIN")" && pwd)/$(basename "$BIN")"

          file "$BIN"

          echo "binary=$BIN" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 17. PACKAGE YCASHD INTO JNI LIBS
      # ============================================================
      - name: Package ycashd into Android application
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.locate.outputs.project_dir }}"
          BIN="${{ steps.binary.outputs.binary }}"

          JNI_DIR="$PROJECT/app/src/main/jniLibs/arm64-v8a"

          mkdir -p "$JNI_DIR"

          rm -f \
            "$JNI_DIR/libycashd.so"

          cp \
            "$BIN" \
            "$JNI_DIR/libycashd.so"

          echo "===== Size before stripping ====="

          ls -lh \
            "$JNI_DIR/libycashd.so"

          if [ -x "${STRIP:-}" ]; then

            "$STRIP" \
              --strip-unneeded \
              "$JNI_DIR/libycashd.so"

            echo "===== Size after stripping ====="

            ls -lh \
              "$JNI_DIR/libycashd.so"

          else

            echo \
              "::warning::llvm-strip not found; shipping unstripped binary."

          fi

          chmod 755 \
            "$JNI_DIR/libycashd.so"

          echo "===== Packaged daemon ====="

          ls -lh \
            "$JNI_DIR/libycashd.so"

          file \
            "$JNI_DIR/libycashd.so"

          ASSETS="$PROJECT/app/src/main/assets"

          mkdir -p "$ASSETS"

          {
            echo \
              "sha256=$(sha256sum "$JNI_DIR/libycashd.so" | cut -d' ' -f1)"

            echo \
              "bytes=$(stat -c%s "$JNI_DIR/libycashd.so")"

            echo \
              "run=${GITHUB_RUN_NUMBER:-local}"

            echo \
              "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          } > "$ASSETS/ycashd-build.txt"

          echo "===== Build fingerprint ====="

          cat \
            "$ASSETS/ycashd-build.txt"

      # ============================================================
      # 17b. SHIP THE C++ RUNTIME
      # ============================================================
      - name: Package libc++_shared.so
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.locate.outputs.project_dir }}"

          JNI_DIR="$PROJECT/app/src/main/jniLibs/arm64-v8a"

          NDK="$ANDROID_NDK_HOME"

          LIBCXX="$(
            find "$NDK/toolchains/llvm/prebuilt/linux-x86_64" \
              -type f \
              -name 'libc++_shared.so' \
              -path '*aarch64-linux-android*' \
              -print -quit || true
          )"

          if [ -z "$LIBCXX" ] || [ ! -f "$LIBCXX" ]; then

            echo \
              "::error::libc++_shared.so was not found in the selected NDK."

            find \
              "$NDK/toolchains/llvm/prebuilt/linux-x86_64" \
              -type f \
              -name 'libc++_shared.so' \
              -print || true

            exit 1
          fi

          mkdir -p "$JNI_DIR"

          rm -f \
            "$JNI_DIR/libc++_shared.so"

          cp \
            "$LIBCXX" \
            "$JNI_DIR/libc++_shared.so"

          chmod 755 \
            "$JNI_DIR/libc++_shared.so"

          echo "===== libc++_shared.so ====="

          ls -lh \
            "$JNI_DIR/libc++_shared.so"

          file \
            "$JNI_DIR/libc++_shared.so"

      # ============================================================
      # 17c. VERIFY SHARED DEPENDENCIES
      # ============================================================
      - name: Verify shared library dependencies
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.locate.outputs.project_dir }}"

          JNI_DIR="$PROJECT/app/src/main/jniLibs/arm64-v8a"

          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"

          READELF="$TOOLCHAIN/llvm-readelf"

          echo "===== ycashd DT_NEEDED ====="

          "$READELF" \
            -d "$JNI_DIR/libycashd.so" \
            | grep NEEDED || true

          if ! "$READELF" \
            -d "$JNI_DIR/libycashd.so" \
            | grep -q 'libc++_shared.so'; then

            echo \
              "::error::ycashd does not declare libc++_shared.so in DT_NEEDED."

            echo \
              "The binary was not linked with the intended shared NDK libc++."

            exit 1
          fi

          test -s \
            "$JNI_DIR/libc++_shared.so"

          echo \
            "libc++_shared.so is staged beside ycashd."

          PLATFORM="libc.so libm.so libdl.so liblog.so libz.so"

          MISSING=0

          while read -r NEED; do

            [ -z "$NEED" ] && continue

            if echo "$PLATFORM" | grep -qw "$NEED"; then

              echo \
                "  $NEED -- provided by Android"

            elif [ -f "$JNI_DIR/$NEED" ]; then

              echo \
                "  $NEED -- shipped in jniLibs"

            else

              echo \
                "::error::$NEED is required but neither provided by Android nor shipped."

              MISSING=1

            fi

          done < <(
            "$READELF" \
              -d "$JNI_DIR/libycashd.so" |
            grep NEEDED |
            sed -E 's/.*\[(.*)\].*/\1/'
          )

          if [ "$MISSING" -ne 0 ]; then

            echo \
              "Contents of $JNI_DIR:"

            ls -lh \
              "$JNI_DIR"

            exit 1
          fi

          echo \
            "All ycashd shared dependencies are satisfied."

      # ============================================================
      # 18. VERIFY PACKAGED YCASHD
      # ============================================================
      - name: Verify packaged ycashd
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.locate.outputs.project_dir }}"

          DAEMON="$PROJECT/app/src/main/jniLibs/arm64-v8a/libycashd.so"

          test -f "$DAEMON"
          test -x "$DAEMON"

          echo "===== ycashd ELF header ====="

          file "$DAEMON"

          if ! file "$DAEMON" | grep -q "pie executable"; then
            echo \
              "::error::ycashd is not a PIE executable; Android will refuse to run it."

            exit 1
          fi

          echo "===== ycashd permissions ====="

          ls -l "$DAEMON"

      # ============================================================
      # 19. CONFIRM NATIVE LIBRARY PACKAGING
      # ============================================================
      - name: Confirm native library packaging
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="app/src/main/AndroidManifest.xml"
          GRADLE_FILE="app/build.gradle.kts"
          PROPERTIES="gradle.properties"

          echo \
            "===== Checking native packaging configuration ====="

          if ! grep -q \
            'android:extractNativeLibs="true"' \
            "$MANIFEST"; then

            echo \
              "::error::extractNativeLibs is not true."

            exit 1
          fi

          if ! grep -q \
            'useLegacyPackaging = true' \
            "$GRADLE_FILE" && \
             ! grep -q \
            '^android.packagingOptions.jniLibs.useLegacyPackaging=true' \
            "$PROPERTIES"; then

            echo \
              "::error::Native library legacy packaging is not enabled."

            exit 1
          fi

          echo \
            "extractNativeLibs=true"

          echo \
            "useLegacyPackaging=true"

          echo \
            "Native library packaging configuration is correct."

      # ============================================================
      # 20. PREPARE GRADLE
      # ============================================================
      - name: Prepare Gradle
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f gradlew ]; then

            echo \
              "Gradle wrapper not present; generating one."

            if ! command -v gradle >/dev/null 2>&1; then

              echo \
                "Installing Gradle locally..."

              GRADLE_VERSION="8.7"

              curl -fsSL \
                "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
                -o "$RUNNER_TEMP/gradle.zip"

              rm -rf \
                "$RUNNER_TEMP/gradle"

              unzip -q \
                "$RUNNER_TEMP/gradle.zip" \
                -d "$RUNNER_TEMP"

              export \
                PATH="$RUNNER_TEMP/gradle/gradle-${GRADLE_VERSION}/bin:$PATH"
            fi

            gradle wrapper \
              --gradle-version 8.7
          fi

          chmod +x gradlew

          echo \
            "Gradle wrapper:"

          ./gradlew --version

      # ============================================================
      # 21. GENERATE TEMPORARY SIGNING KEY
      # ============================================================
      - name: Generate temporary signing key
        shell: bash
        run: |
          set -euo pipefail

          KEYSTORE="$RUNNER_TEMP/ycash-temp-release.keystore"

          rm -f "$KEYSTORE"

          keytool \
            -genkeypair \
            -v \
            -keystore "$KEYSTORE" \
            -storetype JKS \
            -storepass "$CI_KEYSTORE_PASSWORD" \
            -keypass "$CI_KEY_PASSWORD" \
            -alias "$CI_KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -dname \
            "CN=Ycash Temporary Build, OU=Development, O=Ycash, L=Local, ST=Local, C=GB"

          chmod 600 \
            "$KEYSTORE"

          echo \
            "KEYSTORE=$KEYSTORE" \
            >> "$GITHUB_ENV"

          echo \
            "Temporary CI signing key generated."

      # ============================================================
      # 22. BUILD RELEASE APK
      # ============================================================
      - name: Build release APK
        id: build_apk
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleRelease

          echo "===== Release APKs ====="

          find \
            "$PWD/app/build/outputs/apk" \
            -type f \
            -name '*.apk' \
            -print

          APK="$(
            find \
              "$PWD/app/build/outputs/apk" \
              -type f \
              -name '*.apk' \
              -print -quit
          )"

          test -n "$APK"

          echo \
            "===== PRE-SIGN NATIVE RUNTIME CHECK ====="

          if ! unzip -l "$APK" |
            grep -q \
            'lib/arm64-v8a/libycashd.so'; then

            echo \
              "::error::libycashd.so is missing from the unsigned APK."

            unzip -l "$APK" |
              grep 'lib/' || true

            exit 1
          fi

          if ! unzip -l "$APK" |
            grep -q \
            'lib/arm64-v8a/libc++_shared.so'; then

            echo \
              "::error::libc++_shared.so is missing from the unsigned APK."

            echo \
              "The CI staging directory contained it, but Gradle did not package it."

            unzip -l "$APK" |
              grep 'lib/' || true

            exit 1
          fi

          echo \
            "Both ARM64 native libraries are present in the APK."

      # ============================================================
      # 23. LOCATE APK
      # ============================================================
      - name: Locate unsigned APK
        id: unsigned_apk
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find \
              "$PWD/app/build/outputs/apk" \
              -type f \
              -name '*.apk' \
              -print -quit
          )"

          if [ -z "$APK" ]; then

            echo \
              "::error::No APK was produced."

            find \
              "$PWD/app/build" \
              -type f \
              | sort \
              | head -300

            exit 1
          fi

          APK="$(realpath "$APK")"

          echo \
            "Unsigned APK:"

          echo "$APK"

          file "$APK"

          ls -lh "$APK"

          echo \
            "apk=$APK" \
            >> "$GITHUB_OUTPUT"

      # ============================================================
      # 24. ZIPALIGN
      # ============================================================
      - name: Zipalign APK
        id: aligned
        shell: bash
        run: |
          set -euo pipefail

          INPUT="${{ steps.unsigned_apk.outputs.apk }}"

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          ZIPALIGN="$BUILD_TOOLS/zipalign"

          ALIGNED="$RUNNER_TEMP/YcashNode-Android-ARM64-aligned.apk"

          echo "INPUT=$INPUT"
          echo "ALIGNED=$ALIGNED"

          test -f "$INPUT"
          test -x "$ZIPALIGN"

          rm -f "$ALIGNED"

          "$ZIPALIGN" \
            -f \
            -p \
            4 \
            "$INPUT" \
            "$ALIGNED"

          test -f "$ALIGNED"

          echo \
            "Aligned APK:"

          ls -lh "$ALIGNED"

          echo \
            "apk=$ALIGNED" \
            >> "$GITHUB_OUTPUT"

      # ============================================================
      # 25. SIGN FINAL APK
      # ============================================================
      - name: Sign final APK with temporary CI key
        id: signed
        shell: bash
        run: |
          set -euo pipefail

          INPUT="${{ steps.aligned.outputs.apk }}"

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          APKSIGNER="$BUILD_TOOLS/apksigner"

          SIGNED="$RUNNER_TEMP/YcashNode-Android-ARM64-SIGNED.apk"

          echo "INPUT=$INPUT"
          echo "SIGNED=$SIGNED"

          test -f "$INPUT"
          test -x "$APKSIGNER"
          test -f "$KEYSTORE"

          rm -f "$SIGNED"

          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-type JKS \
            --ks-pass "pass:$CI_KEYSTORE_PASSWORD" \
            --key-pass "pass:$CI_KEY_PASSWORD" \
            --ks-key-alias "$CI_KEY_ALIAS" \
            --out "$SIGNED" \
            "$INPUT"

          test -f "$SIGNED"

          echo \
            "Signed APK:"

          ls -lh "$SIGNED"

          echo \
            "apk=$SIGNED" \
            >> "$GITHUB_OUTPUT"

      # ============================================================
      # 26. VERIFY APK SIGNATURE
      # ============================================================
      - name: Verify final APK signature
        shell: bash
        run: |
          set -euo pipefail

          APK="${{ steps.signed.outputs.apk }}"

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          APKSIGNER="$BUILD_TOOLS/apksigner"

          test -f "$APK"
          test -x "$APKSIGNER"

          echo \
            "===== APK SIGNATURE VERIFICATION ====="

          "$APKSIGNER" verify \
            --verbose \
            "$APK"

          echo \
            "===== APK VERIFIED ====="

      # ============================================================
      # 27. VERIFY APK ZIP ALIGNMENT
      # ============================================================
      - name: Verify APK alignment
        shell: bash
        run: |
          set -euo pipefail

          APK="${{ steps.signed.outputs.apk }}"

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          ZIPALIGN="$BUILD_TOOLS/zipalign"

          test -f "$APK"
          test -x "$ZIPALIGN"

          "$ZIPALIGN" \
            -c \
            -p \
            4 \
            "$APK"

          echo \
            "APK alignment verified."

      # ============================================================
      # 28. FINAL APK INSPECTION
      # ============================================================
      - name: Inspect final APK
        shell: bash
        run: |
          set -euo pipefail

          APK="${{ steps.signed.outputs.apk }}"

          test -f "$APK"

          echo \
            "=========================================="

          echo \
            "FINAL Ycash NODE APK"

          echo \
            "=========================================="

          ls -lh "$APK"

          file "$APK"

          echo
          echo "Signing:"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose \
            "$APK"

          echo
          echo "APK contents:"

          unzip -l "$APK" |
            grep -E \
              'lib/arm64-v8a|AndroidManifest.xml' \
            | head -100

          echo
          echo \
            "Native library compression:"

          unzip -lv "$APK" |
            grep -E \
              'libycashd\.so|libc\+\+_shared\.so' \
            || true

          if ! unzip -l "$APK" |
            grep -q \
            "lib/arm64-v8a/libycashd.so"; then

            echo \
              "::error::libycashd.so is missing from the APK."

            unzip -l "$APK" |
              grep "lib/" || true

            exit 1
          fi

          echo \
            "libycashd.so is present in the APK."

          if ! unzip -l "$APK" |
            grep -q \
            "lib/arm64-v8a/libc++_shared.so"; then

            echo \
              "::error::libc++_shared.so is missing from the final APK."

            exit 1
          fi

          echo \
            "libc++_shared.so is present in the final APK."

          echo
          echo \
            "===== Native library entries ====="

          unzip -lv "$APK" |
            grep -E \
              'lib/arm64-v8a/(libycashd\.so|libc\+\+_shared\.so)$'

          check_uncompressed() {
            local NAME="$1"

            echo
            echo \
              "Checking $NAME..."

            ENTRY="$(
              unzip -lv "$APK" |
              grep -E \
                "lib/arm64-v8a/${NAME}$" |
              head -1 || true
            )"

            if [ -z "$ENTRY" ]; then

              echo \
                "::error::$NAME was not found in the APK."

              exit 1
            fi

            echo "$ENTRY"

            METHOD="$(echo "$ENTRY" | awk '{print $2}')"

            if [ "$METHOD" != "Stored" ]; then

              echo \
                "::error::$NAME is compressed in the APK."

              echo \
                "Compression method: $METHOD"

              exit 1
            fi

            echo \
              "$NAME is STORED/uncompressed."
          }

          check_uncompressed \
            "libycashd.so"

          check_uncompressed \
            "libc++_shared.so"

          echo
          echo \
            "Both native libraries are stored uncompressed."

      # ============================================================
      # 29. COPY FINAL APK TO WORKSPACE
      # ============================================================
      - name: Prepare final APK artifact
        shell: bash
        run: |
          set -euo pipefail

          APK="${{ steps.signed.outputs.apk }}"

          OUT="$GITHUB_WORKSPACE/YcashNode-Android-ARM64-SIGNED.apk"

          test -f "$APK"

          rm -f "$OUT"

          cp "$APK" "$OUT"

          test -f "$OUT"

          echo \
            "Final artifact:"

          ls -lh "$OUT"

      # ============================================================
      # 30. UPLOAD SIGNED APK
      # ============================================================
      - name: Upload signed Android APK
        uses: actions/upload-artifact@v4
        with:
          name: YcashNode-Android-ARM64-SIGNED
          path: ${{ github.workspace }}/YcashNode-Android-ARM64-SIGNED.apk
          if-no-files-found: error

      # ============================================================
      # 31. UPLOAD YCASHD SEPARATELY
      # ============================================================
      - name: Upload ycashd ARM64 binary
        uses: actions/upload-artifact@v4
        with:
          name: ycashd-Android-ARM64-unstripped
          path: ${{ steps.binary.outputs.binary }}
          if-no-files-found: error

      # ============================================================
      # 32. CREATE BUILD INFORMATION
      # ============================================================
      - name: Create build information
        shell: bash
        run: |
          set -euo pipefail

          APK="${{ steps.signed.outputs.apk }}"

          cat > "$RUNNER_TEMP/ycash-build-info.txt" <<EOF
          Ycash Android Node
          ==================

          Architecture:
          ARM64 / aarch64

          Android API:
          ${ANDROID_API}

          Android NDK:
          ${ANDROID_NDK}

          Build:
          Release

          APK:
          YcashNode-Android-ARM64-SIGNED.apk

          Signing:
          Temporary CI-generated development key

          Permanent production signing key:
          NOT USED

          ycashd:
          Embedded in app nativeLibraryDir as libycashd.so
          Stripped for shipping; unstripped copy uploaded separately

          libc++:
          Embedded as libc++_shared.so

          Native library packaging:
          Uncompressed / extractable

          APK signature:
          Verified with apksigner

          APK alignment:
          Verified with zipalign -c -p 4
          EOF

          cat \
            "$RUNNER_TEMP/ycash-build-info.txt"

      # ============================================================
      # 33. UPLOAD BUILD INFORMATION
      # ============================================================
      - name: Upload build information
        uses: actions/upload-artifact@v4
        with:
          name: YcashNode-build-information
          path: ${{ runner.temp }}/ycash-build-info.txt
          if-no-files-found: error
