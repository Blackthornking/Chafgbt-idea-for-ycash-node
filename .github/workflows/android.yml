name: Build, Sign and Verify Ycash Android Node

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  ANDROID_API: "35"
  ANDROID_NDK: "27.2.12479018"
  RUST_TARGET: "aarch64-linux-android"

  # Temporary CI signing.
  # A new debug keystore is generated for each workflow run.
  CI_KEYSTORE: "${{ github.workspace }}/ci-debug.keystore"
  CI_KEY_ALIAS: "ycash-debug"
  CI_KEYSTORE_PASSWORD: "ycash-debug-password"
  CI_KEY_PASSWORD: "ycash-debug-password"

jobs:
  build:
    name: Build, Align, Sign and Verify Ycash Android Node
    runs-on: ubuntu-24.04

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # 2. PREPARE PROJECT ROOT
      # =========================================================
      - name: Prepare project root
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "PREPARING YCASH PROJECT ROOT"
          echo "=========================================="

          pwd

          echo
          echo "Repository contents:"
          ls -la

          if [ -f "Cargo.toml" ] && \
             [ -d "crates" ] && \
             [ -d "android-app" ]; then

            echo
            echo "Valid Ycash project already exists at repository root."

          else

            echo
            echo "Searching all ZIP files recursively..."

            ZIP=""

            mapfile -d '' ZIP_FILES < <(
              find . \
                -type f \
                -iname '*.zip' \
                -not -path './.git/*' \
                -print0 \
                | sort -z
            )

            if [ "${#ZIP_FILES[@]}" -eq 0 ]; then
              echo "ERROR: No ZIP files found."
              exit 1
            fi

            echo
            echo "ZIP files discovered:"

            for candidate in "${ZIP_FILES[@]}"; do
              echo "  - $candidate"
            done

            for candidate in "${ZIP_FILES[@]}"; do

              echo
              echo "------------------------------------------"
              echo "Checking:"
              echo "$candidate"
              echo "------------------------------------------"

              if ! unzip -tq "$candidate" >/dev/null 2>&1; then
                echo "SKIP: Invalid/corrupted ZIP."
                continue
              fi

              if ! unzip -Z1 "$candidate" 2>/dev/null \
                | grep -qE '(^|/)Cargo\.toml$'; then
                echo "SKIP: No Cargo.toml."
                continue
              fi

              if ! unzip -Z1 "$candidate" 2>/dev/null \
                | grep -qE '(^|/)crates(/|/)'; then
                echo "SKIP: No crates/."
                continue
              fi

              if ! unzip -Z1 "$candidate" 2>/dev/null \
                | grep -qE '(^|/)android-app(/|/)'; then
                echo "SKIP: No android-app/."
                continue
              fi

              ZIP="$candidate"

              echo
              echo "VALID PROJECT ZIP FOUND:"
              echo "$ZIP"

              break
            done

            if [ -z "$ZIP" ]; then
              echo
              echo "ERROR: No valid Ycash project ZIP found."
              exit 1
            fi

            rm -rf .ycash-project
            mkdir -p .ycash-project

            unzip -q "$ZIP" -d .ycash-project

            PROJECT_ROOT=""

            while IFS= read -r -d '' cargo_file; do

              candidate_root="$(dirname "$cargo_file")"

              if [ -d "$candidate_root/crates" ] && \
                 [ -d "$candidate_root/android-app" ]; then

                PROJECT_ROOT="$candidate_root"

                echo
                echo "PROJECT ROOT:"
                echo "$PROJECT_ROOT"

                break
              fi

            done < <(
              find .ycash-project \
                -type f \
                -name Cargo.toml \
                -print0
            )

            if [ -z "$PROJECT_ROOT" ]; then
              echo
              echo "ERROR: Could not locate valid project root."
              find .ycash-project -maxdepth 8 -type f | sort
              exit 1
            fi

            cp -a "$PROJECT_ROOT"/. .

            rm -rf .ycash-project

          fi

          echo
          echo "=========================================="
          echo "FINAL PROJECT ROOT CHECK"
          echo "=========================================="

          test -f Cargo.toml
          test -d crates
          test -d android-app

          echo
          echo "PROJECT ROOT READY"

      # =========================================================
      # 3. JAVA 17
      # =========================================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # =========================================================
      # 4. ANDROID SDK
      # =========================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      # =========================================================
      # 5. ANDROID PLATFORM + NDK
      # =========================================================
      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;35.0.0" \
            "ndk;${ANDROID_NDK}"

          echo
          echo "Android SDK installed."

      # =========================================================
      # 6. RUST
      # =========================================================
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.RUST_TARGET }}

      # =========================================================
      # 7. CONFIGURE ANDROID RUST LINKER
      # =========================================================
      - name: Configure Android Rust linker
        shell: bash
        run: |
          set -euo pipefail

          NDK="$ANDROID_HOME/ndk/${ANDROID_NDK}"
          LLVM="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          test -x "$LLVM/aarch64-linux-android${ANDROID_API}-clang"
          test -x "$LLVM/aarch64-linux-android${ANDROID_API}-clang++"
          test -x "$LLVM/llvm-ar"
          test -x "$LLVM/llvm-ranlib"

          mkdir -p .cargo

          cat > .cargo/config.toml <<EOF
          [target.aarch64-linux-android]
          linker = "$LLVM/aarch64-linux-android${ANDROID_API}-clang"
          ar = "$LLVM/llvm-ar"
          EOF

          echo "CC_aarch64_linux_android=$LLVM/aarch64-linux-android${ANDROID_API}-clang" >> "$GITHUB_ENV"
          echo "CXX_aarch64_linux_android=$LLVM/aarch64-linux-android${ANDROID_API}-clang++" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$LLVM/llvm-ar" >> "$GITHUB_ENV"
          echo "RANLIB_aarch64_linux_android=$LLVM/llvm-ranlib" >> "$GITHUB_ENV"

      # =========================================================
      # 8. VERIFY RUST WORKSPACE
      # =========================================================
      - name: Verify Rust workspace
        shell: bash
        run: |
          set -euo pipefail

          rustc --version
          cargo --version

          test -f Cargo.toml

          cargo metadata \
            --format-version 1 \
            --no-deps

          echo
          echo "Cargo workspace verified."

      # =========================================================
      # 9. VERIFY YCASH NODE SOURCE
      #
      # Make sure the source contains the new v0.19.3
      # diagnostics before spending time compiling it.
      # =========================================================
      - name: Verify Ycash v0.19.3 diagnostics
        shell: bash
        run: |
          set -euo pipefail

          MAIN="crates/ycash-android-node/src/main.rs"
          ACTIVITY="android-app/app/src/main/java/com/ycash/androidnode/MainActivity.java"
          MANIFEST="android-app/app/src/main/AndroidManifest.xml"

          test -f "$MAIN"
          test -f "$ACTIVITY"
          test -f "$MANIFEST"

          echo "Checking node version..."
          grep -q "v0.19.3" "$MAIN"

          echo "Checking status API..."
          grep -q "8834" "$MAIN"
          grep -q "YCASH_STATUS_PORT" "$MAIN"

          echo "Checking RPC..."
          grep -q "8832" "$MAIN"

          echo "Checking P2P..."
          grep -q "8833" "$MAIN"
          grep -q "YCASH_P2P_PORT" "$MAIN"

          echo "Checking P2P diagnostics..."
          grep -q "outbound_attempts" "$MAIN"
          grep -q "outbound_handshakes" "$MAIN"
          grep -q "inbound_connections" "$MAIN"
          grep -q "last_error" "$MAIN"

          echo "Checking Android status API..."
          grep -q "127.0.0.1:8834/status" "$ACTIVITY"

          echo "Checking gRPC diagnostic..."
          grep -q "CompactTxStreamer/GetLatestBlock" "$ACTIVITY"
          grep -q "grpc-accept-encoding" "$ACTIVITY"
          grep -q "application/grpc" "$ACTIVITY"
          grep -q "RST_STREAM" "$ACTIVITY"
          grep -q "GOAWAY" "$ACTIVITY"

          echo
          echo "Source diagnostic verification PASSED."

      # =========================================================
      # 10. VERIFY LOCALHOST CLEAR-TEXT ACCESS
      #
      # The status API is intentionally HTTP on localhost:8834.
      # =========================================================
      - name: Verify localhost status API configuration
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="android-app/app/src/main/AndroidManifest.xml"

          echo "Manifest:"
          cat "$MANIFEST"

          grep -Eq \
            'android:usesCleartextTraffic[[:space:]]*=[[:space:]]*"true"' \
            "$MANIFEST"

          echo
          echo "usesCleartextTraffic=true VERIFIED."

      # =========================================================
      # 11. VERIFY NODE PORT CONTRACT
      # =========================================================
      - name: Verify Ycash port contract
        shell: bash
        run: |
          set -euo pipefail

          MAIN="crates/ycash-android-node/src/main.rs"

          echo "Expected ports:"
          echo "P2P    = 8833"
          echo "RPC    = 8832"
          echo "STATUS = 8834"

          grep -q '8833u16' "$MAIN"
          grep -q '8832u16' "$MAIN"
          grep -q '8834u16' "$MAIN"

          echo
          echo "Ycash port contract VERIFIED."

      # =========================================================
      # 12. CARGO CACHE
      # =========================================================
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ycash-${{ runner.os }}-${{ env.RUST_TARGET }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ycash-${{ runner.os }}-${{ env.RUST_TARGET }}-
            ycash-${{ runner.os }}-

      # =========================================================
      # 13. BUILD RUST ANDROID NODE
      # =========================================================
      - name: Build Ycash ARM64 Android node
        shell: bash
        run: |
          set -euo pipefail

          cargo build \
            --release \
            --target "${RUST_TARGET}" \
            -p ycash-android-node

      # =========================================================
      # 14. VERIFY ARM64 NODE
      # =========================================================
      - name: Verify ARM64 Android node
        shell: bash
        run: |
          set -euo pipefail

          NODE="target/${RUST_TARGET}/release/ycash-android-node"

          test -f "$NODE"
          test -x "$NODE"

          echo "=========================================="
          echo "NODE BINARY"
          echo "=========================================="

          ls -lh "$NODE"

          file "$NODE"

          readelf -h "$NODE" | grep -E \
            "Class:|Machine:|Type:"

          readelf -l "$NODE" | grep -E \
            "Type|INTERP|GNU_STACK|GNU_RELRO" || true

          readelf -d "$NODE" | grep NEEDED || true

          echo
          echo "SHA-256:"
          sha256sum "$NODE"

          file "$NODE" | grep -Ei \
            "ARM aarch64|ARM64|aarch64"

          readelf -h "$NODE" | grep -q \
            "Type:[[:space:]]*DYN"

          echo
          echo "ARM64 + PIE verification PASSED."

      # =========================================================
      # 15. PREPARE ANDROID NATIVE LIBRARY
      # =========================================================
      - name: Prepare Android ARM64 native node
        shell: bash
        run: |
          set -euo pipefail

          NODE="target/${RUST_TARGET}/release/ycash-android-node"

          JNI_LIBS="android-app/app/src/main/jniLibs/arm64-v8a"
          NATIVE_NODE="$JNI_LIBS/libycashandroidnode.so"

          mkdir -p "$JNI_LIBS"

          rm -f \
            android-app/app/src/main/assets/ycash-android-node

          rm -f "$NATIVE_NODE"

          cp "$NODE" "$NATIVE_NODE"

          chmod 755 "$NATIVE_NODE"

          test -f "$NATIVE_NODE"

          echo
          echo "Native node:"
          ls -lh "$NATIVE_NODE"

          file "$NATIVE_NODE"

          echo
          echo "SHA-256:"
          sha256sum "$NATIVE_NODE"

      # =========================================================
      # 16. VERIFY NO LEGACY ASSET NODE
      # =========================================================
      - name: Verify legacy asset node is absent
        shell: bash
        run: |
          set -euo pipefail

          if [ -f \
            android-app/app/src/main/assets/ycash-android-node
          ]; then

            echo "ERROR: Legacy asset node still exists."
            exit 1
          fi

          echo "Legacy asset node correctly absent."

      # =========================================================
      # 17. VERIFY ANDROID NATIVE NODE
      # =========================================================
      - name: Verify Android native node
        shell: bash
        run: |
          set -euo pipefail

          NODE="android-app/app/src/main/jniLibs/arm64-v8a/libycashandroidnode.so"

          test -f "$NODE"

          file "$NODE" | grep -Ei \
            "ARM aarch64|ARM64|aarch64"

          readelf -h "$NODE" | grep -q \
            "Type:[[:space:]]*DYN"

          echo
          echo "Android ARM64 native node verification PASSED."

      # =========================================================
      # 18. VERIFY ANDROID PROJECT
      # =========================================================
      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          test -f android-app/settings.gradle
          test -f android-app/build.gradle
          test -f android-app/app/build.gradle
          test -f android-app/app/src/main/AndroidManifest.xml

          test -f \
            android-app/app/src/main/jniLibs/arm64-v8a/libycashandroidnode.so

          echo
          echo "Android project verified."

      # =========================================================
      # 19. VERIFY NATIVE LIBRARY EXTRACTION
      # =========================================================
      - name: Verify native library extraction configuration
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="android-app/app/src/main/AndroidManifest.xml"

          if grep -Eq \
            'extractNativeLibs[[:space:]]*=[[:space:]]*"false"' \
            "$MANIFEST"; then

            echo
            echo "ERROR:"
            echo "extractNativeLibs=false is incompatible with"
            echo "the native-library execution design."

            exit 1
          fi

          grep -Eq \
            'android:extractNativeLibs[[:space:]]*=[[:space:]]*"true"' \
            "$MANIFEST"

          echo
          echo "Native library extraction configuration VERIFIED."

      # =========================================================
      # 20. SET UP GRADLE
      # =========================================================
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # =========================================================
      # 21. BUILD APK
      # =========================================================
      - name: Build Android APK
        working-directory: android-app
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            assembleDebug

      # =========================================================
      # 22. LOCATE APK
      # =========================================================
      - name: Locate Gradle APK
        id: locate_apk
        shell: bash
        run: |
          set -euo pipefail

          APK="android-app/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"

          echo
          echo "APK:"
          ls -lh "$APK"

      # =========================================================
      # 23. VERIFY NATIVE NODE INSIDE APK
      # =========================================================
      - name: Verify ARM64 native node in APK
        shell: bash
        run: |
          set -euo pipefail

          APK="${{ steps.locate_apk.outputs.apk }}"

          echo "=========================================="
          echo "APK NATIVE NODE CHECK"
          echo "=========================================="

          unzip -l "$APK" \
            | grep \
            "lib/arm64-v8a/libycashandroidnode.so"

          echo
          echo "Checking legacy asset..."

          if unzip -l "$APK" \
            | grep -q "assets/ycash-android-node"; then

            echo
            echo "ERROR:"
            echo "Legacy assets/ycash-android-node exists."

            exit 1
          fi

          echo
          echo "Native node packaging PASSED."

      # =========================================================
      # 24. EXTRACT AND VERIFY APK NATIVE NODE
      # =========================================================
      - name: Extract and verify APK native node
        shell: bash
        run: |
          set -euo pipefail

          APK="${{ steps.locate_apk.outputs.apk }}"

          rm -rf apk-native-check
          mkdir -p apk-native-check

          unzip -q "$APK" \
            "lib/arm64-v8a/libycashandroidnode.so" \
            -d apk-native-check

          NODE="apk-native-check/lib/arm64-v8a/libycashandroidnode.so"

          test -f "$NODE"

          echo "Extracted APK node:"
          ls -lh "$NODE"

          echo
          echo "File:"
          file "$NODE"

          echo
          echo "ELF:"
          readelf -h "$NODE" | grep -E \
            "Class:|Machine:|Type:"

          echo
          echo "SHA-256:"
          sha256sum "$NODE"

          file "$NODE" | grep -Ei \
            "ARM aarch64|ARM64|aarch64"

          readelf -h "$NODE" | grep -q \
            "Type:[[:space:]]*DYN"

          echo
          echo "APK native node verification PASSED."

      # =========================================================
      # 25. VERIFY FINAL APK SOURCE FEATURES
      #
      # This makes sure the actual project being packaged still
      # contains the diagnostics we expect.
      # =========================================================
      - name: Verify final diagnostic implementation
        shell: bash
        run: |
          set -euo pipefail

          ACTIVITY="android-app/app/src/main/java/com/ycash/androidnode/MainActivity.java"
          MAIN="crates/ycash-android-node/src/main.rs"

          echo "Checking 8834 status API..."
          grep -q "127.0.0.1:8834/status" "$ACTIVITY"

          echo "Checking P2P diagnostics..."
          grep -q "outbound_attempts" "$MAIN"
          grep -q "outbound_handshakes" "$MAIN"
          grep -q "inbound_connections" "$MAIN"

          echo "Checking 9067 gRPC diagnostic..."
          grep -q "CompactTxStreamer/GetLatestBlock" "$ACTIVITY"
          grep -q "grpc-accept-encoding" "$ACTIVITY"
          grep -q "RST_STREAM" "$ACTIVITY"
          grep -q "GOAWAY" "$ACTIVITY"

          echo
          echo "Final diagnostic implementation VERIFIED."

      # =========================================================
      # 26. GENERATE TEMPORARY DEBUG KEY
      # =========================================================
      - name: Generate temporary debug signing key
        shell: bash
        run: |
          set -euo pipefail

          rm -f "$CI_KEYSTORE"

          keytool \
            -genkeypair \
            -v \
            -keystore "$CI_KEYSTORE" \
            -storepass "$CI_KEYSTORE_PASSWORD" \
            -keypass "$CI_KEY_PASSWORD" \
            -alias "$CI_KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname \
              "CN=Ycash CI Debug, OU=Development, O=Ycash, L=CI, ST=CI, C=GB"

          test -f "$CI_KEYSTORE"

          echo
          echo "Temporary CI signing key generated."

      # =========================================================
      # 27. ZIPALIGN
      # =========================================================
      - name: Zipalign APK
        shell: bash
        run: |
          set -euo pipefail

          INPUT="android-app/app/build/outputs/apk/debug/app-debug.apk"

          ALIGNED="android-app/app/build/outputs/apk/debug/ycash-android-node-aligned.apk"

          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"

          test -x "$ZIPALIGN"
          test -f "$INPUT"

          rm -f "$ALIGNED"

          "$ZIPALIGN" \
            -f \
            -p \
            4 \
            "$INPUT" \
            "$ALIGNED"

          test -f "$ALIGNED"

          echo
          echo "Aligned APK:"
          ls -lh "$ALIGNED"

      # =========================================================
      # 28. VERIFY ZIPALIGN
      # =========================================================
      - name: Verify zip alignment
        shell: bash
        run: |
          set -euo pipefail

          ALIGNED="android-app/app/build/outputs/apk/debug/ycash-android-node-aligned.apk"

          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"

          "$ZIPALIGN" \
            -c \
            -p \
            -v \
            4 \
            "$ALIGNED"

          echo
          echo "Zip alignment verification PASSED."

      # =========================================================
      # 29. SIGN ALIGNED APK
      # =========================================================
      - name: Sign aligned APK
        shell: bash
        run: |
          set -euo pipefail

          ALIGNED="android-app/app/build/outputs/apk/debug/ycash-android-node-aligned.apk"

          SIGNED="android-app/app/build/outputs/apk/debug/ycash-android-node-debug-signed.apk"

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          test -x "$APKSIGNER"
          test -f "$ALIGNED"

          rm -f "$SIGNED"

          "$APKSIGNER" sign \
            --ks "$CI_KEYSTORE" \
            --ks-key-alias "$CI_KEY_ALIAS" \
            --ks-pass "pass:$CI_KEYSTORE_PASSWORD" \
            --key-pass "pass:$CI_KEY_PASSWORD" \
            --out "$SIGNED" \
            "$ALIGNED"

          test -f "$SIGNED"

          echo
          echo "Signed APK:"
          ls -lh "$SIGNED"

      # =========================================================
      # 30. VERIFY APK SIGNATURE
      # =========================================================
      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          SIGNED="android-app/app/build/outputs/apk/debug/ycash-android-node-debug-signed.apk"

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          "$APKSIGNER" verify \
            --verbose \
            "$SIGNED"

          echo
          echo "APK signature verification PASSED."

      # =========================================================
      # 31. VERIFY FINAL SIGNED APK
      # =========================================================
      - name: Verify final signed APK
        shell: bash
        run: |
          set -euo pipefail

          SIGNED="android-app/app/build/outputs/apk/debug/ycash-android-node-debug-signed.apk"

          echo "=========================================="
          echo "FINAL SIGNED APK CHECK"
          echo "=========================================="

          unzip -l "$SIGNED" \
            | grep \
            "lib/arm64-v8a/libycashandroidnode.so"

          if unzip -l "$SIGNED" \
            | grep -q "assets/ycash-android-node"; then

            echo
            echo "ERROR: Legacy asset node found."
            exit 1
          fi

          echo
          echo "Final native node packaging PASSED."

      # =========================================================
      # 32. FINAL APK INFORMATION
      # =========================================================
      - name: Display final APK information
        shell: bash
        run: |
          set -euo pipefail

          SIGNED="android-app/app/build/outputs/apk/debug/ycash-android-node-debug-signed.apk"

          echo
          echo "=========================================="
          echo "FINAL APK"
          echo "=========================================="

          ls -lh "$SIGNED"

          echo
          echo "SHA-256:"
          sha256sum "$SIGNED"

          echo
          echo "=========================================="
          echo "BUILD VERIFICATION COMPLETE"
          echo "=========================================="

      # =========================================================
      # 33. UPLOAD SIGNED APK
      # =========================================================
      - name: Upload signed debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ycash-android-node-debug-signed
          path: android-app/app/build/outputs/apk/debug/ycash-android-node-debug-signed.apk
          if-no-files-found: error

      # =========================================================
      # 34. UPLOAD RAW ARM64 NODE
      # =========================================================
      - name: Upload ARM64 node
        uses: actions/upload-artifact@v4
        with:
          name: ycash-android-node-arm64
          path: target/${{ env.RUST_TARGET }}/release/ycash-android-node
          if-no-files-found: error

      # =========================================================
      # 35. CREATE BUILD DIAGNOSTICS
      # =========================================================
      - name: Create build diagnostics
        if: always()
        shell: bash
        run: |
          set +e

          mkdir -p build-diagnostics

          {
            echo "=========================================="
            echo "YCASH ANDROID NODE BUILD DIAGNOSTICS"
            echo "=========================================="
            echo
            echo "Date:"
            date -u
            echo
            echo "Rust:"
            rustc --version
            echo
            echo "Cargo:"
            cargo --version
            echo
            echo "Android API:"
            echo "$ANDROID_API"
            echo
            echo "Android NDK:"
            echo "$ANDROID_NDK"
            echo
            echo "Rust target:"
            echo "$RUST_TARGET"
            echo
            echo "Expected node ports:"
            echo "P2P    8833"
            echo "RPC    8832"
            echo "STATUS 8834"
            echo
            echo "Native node:"
            find \
              android-app/app/src/main/jniLibs \
              -type f \
              -print \
              2>/dev/null
            echo
            echo "APK files:"
            find \
              android-app/app/build/outputs \
              -type f \
              -print \
              2>/dev/null
            echo
            echo "Git status:"
            git status --short
          } > build-diagnostics/summary.txt

          cat build-diagnostics/summary.txt

      # =========================================================
      # 36. UPLOAD BUILD DIAGNOSTICS
      # =========================================================
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ycash-android-node-build-diagnostics
          path: build-diagnostics
          if-no-files-found: warn

      # =========================================================
      # 37. REMOVE TEMPORARY SIGNING KEY
      # =========================================================
      - name: Remove temporary signing key
        if: always()
        shell: bash
        run: |
          rm -f "$CI_KEYSTORE"

          echo "Temporary signing key removed."
