name: Build, Sign and Verify Ycash Android Node v0.19.6

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  ANDROID_API: "35"
  ANDROID_NDK: "27.2.12479018"
  RUST_TARGET: "aarch64-linux-android"
  ANDROID_ABI: "arm64-v8a"

  CI_KEYSTORE: "${{ github.workspace }}/ci-debug.keystore"
  CI_KEY_ALIAS: "ycash-debug"
  CI_KEYSTORE_PASSWORD: "ycash-debug-password"
  CI_KEY_PASSWORD: "ycash-debug-password"

jobs:
  build:
    name: Build, Align, Sign and Verify Ycash Android Node
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare project root
        shell: bash
        run: |
          set -euo pipefail
          if [ -f Cargo.toml ] && [ -d crates ] && [ -d android-app ]; then
            echo "Valid Ycash project already exists at repository root."
            exit 0
          fi

          mapfile -d '' ZIP_FILES < <(find . -type f -iname '*.zip' -not -path './.git/*' -print0 | sort -z)
          if [ "${#ZIP_FILES[@]}" -eq 0 ]; then
            echo "ERROR: No ZIP files found." >&2
            exit 1
          fi

          ZIP=""
          for candidate in "${ZIP_FILES[@]}"; do
            echo "Checking $candidate"
            unzip -tq "$candidate" >/dev/null 2>&1 || { echo "SKIP: invalid ZIP"; continue; }
            listing="$(unzip -Z1 "$candidate")"
            grep -qE '(^|/)Cargo\.toml$' <<<"$listing" || continue
            grep -qE '(^|/)crates(/|/)' <<<"$listing" || continue
            grep -qE '(^|/)android-app(/|/)' <<<"$listing" || continue
            ZIP="$candidate"
            break
          done

          [ -n "$ZIP" ] || { echo "ERROR: No valid Ycash project ZIP found." >&2; exit 1; }
          rm -rf .ycash-project
          mkdir .ycash-project
          unzip -q "$ZIP" -d .ycash-project

          PROJECT_ROOT=""
          while IFS= read -r -d '' cargo_file; do
            root="$(dirname "$cargo_file")"
            if [ -d "$root/crates" ] && [ -d "$root/android-app" ]; then
              PROJECT_ROOT="$root"
              break
            fi
          done < <(find .ycash-project -type f -name Cargo.toml -print0)

          [ -n "$PROJECT_ROOT" ] || { echo "ERROR: Valid project root not found after extraction." >&2; exit 1; }
          cp -a "$PROJECT_ROOT"/. .
          rm -rf .ycash-project

          test -f Cargo.toml
          test -d crates
          test -d android-app
          echo "Project root ready."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;35.0.0" \
            "ndk;${ANDROID_NDK}"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.RUST_TARGET }}

      - name: Configure Android Rust linker
        shell: bash
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/${ANDROID_NDK}"
          LLVM="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$LLVM/aarch64-linux-android${ANDROID_API}-clang"
          test -x "$LLVM/llvm-ar"
          mkdir -p .cargo
          cat > .cargo/config.toml <<EOF2
          [target.aarch64-linux-android]
          linker = "$LLVM/aarch64-linux-android${ANDROID_API}-clang"
          ar = "$LLVM/llvm-ar"
          EOF2
          echo "CC_aarch64_linux_android=$LLVM/aarch64-linux-android${ANDROID_API}-clang" >> "$GITHUB_ENV"
          echo "CXX_aarch64_linux_android=$LLVM/aarch64-linux-android${ANDROID_API}-clang++" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$LLVM/llvm-ar" >> "$GITHUB_ENV"
          echo "RANLIB_aarch64_linux_android=$LLVM/llvm-ranlib" >> "$GITHUB_ENV"

      - name: Verify Rust workspace
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          cargo --version
          cargo metadata --format-version 1 --no-deps >/dev/null
          test -f crates/ycash-android-node/Cargo.toml
          test -f crates/ycash-android-node/src/main.rs
          test -f crates/ycash-android-node/src/runtime.rs
          echo "Rust workspace verified."

      - name: Run source and networking regression checks
        shell: bash
        run: |
          set -euo pipefail
          if [ -f tools/verify-p2p-fix.sh ]; then
            bash tools/verify-p2p-fix.sh
          fi
          grep -q 'getheaders' crates/ycash-android-node/src/main.rs
          # getdata now lives in pipeline_sync.rs (moved there by the v0.23
          # concurrent pipeline refactor), so check the whole crate rather
          # than only main.rs.
          grep -Rq 'getdata' crates/ycash-android-node/src
          grep -q '8833' crates/ycash-android-node/src/main.rs
          grep -q '8832' crates/ycash-android-node/src/main.rs
          grep -q '8834' crates/ycash-android-node/src/main.rs
          grep -q 'p2p_listening' crates/ycash-android-node/src/main.rs
          grep -q 'outbound_handshakes' crates/ycash-android-node/src/main.rs
          echo "P2P/RPC/status source checks passed."

          grep -q '9067' crates/ycash-android-node/src/main.rs
          grep -q '270014' crates/ycash-android-node/src/main.rs
          grep -Rqs 'CompactTxStreamer' crates/ycash-android-node
          grep -Rqs 'GetLatestBlock' crates/ycash-android-node

          # v0.19.6: 9067 must be bound exactly once and the same
          # listener must be handed to tonic. This prevents the old
          # bind -> drop -> re-bind sequence that could reset gRPC clients.
          grep -q 'serve_with_incoming' crates/ycash-android-node/src/main.rs
          grep -q 'TcpListenerStream::new(listener)' crates/ycash-android-node/src/main.rs
          if grep -q 'drop(listener)' crates/ycash-android-node/src/main.rs; then
            echo "ERROR: old 9067 listener drop/re-bind pattern detected." >&2
            exit 1
          fi

          # The TcpListenerStream wrapper requires tokio-stream's net feature.
          grep -Eq 'tokio-stream[[:space:]]*=.*features.*net' crates/ycash-android-node/Cargo.toml

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ycash-${{ runner.os }}-${{ env.RUST_TARGET }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ycash-${{ runner.os }}-${{ env.RUST_TARGET }}-
            ycash-${{ runner.os }}-

      - name: Build Ycash ARM64 Android node
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --target "${RUST_TARGET}" -p ycash-android-node

      - name: Verify ARM64 PIE node binary
        shell: bash
        run: |
          set -euo pipefail
          NODE="target/${RUST_TARGET}/release/ycash-android-node"
          test -f "$NODE"
          test -x "$NODE"
          file "$NODE"
          readelf -h "$NODE" | tee /tmp/node-elf.txt
          grep -q 'Class:[[:space:]]*ELF64' /tmp/node-elf.txt
          grep -q 'Machine:[[:space:]]*AArch64' /tmp/node-elf.txt
          grep -q 'Type:[[:space:]]*DYN' /tmp/node-elf.txt
          echo "ARM64 PIE executable verification passed."
          echo "SHA-256:"
          sha256sum "$NODE"

      - name: Install native node into jniLibs
        shell: bash
        run: |
          set -euo pipefail
          NODE="target/${RUST_TARGET}/release/ycash-android-node"
          test -f tools/package-node-binary.sh
          BINARY="$NODE" ABI="$ANDROID_ABI" bash tools/package-node-binary.sh
          NATIVE="android-app/app/src/main/jniLibs/${ANDROID_ABI}/libycashandroidnode.so"
          test -f "$NATIVE"
          test -x "$NATIVE"
          rm -rf android-app/app/src/main/assets
          echo "Native executable installed at $NATIVE"

      - name: Verify Android native packaging configuration
        shell: bash
        run: |
          set -euo pipefail
          GRADLE="android-app/app/build.gradle"
          MANIFEST="android-app/app/src/main/AndroidManifest.xml"
          NATIVE="android-app/app/src/main/jniLibs/${ANDROID_ABI}/libycashandroidnode.so"

          test -f "$GRADLE"
          test -f "$MANIFEST"
          test -f "$NATIVE"
          grep -q "abiFilters 'arm64-v8a'" "$GRADLE"
          grep -q 'doNotStrip.*libycashandroidnode\.so' "$GRADLE"
          grep -q 'extractNativeLibs="true"' "$MANIFEST"
          grep -q 'usesCleartextTraffic="true"' "$MANIFEST"
          grep -q 'nativeLibraryDir' android-app/app/src/main/java/com/ycash/androidnode/NodeService.java
          grep -q 'libycashandroidnode\.so' android-app/app/src/main/java/com/ycash/androidnode/NodeService.java
          grep -q '8834' android-app/app/src/main/java/com/ycash/androidnode/MainActivity.java
          grep -q '9067' android-app/app/src/main/java/com/ycash/androidnode/MainActivity.java
          echo "Android native packaging/runtime checks passed."

      # =========================================================
      # VERIFY YWALLET / LIGHTWALLETD gRPC 9067 DIAGNOSTICS
      #
      # 127.0.0.1:9067 is the local plaintext gRPC/h2c endpoint.
      # Do not require literal TLSv1.3/cipher-suite strings here.
      # =========================================================
      - name: Verify YWallet Lightwalletd gRPC diagnostics
        shell: bash
        run: |
          set -euo pipefail

          MAIN="crates/ycash-android-node/src/main.rs"
          ACTIVITY="android-app/app/src/main/java/com/ycash/androidnode/MainActivity.java"

          test -f "$MAIN"
          test -f "$ACTIVITY"

          echo "=========================================="
          echo "YCASH NETWORK / WALLET DIAGNOSTIC CHECK"
          echo "=========================================="

          echo "Checking YWallet gRPC port 9067..."
          grep -q '9067' "$MAIN"
          grep -q '9067' "$ACTIVITY"

          echo "Checking CompactTxStreamer..."
          grep -Rqs 'CompactTxStreamer' crates/ycash-android-node

          echo "Checking GetLatestBlock..."
          grep -Rqs 'GetLatestBlock' crates/ycash-android-node
          grep -q 'CompactTxStreamer/GetLatestBlock' "$ACTIVITY"

          echo "Checking GetBlockRange..."
          grep -Rqs 'GetBlockRange' crates/ycash-android-node

          echo "Checking GetLightdInfo..."
          grep -Rqs 'GetLightdInfo' crates/ycash-android-node

          echo "Checking gRPC HTTP/2 diagnostics..."
          grep -q 'application/grpc' "$ACTIVITY"
          grep -q 'grpc-accept-encoding' "$ACTIVITY"

          echo "Checking gRPC stream/error diagnostics..."
          grep -q 'RST_STREAM' "$ACTIVITY"
          grep -q 'GOAWAY' "$ACTIVITY"

          echo "Checking P2P diagnostics..."
          grep -q 'outbound_handshakes' "$MAIN"

          echo "Checking DNS seed diagnostics..."
          grep -Rqs 'seed.ycash.xyz' crates/ycash-android-node ||             grep -Rqi 'DNS seed' crates/ycash-android-node

          echo "Checking Ycash P2P protocol..."
          grep -q '270014' "$MAIN"

          echo
          echo "=========================================="
          echo "NETWORK DIAGNOSTIC SOURCE CHECKS PASSED"
          echo "=========================================="
          echo "P2P      : 8833"
          echo "RPC      : 8832"
          echo "STATUS   : 8834"
          echo "WALLET   : 9067 (plaintext h2c)"
          echo "PROTOCOL : 270014"
          echo "9067 FIX  : single-bound listener -> tonic"
          echo "gRPC     : CompactTxStreamer"
          echo "TLS TEXT : NOT REQUIRED FOR LOCAL 9067"
          echo "=========================================="

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Android APK
        working-directory: android-app
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace assembleDebug

      - name: Locate and inspect Gradle APK
        id: locate_apk
        shell: bash
        run: |
          set -euo pipefail
          APK="android-app/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          unzip -l "$APK" | grep 'lib/arm64-v8a/libycashandroidnode.so'
          if unzip -l "$APK" | grep -q 'assets/ycash-android-node'; then
            echo "ERROR: legacy executable asset is still packaged." >&2
            exit 1
          fi
          echo "APK contains native ARM64 node and no legacy executable asset."

      - name: Verify native node inside APK
        shell: bash
        run: |
          set -euo pipefail
          APK="${{ steps.locate_apk.outputs.apk }}"
          rm -rf /tmp/apk-native
          mkdir -p /tmp/apk-native
          unzip -p "$APK" "lib/arm64-v8a/libycashandroidnode.so" > /tmp/apk-native/libycashandroidnode.so
          test -s /tmp/apk-native/libycashandroidnode.so
          file /tmp/apk-native/libycashandroidnode.so
          readelf -h /tmp/apk-native/libycashandroidnode.so | tee /tmp/apk-native/elf.txt
          grep -q 'Class:[[:space:]]*ELF64' /tmp/apk-native/elf.txt
          grep -q 'Machine:[[:space:]]*AArch64' /tmp/apk-native/elf.txt
          grep -q 'Type:[[:space:]]*DYN' /tmp/apk-native/elf.txt
          echo "Final APK native-node verification passed."

      - name: Generate temporary debug signing key
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$CI_KEYSTORE"
          keytool -genkeypair -v \
            -keystore "$CI_KEYSTORE" \
            -storepass "$CI_KEYSTORE_PASSWORD" \
            -keypass "$CI_KEY_PASSWORD" \
            -alias "$CI_KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=Ycash CI Debug, OU=Development, O=Ycash, L=CI, ST=CI, C=GB"

      - name: Zipalign APK
        shell: bash
        run: |
          set -euo pipefail
          INPUT="android-app/app/build/outputs/apk/debug/app-debug.apk"
          ALIGNED="android-app/app/build/outputs/apk/debug/ycash-android-node-aligned.apk"
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          test -x "$ZIPALIGN"
          "$ZIPALIGN" -f -p 4 "$INPUT" "$ALIGNED"
          "$ZIPALIGN" -c -p -v 4 "$ALIGNED"

      - name: Sign aligned APK
        shell: bash
        run: |
          set -euo pipefail
          ALIGNED="android-app/app/build/outputs/apk/debug/ycash-android-node-aligned.apk"
          SIGNED="android-app/app/build/outputs/apk/debug/ycash-android-node-debug-signed.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" sign \
            --ks "$CI_KEYSTORE" \
            --ks-key-alias "$CI_KEY_ALIAS" \
            --ks-pass "pass:$CI_KEYSTORE_PASSWORD" \
            --key-pass "pass:$CI_KEY_PASSWORD" \
            --out "$SIGNED" "$ALIGNED"
          test -f "$SIGNED"

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          SIGNED="android-app/app/build/outputs/apk/debug/ycash-android-node-debug-signed.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$SIGNED"

      - name: Final APK regression verification
        shell: bash
        run: |
          set -euo pipefail
          SIGNED="android-app/app/build/outputs/apk/debug/ycash-android-node-debug-signed.apk"
          unzip -l "$SIGNED" | grep 'lib/arm64-v8a/libycashandroidnode.so'
          if unzip -l "$SIGNED" | grep -q 'assets/ycash-android-node'; then
            echo "ERROR: legacy asset found in final signed APK." >&2
            exit 1
          fi
          echo "Final signed APK contains the executable in nativeLibraryDir packaging."
          echo "SHA-256:"
          sha256sum "$SIGNED"

      - name: Upload signed debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ycash-android-node-debug-signed
          path: android-app/app/build/outputs/apk/debug/ycash-android-node-debug-signed.apk
          if-no-files-found: error

      - name: Upload ARM64 node
        uses: actions/upload-artifact@v4
        with:
          name: ycash-android-node-arm64
          path: target/${{ env.RUST_TARGET }}/release/ycash-android-node
          if-no-files-found: error

      - name: Remove temporary signing key
        if: always()
        shell: bash
        run: rm -f "$CI_KEYSTORE"
