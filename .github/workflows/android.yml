name: Build, Sign and Verify Ycash Android Node

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  ANDROID_API: "35"
  ANDROID_NDK: "27.2.12479018"
  RUST_TARGET: "aarch64-linux-android"
  ANDROID_ABI: "arm64-v8a"

  KEYSTORE_FILE: "ci-debug.keystore"
  KEY_ALIAS: "ycash-ci"
  KEYSTORE_PASSWORD: "ycash-ci-password"
  KEY_PASSWORD: "ycash-ci-password"

jobs:
  build-android-node:
    name: Build Ycash Android ARM64 Node
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v5

      # ============================================================
      # 2. PREPARE PROJECT ROOT
      # ============================================================
      - name: Prepare project root
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Preparing project root"
          echo "============================================================"

          if [[ -f Cargo.toml && -d crates && -d android-app ]]; then
            echo "Project root already contains Cargo.toml, crates/, and android-app/."
          else
            echo "Project root does not contain expected structure."

            ZIP_FILE="$(find . -maxdepth 2 -type f \( -name '*.zip' -o -name '*.ZIP' \) | head -n 1 || true)"

            if [[ -z "$ZIP_FILE" ]]; then
              echo "ERROR: No project ZIP found." >&2
              exit 1
            fi

            echo "Using project archive: $ZIP_FILE"

            mkdir -p _project_extract
            unzip -q "$ZIP_FILE" -d _project_extract

            PROJECT_ROOT="$(
              find _project_extract -type f -name Cargo.toml -print0 |
                while IFS= read -r -d '' file; do
                  dir="$(dirname "$file")"
                  if [[ -d "$dir/crates" && -d "$dir/android-app" ]]; then
                    echo "$dir"
                    break
                  fi
                done
            )"

            if [[ -z "$PROJECT_ROOT" ]]; then
              echo "ERROR: Could not locate Ycash project root inside archive." >&2
              exit 1
            fi

            echo "Located project root: $PROJECT_ROOT"

            shopt -s dotglob
            cp -a "$PROJECT_ROOT"/. .
            shopt -u dotglob
          fi

          test -f Cargo.toml
          test -d crates
          test -d android-app

          echo "Project root prepared successfully."

      # ============================================================
      # 3. RESTORE SCRIPT PERMISSIONS
      # ============================================================
      - name: Restore shell script executable permissions
        shell: bash
        run: |
          set -euo pipefail

          find . -type f -name '*.sh' -exec chmod +x {} \;

          test -x tools/build-android-arm64.sh
          test -x tools/package-node-binary.sh
          test -x tools/verify-android-package.sh

          echo "Required build scripts are executable."

      # ============================================================
      # 4. VERIFY PROJECT
      # ============================================================
      - name: Verify project structure
        shell: bash
        run: |
          set -euo pipefail

          test -f Cargo.toml
          test -d crates
          test -d android-app
          test -d tools

          echo "Project structure verified."

      # ============================================================
      # 5. JAVA 17
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java
        shell: bash
        run: |
          set -euo pipefail
          java -version
          javac -version

      # ============================================================
      # 6. ANDROID SDK / NDK
      # ============================================================
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --version

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;35.0.0" \
            "ndk;${ANDROID_NDK}"

          yes | sdkmanager --licenses >/dev/null || true

      - name: Verify Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail

          NDK_ROOT="${ANDROID_HOME}/ndk/${ANDROID_NDK}"
          TOOLCHAIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64"

          test -d "$NDK_ROOT"
          test -d "$TOOLCHAIN"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/35.0.0/zipalign"

          test -x \
            "$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang"

          echo "Android SDK verified."
          echo "API:         ${ANDROID_API}"
          echo "NDK:         ${ANDROID_NDK}"
          echo "ABI:         ${ANDROID_ABI}"

      # ============================================================
      # 7. RUST
      # ============================================================
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.RUST_TARGET }}

      - name: Verify Rust target
        shell: bash
        run: |
          set -euo pipefail

          rustc --version
          cargo --version

          rustup target list --installed |
            grep -Fx "${RUST_TARGET}"

          echo "Rust target verified."

      # ============================================================
      # 8. VERIFY PARALLEL PIPELINE
      # ============================================================
      - name: Verify parallel 4-worker pipeline configuration
        shell: bash
        run: |
          set -euo pipefail

          PIPELINE_CONFIG="config/pipeline.toml"
          ADAPTIVE_SOURCE="crates/state/src/pipeline/adaptive.rs"
          PIPELINE_SOURCE="crates/state/src/pipeline/mod.rs"

          test -f "$PIPELINE_CONFIG"
          test -f "$ADAPTIVE_SOURCE"
          test -f "$PIPELINE_SOURCE"

          echo "============================================================"
          echo "PIPELINE CONFIGURATION"
          echo "============================================================"

          cat "$PIPELINE_CONFIG"

          WORKERS="$(
            sed -nE \
              's/^[[:space:]]*max_validation_workers[[:space:]]*=[[:space:]]*([0-9]+)[[:space:]]*$/\1/p' \
              "$PIPELINE_CONFIG"
          )"

          INFLIGHT="$(
            sed -nE \
              's/^[[:space:]]*max_inflight_ranges[[:space:]]*=[[:space:]]*([0-9]+)[[:space:]]*$/\1/p' \
              "$PIPELINE_CONFIG"
          )"

          echo "Validation workers: $WORKERS"
          echo "In-flight ranges:   $INFLIGHT"

          [[ "$WORKERS" == "4" ]] || {
            echo "ERROR: Expected 4 validation workers." >&2
            exit 1
          }

          [[ "$INFLIGHT" == "4" ]] || {
            echo "ERROR: Expected 4 in-flight ranges." >&2
            exit 1
          }

          grep -Eq \
            'const MAX_RANGE_LEN:[[:space:]]*u64[[:space:]]*=[[:space:]]*16[[:space:]]*;' \
            "$PIPELINE_SOURCE"

          grep -Eq 'min_window:[[:space:]]*16' "$ADAPTIVE_SOURCE"
          grep -Eq 'initial_window:[[:space:]]*16' "$ADAPTIVE_SOURCE"
          grep -Eq 'max_window:[[:space:]]*16' "$ADAPTIVE_SOURCE"

          grep -Eq \
            '^[[:space:]]*ordered_state_commit[[:space:]]*=[[:space:]]*true[[:space:]]*$' \
            "$PIPELINE_CONFIG"

          grep -Eq \
            '^[[:space:]]*bounded_commit_buffer[[:space:]]*=[[:space:]]*true[[:space:]]*$' \
            "$PIPELINE_CONFIG"

          if grep -Eq \
            '^[[:space:]]*max_validation_workers[[:space:]]*=[[:space:]]*1[[:space:]]*$' \
            "$PIPELINE_CONFIG"; then
            echo "ERROR: stale single-worker configuration found." >&2
            exit 1
          fi

          if grep -Eq \
            '^[[:space:]]*max_inflight_ranges[[:space:]]*=[[:space:]]*1[[:space:]]*$' \
            "$PIPELINE_CONFIG"; then
            echo "ERROR: stale single-range configuration found." >&2
            exit 1
          fi

          echo
          echo "PARALLEL PIPELINE VERIFIED"
          echo "  Batch:             16"
          echo "  Validation workers: 4"
          echo "  In-flight ranges:   4"
          echo "  Ordered commit:     enabled"
          echo "  Commit buffer:      bounded"

      # ============================================================
      # 9. RUST TESTS
      # ============================================================
      - name: Run Rust workspace regression tests
        shell: bash
        run: |
          set -euo pipefail

          cargo test --workspace --all-targets

      # ============================================================
      # 10. ANDROID LINKER
      # ============================================================
      - name: Configure Android ARM64 linker
        shell: bash
        run: |
          set -euo pipefail

          NDK_ROOT="${ANDROID_HOME}/ndk/${ANDROID_NDK}"
          TOOLCHAIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64"

          CLANG="$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang"
          AR="$TOOLCHAIN/bin/llvm-ar"
          RANLIB="$TOOLCHAIN/bin/llvm-ranlib"

          test -x "$CLANG"
          test -x "$AR"
          test -x "$RANLIB"

          {
            echo "ANDROID_NDK_ROOT=$NDK_ROOT"
            echo "ANDROID_NDK_HOME=$NDK_ROOT"
            echo "ANDROID_API_LEVEL=${ANDROID_API}"

            echo "CC_aarch64_linux_android=$CLANG"
            echo "CXX_aarch64_linux_android=${CLANG}++"
            echo "AR_aarch64_linux_android=$AR"
            echo "RANLIB_aarch64_linux_android=$RANLIB"

            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$CLANG"
          } >> "$GITHUB_ENV"

          mkdir -p .cargo

          cat > .cargo/config.toml <<EOF
          [target.aarch64-linux-android]
          linker = "${CLANG}"
          ar = "${AR}"
          rustflags = [
            "-C",
            "link-arg=-Wl,--gc-sections"
          ]
          EOF

          cat .cargo/config.toml

      # ============================================================
      # 11. VERIFY ANDROID RUNTIME WIRING
      # ============================================================
      - name: Verify Android runtime wiring
        shell: bash
        run: |
          set -euo pipefail

          MAIN="crates/ycash-android-node/src/main.rs"
          SERVICE="android-app/app/src/main/java/com/ycash/androidnode/NodeService.java"
          ACTIVITY="android-app/app/src/main/java/com/ycash/androidnode/MainActivity.java"
          GRADLE="android-app/app/build.gradle"
          MANIFEST="android-app/app/src/main/AndroidManifest.xml"

          test -f "$MAIN"
          test -f "$SERVICE"
          test -f "$ACTIVITY"
          test -f "$GRADLE"
          test -f "$MANIFEST"

          grep -q '8833' "$MAIN"
          grep -q '8832' "$MAIN"
          grep -q '8834' "$MAIN"
          grep -q '9067' "$MAIN"

          grep -q 'nativeLibraryDir' "$SERVICE"
          grep -q 'libycashandroidnode\.so' "$SERVICE"
          grep -q 'ProcessBuilder' "$SERVICE"
          grep -q 'node.log' "$SERVICE"
          grep -q 'redirectErrorStream' "$SERVICE"

          grep -q "abiFilters 'arm64-v8a'" "$GRADLE"
          grep -q 'doNotStrip.*libycashandroidnode\.so' "$GRADLE"

          grep -q 'extractNativeLibs="true"' "$MANIFEST"
          grep -q 'usesCleartextTraffic="true"' "$MANIFEST"

          echo "Android runtime wiring verified."

      # ============================================================
      # 12. CLEAN OLD NATIVE PACKAGE
      # ============================================================
      - name: Clean stale native artifacts
        shell: bash
        run: |
          set -euo pipefail

          NATIVE_DIR="android-app/app/src/main/jniLibs/${ANDROID_ABI}"

          mkdir -p "$NATIVE_DIR"

          rm -f \
            "$NATIVE_DIR/libycashandroidnode.so" \
            "$NATIVE_DIR/PLACE_BINARY_HERE.md"

          rm -rf android-app/app/src/main/assets

          echo "Old native package removed."

      # ============================================================
      # 13. BUILD + PACKAGE REAL ARM64 NODE
      #
      # THIS IS THE IMPORTANT FIX.
      #
      # build-android-arm64.sh:
      #   1. builds ycash-android-node
      #   2. calls package-node-binary.sh
      #   3. installs libycashandroidnode.so into jniLibs
      # ============================================================
      - name: Build and package Android ARM64 node
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_API_LEVEL="${ANDROID_API}"
          export ANDROID_NDK_ROOT="${ANDROID_HOME}/ndk/${ANDROID_NDK}"

          echo "============================================================"
          echo "BUILDING AND PACKAGING REAL ARM64 NODE"
          echo "============================================================"

          bash -x tools/build-android-arm64.sh \
            2>&1 | tee android-arm64-build.log

          echo
          echo "Android ARM64 build/package completed."

      # ============================================================
      # 14. VERIFY NATIVE NODE BEFORE GRADLE
      # ============================================================
      - name: Verify packaged native node before APK build
        shell: bash
        run: |
          set -euo pipefail

          NODE="target/${RUST_TARGET}/release/ycash-android-node"
          NATIVE="android-app/app/src/main/jniLibs/${ANDROID_ABI}/libycashandroidnode.so"

          echo "============================================================"
          echo "VERIFYING NATIVE NODE"
          echo "============================================================"

          test -f "$NODE" || {
            echo "ERROR: Rust node missing: $NODE" >&2
            exit 1
          }

          test -x "$NODE"

          test -f "$NATIVE" || {
            echo "ERROR: Packaged native library missing: $NATIVE" >&2
            exit 1
          }

          test -x "$NATIVE"

          echo
          echo "Rust binary:"
          file "$NODE"

          echo
          echo "Packaged native binary:"
          file "$NATIVE"

          readelf -h "$NODE" | tee /tmp/node-elf.txt
          readelf -h "$NATIVE" | tee /tmp/native-elf.txt

          grep -q 'Class:[[:space:]]*ELF64' /tmp/node-elf.txt
          grep -q 'Machine:[[:space:]]*AArch64' /tmp/node-elf.txt

          grep -q 'Class:[[:space:]]*ELF64' /tmp/native-elf.txt
          grep -q 'Machine:[[:space:]]*AArch64' /tmp/native-elf.txt

          NODE_HASH="$(sha256sum "$NODE" | awk '{print $1}')"
          NATIVE_HASH="$(sha256sum "$NATIVE" | awk '{print $1}')"

          echo
          echo "Rust node SHA-256:      $NODE_HASH"
          echo "Packaged node SHA-256:  $NATIVE_HASH"

          test "$NODE_HASH" = "$NATIVE_HASH" || {
            echo "ERROR: packaged .so differs from Rust binary." >&2
            exit 1
          }

          echo
          echo "PASS: native node is present and byte-for-byte identical."

      # ============================================================
      # 15. VERIFY ANDROID PACKAGE
      # ============================================================
      - name: Verify Android native package
        shell: bash
        run: |
          set -euo pipefail

          bash tools/verify-android-package.sh

      # ============================================================
      # 16. GENERATE KEYSTORE
      # ============================================================
      - name: Generate CI debug keystore
        shell: bash
        run: |
          set -euo pipefail

          rm -f "$KEYSTORE_FILE"

          keytool -genkeypair \
            -v \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Ycash CI,O=Ycash,C=GB"

          test -f "$KEYSTORE_FILE"

      # ============================================================
      # 17. GRADLE
      # ============================================================
      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Generate and verify Gradle wrapper
        working-directory: android-app
        shell: bash
        run: |
          set -euo pipefail

          test -f ./gradlew
          test -f ./gradle/wrapper/gradle-wrapper.properties

          chmod +x ./gradlew

          if [[ ! -f ./gradle/wrapper/gradle-wrapper.jar ]]; then
            gradle wrapper --gradle-version 8.10.2
          fi

          test -f ./gradle/wrapper/gradle-wrapper.jar

      # ============================================================
      # 18. BUILD DEBUG APK
      # ============================================================
      - name: Build Android debug APK
        working-directory: android-app
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      # ============================================================
      # 19. LOCATE APK
      # ============================================================
      - name: Locate debug APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          APK="android-app/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"

          echo "APK: $APK"

      # ============================================================
      # 20. VERIFY APK CONTAINS NATIVE NODE
      # ============================================================
      - name: Verify debug APK contains ARM64 native node
        shell: bash
        run: |
          set -euo pipefail

          APK="${{ steps.apk.outputs.apk }}"
          NODE="target/${RUST_TARGET}/release/ycash-android-node"
          EXTRACTED="/tmp/apk-node.so"

          echo "============================================================"
          echo "VERIFYING APK NATIVE LIBRARY"
          echo "============================================================"

          APK_LISTING="$(unzip -l "$APK")"

          grep -Fq \
            'lib/arm64-v8a/libycashandroidnode.so' \
            <<< "$APK_LISTING" || {
              echo "ERROR: libycashandroidnode.so is NOT inside APK." >&2
              echo
              echo "APK contents:"
              echo "$APK_LISTING"
              exit 1
            }

          if grep -Fq 'assets/ycash-android-node' <<< "$APK_LISTING"; then
            echo "ERROR: legacy executable asset found." >&2
            exit 1
          fi

          unzip -p "$APK" \
            'lib/arm64-v8a/libycashandroidnode.so' \
            > "$EXTRACTED"

          test -s "$EXTRACTED"

          file "$EXTRACTED"

          readelf -h "$EXTRACTED" | tee /tmp/apk-node-elf.txt

          grep -q 'Class:[[:space:]]*ELF64' /tmp/apk-node-elf.txt
          grep -q 'Machine:[[:space:]]*AArch64' /tmp/apk-node-elf.txt

          BUILT_HASH="$(sha256sum "$NODE" | awk '{print $1}')"
          APK_HASH="$(sha256sum "$EXTRACTED" | awk '{print $1}')"

          echo
          echo "Rust binary SHA-256: $BUILT_HASH"
          echo "APK binary SHA-256:  $APK_HASH"

          test "$BUILT_HASH" = "$APK_HASH" || {
            echo "ERROR: APK native binary differs from Rust build." >&2
            exit 1
          }

          echo
          echo "PASS: APK contains exact ARM64 Rust node."

      # ============================================================
      # 21. SIGN APK
      # ============================================================
      - name: Sign and verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="${{ steps.apk.outputs.apk }}"

          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          ALIGNED="${APK%.apk}-aligned.apk"
          SIGNED="${APK%.apk}-signed.apk"

          "$ZIPALIGN" \
            -f \
            -p \
            4 \
            "$APK" \
            "$ALIGNED"

          "$ZIPALIGN" \
            -c \
            -p \
            -v \
            4 \
            "$ALIGNED"

          "$APKSIGNER" sign \
            --ks "$GITHUB_WORKSPACE/$KEYSTORE_FILE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$SIGNED" \
            "$ALIGNED"

          "$APKSIGNER" verify \
            --verbose \
            "$SIGNED"

          test -f "$SIGNED"

          echo "SIGNED_APK=$SIGNED" >> "$GITHUB_ENV"

      # ============================================================
      # 22. FINAL SIGNED APK NATIVE VERIFICATION
      # ============================================================
      - name: Final signed APK native regression verification
        shell: bash
        run: |
          set -euo pipefail

          SIGNED="$SIGNED_APK"
          NODE="target/${RUST_TARGET}/release/ycash-android-node"
          EXTRACTED="/tmp/final-signed-node.so"

          test -f "$SIGNED"

          APK_LISTING="$(unzip -l "$SIGNED")"

          grep -Fq \
            'lib/arm64-v8a/libycashandroidnode.so' \
            <<< "$APK_LISTING"

          if grep -Fq 'assets/ycash-android-node' <<< "$APK_LISTING"; then
            echo "ERROR: legacy executable asset found in signed APK." >&2
            exit 1
          fi

          unzip -p "$SIGNED" \
            'lib/arm64-v8a/libycashandroidnode.so' \
            > "$EXTRACTED"

          test -s "$EXTRACTED"

          file "$EXTRACTED"

          readelf -h "$EXTRACTED" | tee /tmp/final-node-elf.txt

          grep -q 'Class:[[:space:]]*ELF64' /tmp/final-node-elf.txt
          grep -q 'Machine:[[:space:]]*AArch64' /tmp/final-node-elf.txt

          BUILT_HASH="$(sha256sum "$NODE" | awk '{print $1}')"
          FINAL_HASH="$(sha256sum "$EXTRACTED" | awk '{print $1}')"

          echo "Rust node SHA-256:      $BUILT_HASH"
          echo "Signed APK node SHA-256: $FINAL_HASH"

          test "$BUILT_HASH" = "$FINAL_HASH"

          echo
          echo "============================================================"
          echo "FINAL SIGNED APK VERIFIED"
          echo "============================================================"
          echo "ABI:           arm64-v8a"
          echo "Native node:   PRESENT"
          echo "Native binary: EXACT RUST BUILD"
          echo "Signature:     VERIFIED"
          echo "Legacy asset:  ABSENT"
          echo "============================================================"

      # ============================================================
      # 23. COLLECT ARTIFACTS
      # ============================================================
      - name: Collect build artifacts
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ci-artifacts

          cp \
            "target/${RUST_TARGET}/release/ycash-android-node" \
            ci-artifacts/ycash-android-node-arm64

          cp \
            "android-app/app/src/main/jniLibs/${ANDROID_ABI}/libycashandroidnode.so" \
            ci-artifacts/libycashandroidnode.so

          cp \
            "$SIGNED_APK" \
            ci-artifacts/ycash-android-node-debug-signed.apk

          if [[ -f android-arm64-build.log ]]; then
            cp android-arm64-build.log ci-artifacts/
          fi

          echo "Artifacts:"
          find ci-artifacts -type f -printf '%p\n' | sort

      # ============================================================
      # 24. UPLOAD ARTIFACTS
      # ============================================================
      - name: Upload Android node artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ycash-android-node-${{ github.sha }}
          path: ci-artifacts
          if-no-files-found: error
          retention-days: 14

      # ============================================================
      # 25. CLEANUP
      # ============================================================
      - name: Cleanup CI signing material
        if: always()
        shell: bash
        run: |
          set +e

          rm -f "$KEYSTORE_FILE"

          find android-app \
            -type f \
            \( -name '*-aligned.apk' -o -name '*-signed.apk' \) \
            -delete \
            2>/dev/null || true

          echo "CI signing material cleaned up."
