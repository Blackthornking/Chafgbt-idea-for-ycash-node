name: Build, Sign and Verify Ycash Android Node

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  ANDROID_API: "35"
  ANDROID_NDK: "27.2.12479018"
  RUST_TARGET: "aarch64-linux-android"
  ANDROID_ABI: "arm64-v8a"

  CI_KEYSTORE: "${{ github.workspace }}/ci-debug.keystore"
  CI_KEY_ALIAS: "ycash-debug"
  CI_KEYSTORE_PASSWORD: "ycash-debug-password"
  CI_KEY_PASSWORD: "ycash-debug-password"

jobs:
  build:
    name: Build, Sign and Verify Ycash Android Node
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify project structure
        shell: bash
        run: |
          set -euo pipefail
          test -f Cargo.toml
          test -d crates
          test -d android-app
          test -f crates/ycash-android-node/Cargo.toml
          test -f crates/ycash-android-node/src/main.rs
          test -f crates/ycash-android-node/src/runtime.rs
          test -f android-app/app/build.gradle
          test -f android-app/app/src/main/AndroidManifest.xml
          test -f android-app/app/src/main/java/com/ycash/androidnode/MainActivity.java
          test -f android-app/app/src/main/java/com/ycash/androidnode/NodeService.java
          echo "Project structure verified."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;35.0.0" \
            "ndk;${ANDROID_NDK}"

          test -d "$ANDROID_HOME/ndk/${ANDROID_NDK}"
          test -d "$ANDROID_HOME/platforms/android-${ANDROID_API}"
          test -x "$ANDROID_HOME/build-tools/35.0.0/zipalign"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.RUST_TARGET }}

      - name: Verify Rust workspace
        shell: bash
        run: |
          set -euo pipefail

          rustc --version
          cargo --version

          cargo metadata --format-version 1 --no-deps >/dev/null

          INSTALLED_TARGETS="$(rustup target list --installed)"

          echo "Installed Rust targets:"
          printf '%s\n' "$INSTALLED_TARGETS"

          # IMPORTANT:
          # Do not use:
          # rustup target list --installed | grep -q ...
          #
          # With "set -o pipefail", grep -q can close the pipe early and
          # cause rustup to receive SIGPIPE, producing a false CI failure.
          if ! grep -Fx "${RUST_TARGET}" <<< "$INSTALLED_TARGETS" >/dev/null; then
            echo "ERROR: Rust target ${RUST_TARGET} is not installed." >&2
            exit 1
          fi

          echo "Rust workspace verified."

      - name: Run Rust regression suite
        shell: bash
        run: |
          set -euo pipefail

          cargo test --workspace --all-targets

          echo "Rust tests passed, including the SQLite schema/reorg regressions."

      - name: Verify database schema ordering
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import sqlite3

          con = sqlite3.connect(":memory:")

          con.executescript("""
          CREATE TABLE txs(
            txid BLOB PRIMARY KEY,
            block_hash BLOB NOT NULL,
            raw BLOB NOT NULL
          );

          CREATE INDEX txs_block_hash
            ON txs(block_hash);
          """)

          row = con.execute(
              "SELECT tbl_name FROM sqlite_master "
              "WHERE type='index' AND name='txs_block_hash'"
          ).fetchone()

          assert row == ("txs",), row

          print("SQLite txs/index ordering verified.")
          PY

      - name: Configure Android Rust linker
        shell: bash
        run: |
          set -euo pipefail

          NDK="$ANDROID_HOME/ndk/${ANDROID_NDK}"
          LLVM="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CLANG="$LLVM/aarch64-linux-android${ANDROID_API}-clang"

          test -x "$CLANG"
          test -x "$LLVM/llvm-ar"
          test -x "$LLVM/llvm-ranlib"

          mkdir -p .cargo

          cat > .cargo/config.toml <<EOF
          [target.aarch64-linux-android]
          linker = "$CLANG"
          ar = "$LLVM/llvm-ar"
          EOF

          echo "CC_aarch64_linux_android=$CLANG" >> "$GITHUB_ENV"
          echo "CXX_aarch64_linux_android=$LLVM/aarch64-linux-android${ANDROID_API}-clang++" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$LLVM/llvm-ar" >> "$GITHUB_ENV"
          echo "RANLIB_aarch64_linux_android=$LLVM/llvm-ranlib" >> "$GITHUB_ENV"

      - name: Verify node source and networking contract
        shell: bash
        run: |
          set -euo pipefail

          MAIN="crates/ycash-android-node/src/main.rs"
          SERVICE="android-app/app/src/main/java/com/ycash/androidnode/NodeService.java"
          ACTIVITY="android-app/app/src/main/java/com/ycash/androidnode/MainActivity.java"
          GRADLE="android-app/app/build.gradle"
          MANIFEST="android-app/app/src/main/AndroidManifest.xml"

          grep -q '8833' "$MAIN"
          grep -q '8832' "$MAIN"
          grep -q '8834' "$MAIN"
          grep -q '9067' "$MAIN"
          grep -q '270014' "$MAIN"
          grep -q 'p2p_listening' "$MAIN"
          grep -q 'outbound_handshakes' "$MAIN"

          grep -Rq 'getheaders' crates/ycash-android-node/src
          grep -Rq 'getdata' crates/ycash-android-node/src
          grep -Rq 'CompactTxStreamer' crates/ycash-android-node
          grep -Rq 'GetLatestBlock' crates/ycash-android-node
          grep -Rq 'GetBlockRange' crates/ycash-android-node
          grep -Rq 'GetLightdInfo' crates/ycash-android-node

          grep -q 'serve_with_incoming' "$MAIN"
          grep -q 'TcpListenerStream::new(listener)' "$MAIN"

          if grep -q 'drop(listener)' "$MAIN"; then
            echo "ERROR: old 9067 listener drop/re-bind pattern detected." >&2
            exit 1
          fi

          grep -Eq \
            'tokio-stream[[:space:]]*=.*features.*net' \
            crates/ycash-android-node/Cargo.toml

          grep -q 'nativeLibraryDir' "$SERVICE"
          grep -q 'libycashandroidnode\.so' "$SERVICE"
          grep -q 'ProcessBuilder' "$SERVICE"
          grep -q 'node.log' "$SERVICE"
          grep -q 'redirectErrorStream' "$SERVICE"

          grep -q '8834' "$ACTIVITY"
          grep -q '9067' "$ACTIVITY"

          grep -q "abiFilters 'arm64-v8a'" "$GRADLE"
          grep -q 'doNotStrip.*libycashandroidnode\.so' "$GRADLE"

          grep -q 'extractNativeLibs="true"' "$MANIFEST"
          grep -q 'usesCleartextTraffic="true"' "$MANIFEST"

          echo "Node/networking/runtime contract verified."

      - name: Verify crash-safe diagnostics source
        shell: bash
        run: |
          set -euo pipefail

          ACTIVITY="android-app/app/src/main/java/com/ycash/androidnode/MainActivity.java"

          grep -q 'refreshDeviceStatsSafe' "$ACTIVITY"
          grep -q 'refreshNodeLog' "$ACTIVITY"
          grep -q 'refreshAppErrorLog' "$ACTIVITY"
          grep -q 'safeSetText' "$ACTIVITY"
          grep -q 'writeAppError' "$ACTIVITY"
          grep -q 'app-error.log' "$ACTIVITY"
          grep -q 'UNCAUGHT EXCEPTION' "$ACTIVITY"
          grep -q 'DIAGNOSTICS CLICK' "$ACTIVITY"

          echo "Crash-safe diagnostics source verified."

      - name: Clean stale Android native artifacts
        shell: bash
        run: |
          set -euo pipefail

          NATIVE_DIR="android-app/app/src/main/jniLibs/${ANDROID_ABI}"

          mkdir -p "$NATIVE_DIR"

          rm -f "$NATIVE_DIR/libycashandroidnode.so"
          rm -f "$NATIVE_DIR/PLACE_BINARY_HERE.md"
          rm -rf android-app/app/src/main/assets

          echo "Stale native artifacts removed."

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ycash-${{ runner.os }}-${{ env.RUST_TARGET }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ycash-${{ runner.os }}-${{ env.RUST_TARGET }}-
            ycash-${{ runner.os }}-

      - name: Build and package Android ARM64 node
        shell: bash
        run: |
          set -uo pipefail

          export ANDROID_API_LEVEL="${ANDROID_API}"
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/${ANDROID_NDK}"

          echo "=== Android ARM64 build environment ==="

          rustc --version
          cargo --version
          rustup target list --installed

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"
          echo "ANDROID_API_LEVEL=$ANDROID_API_LEVEL"

          test -x \
            "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API_LEVEL}-clang"

          echo "=== Running Android ARM64 build ==="
          echo "=== Build log: $PWD/android-arm64-build.log ==="

          bash -x tools/build-android-arm64.sh 2>&1 | tee android-arm64-build.log

          status=${PIPESTATUS[0]}

          echo "=== Android ARM64 build exit code: $status ==="

          exit "$status"

      - name: Upload Android ARM64 build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ycash-android-arm64-build-log
          path: android-arm64-build.log
          if-no-files-found: warn

      - name: Verify built ARM64 node
        shell: bash
        run: |
          set -euo pipefail

          NODE="target/${RUST_TARGET}/release/ycash-android-node"
          NATIVE="android-app/app/src/main/jniLibs/${ANDROID_ABI}/libycashandroidnode.so"

          test -f "$NODE"
          test -x "$NODE"

          test -f "$NATIVE"
          test -x "$NATIVE"

          file "$NODE"

          readelf -h "$NODE" | tee /tmp/node-elf.txt

          grep -q 'Class:[[:space:]]*ELF64' /tmp/node-elf.txt
          grep -q 'Machine:[[:space:]]*AArch64' /tmp/node-elf.txt
          grep -q 'Type:[[:space:]]*DYN' /tmp/node-elf.txt

          NODE_HASH="$(sha256sum "$NODE" | awk '{print $1}')"
          NATIVE_HASH="$(sha256sum "$NATIVE" | awk '{print $1}')"

          echo "Built node SHA-256:    $NODE_HASH"
          echo "Packaged node SHA-256: $NATIVE_HASH"

          test "$NODE_HASH" = "$NATIVE_HASH"

          echo "Native package is byte-for-byte identical to the Rust build."

      - name: Verify Android native package
        shell: bash
        run: |
          set -euo pipefail

          bash tools/verify-android-package.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        working-directory: android-app
        shell: bash
        run: |
          set -euo pipefail

          gradle --no-daemon --stacktrace assembleDebug

      - name: Locate debug APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          APK="android-app/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Verify debug APK native node
        shell: bash
        run: |
          set -euo pipefail

          APK="${{ steps.apk.outputs.apk }}"
          NODE="target/${RUST_TARGET}/release/ycash-android-node"
          EXTRACTED="/tmp/apk-node.so"

          unzip -l "$APK" | grep 'lib/arm64-v8a/libycashandroidnode.so'

          # Capture the complete ZIP listing before searching it.
          # This avoids grep -q SIGPIPE failures with pipefail.
          APK_LISTING="$(unzip -l "$APK")"

          if grep -Fq 'assets/ycash-android-node' <<< "$APK_LISTING"; then
            echo "ERROR: legacy executable asset found in APK." >&2
            exit 1
          fi

          unzip -p "$APK" \
            'lib/arm64-v8a/libycashandroidnode.so' > "$EXTRACTED"

          test -s "$EXTRACTED"

          file "$EXTRACTED"

          readelf -h "$EXTRACTED" | tee /tmp/apk-node-elf.txt

          grep -q 'Class:[[:space:]]*ELF64' /tmp/apk-node-elf.txt
          grep -q 'Machine:[[:space:]]*AArch64' /tmp/apk-node-elf.txt
          grep -q 'Type:[[:space:]]*DYN' /tmp/apk-node-elf.txt

          BUILT_HASH="$(sha256sum "$NODE" | awk '{print $1}')"
          APK_HASH="$(sha256sum "$EXTRACTED" | awk '{print $1}')"

          echo "Rust build SHA-256: $BUILT_HASH"
          echo "APK node SHA-256:   $APK_HASH"

          test "$BUILT_HASH" = "$APK_HASH"

          echo "Debug APK contains the exact Rust node binary."

      - name: Generate temporary CI signing key
        shell: bash
        run: |
          set -euo pipefail

          rm -f "$CI_KEYSTORE"

          keytool -genkeypair -v \
            -keystore "$CI_KEYSTORE" \
            -storepass "$CI_KEYSTORE_PASSWORD" \
            -keypass "$CI_KEY_PASSWORD" \
            -alias "$CI_KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=Ycash CI Debug, OU=Development, O=Ycash, L=CI, ST=CI, C=GB"

      - name: Zipalign APK
        shell: bash
        run: |
          set -euo pipefail

          INPUT="${{ steps.apk.outputs.apk }}"
          ALIGNED="android-app/app/build/outputs/apk/debug/ycash-android-node-aligned.apk"
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"

          "$ZIPALIGN" -f -p 4 "$INPUT" "$ALIGNED"

          "$ZIPALIGN" -c -p -v 4 "$ALIGNED"

          test -f "$ALIGNED"

      - name: Sign APK
        shell: bash
        run: |
          set -euo pipefail

          ALIGNED="android-app/app/build/outputs/apk/debug/ycash-android-node-aligned.apk"
          SIGNED="android-app/app/build/outputs/apk/debug/ycash-android-node-debug-signed.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          "$APKSIGNER" sign \
            --ks "$CI_KEYSTORE" \
            --ks-key-alias "$CI_KEY_ALIAS" \
            --ks-pass "pass:$CI_KEYSTORE_PASSWORD" \
            --key-pass "pass:$CI_KEY_PASSWORD" \
            --out "$SIGNED" \
            "$ALIGNED"

          test -f "$SIGNED"

      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail

          SIGNED="android-app/app/build/outputs/apk/debug/ycash-android-node-debug-signed.apk"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            "$SIGNED"

      - name: Final signed APK regression verification
        shell: bash
        run: |
          set -euo pipefail

          SIGNED="android-app/app/build/outputs/apk/debug/ycash-android-node-debug-signed.apk"
          NODE="target/${RUST_TARGET}/release/ycash-android-node"
          EXTRACTED="/tmp/final-signed-node.so"

          unzip -l "$SIGNED" | grep 'lib/arm64-v8a/libycashandroidnode.so'

          # Capture the complete listing before searching it.
          SIGNED_APK_LISTING="$(unzip -l "$SIGNED")"

          if grep -Fq 'assets/ycash-android-node' <<< "$SIGNED_APK_LISTING"; then
            echo "ERROR: legacy executable asset found in signed APK." >&2
            exit 1
          fi

          unzip -p "$SIGNED" \
            'lib/arm64-v8a/libycashandroidnode.so' > "$EXTRACTED"

          test -s "$EXTRACTED"

          file "$EXTRACTED"

          readelf -h "$EXTRACTED" | tee /tmp/final-node-elf.txt

          grep -q 'Class:[[:space:]]*ELF64' /tmp/final-node-elf.txt
          grep -q 'Machine:[[:space:]]*AArch64' /tmp/final-node-elf.txt
          grep -q 'Type:[[:space:]]*DYN' /tmp/final-node-elf.txt

          BUILT_HASH="$(sha256sum "$NODE" | awk '{print $1}')"
          FINAL_HASH="$(sha256sum "$EXTRACTED" | awk '{print $1}')"

          echo "Rust build SHA-256:       $BUILT_HASH"
          echo "Signed APK node SHA-256:  $FINAL_HASH"

          test "$BUILT_HASH" = "$FINAL_HASH"

          echo
          echo "=========================================="
          echo "FINAL SIGNED APK VERIFIED"
          echo "=========================================="
          echo "ABI:          arm64-v8a"
          echo "Node:         libycashandroidnode.so"
          echo "Signature:    verified"
          echo "Native hash:  $FINAL_HASH"
          echo "Legacy asset: absent"
          echo "=========================================="

      - name: Upload signed debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ycash-android-node-debug-signed
          path: android-app/app/build/outputs/apk/debug/ycash-android-node-debug-signed.apk
          if-no-files-found: error

      - name: Upload ARM64 node
        uses: actions/upload-artifact@v4
        with:
          name: ycash-android-node-arm64
          path: target/${{ env.RUST_TARGET }}/release/ycash-android-node
          if-no-files-found: error

      - name: Upload diagnostic source
        uses: actions/upload-artifact@v4
        with:
          name: ycash-android-diagnostic-source
          path: |
            android-app/app/src/main/java/com/ycash/androidnode/MainActivity.java
            android-app/app/src/main/java/com/ycash/androidnode/NodeService.java
            crates/ycash-android-node/src/main.rs
          if-no-files-found: error

      - name: Remove temporary signing key
        if: always()
        shell: bash
        run: |
          rm -f "$CI_KEYSTORE"
