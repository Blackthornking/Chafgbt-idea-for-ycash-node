name: Build, Sign and Verify Ycash Android Node

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  ANDROID_API: "35"
  ANDROID_NDK: "27.2.12479018"
  RUST_TARGET: "aarch64-linux-android"

  # Temporary CI signing.
  # A new debug keystore is generated for each workflow run.
  CI_KEYSTORE: "${{ github.workspace }}/ci-debug.keystore"
  CI_KEY_ALIAS: "ycash-debug"
  CI_KEYSTORE_PASSWORD: "ycash-debug-password"
  CI_KEY_PASSWORD: "ycash-debug-password"

jobs:
  build:
    name: Build, Align, Sign and Verify Ycash Android Node
    runs-on: ubuntu-24.04

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # 2. PREPARE PROJECT ROOT
      #
      # Supports either:
      #
      # A) Project already extracted at repository root:
      #
      #    Cargo.toml
      #    crates/
      #    android-app/
      #
      # OR
      #
      # B) Repository contains the project ZIP.
      #
      # The ZIP is extracted into the GitHub workspace.
      # =========================================================
      - name: Prepare project root
        shell: bash
        run: |
          set -e

          echo "Current repository:"
          pwd

          echo
          echo "Repository contents:"
          ls -la

          # -----------------------------------------------------
          # Already at root?
          # -----------------------------------------------------
          if [ -f "Cargo.toml" ]; then
            echo
            echo "Cargo.toml already exists at repository root."
            echo "Using existing project."

          else
            echo
            echo "Cargo.toml not found at root."
            echo "Searching for Ycash project ZIP..."

            ZIP=""

            # Preferred filename
            if [ -f "Ycash-Android-Node-Rust-FIXED-v0.12-GITHUB-ROOT.zip" ]; then
              ZIP="Ycash-Android-Node-Rust-FIXED-v0.12-GITHUB-ROOT.zip"
            fi

            # Previous filename
            if [ -z "$ZIP" ] && [ -f "Ycash-Android-Node-Rust-FIXED-v0.12.zip" ]; then
              ZIP="Ycash-Android-Node-Rust-FIXED-v0.12.zip"
            fi

            # Generic search
            if [ -z "$ZIP" ]; then
              ZIP="$(
                find . \
                  -maxdepth 3 \
                  -type f \
                  -iname '*ycash*android*node*.zip' \
                  | head -n 1 || true
              )"
            fi

            if [ -z "$ZIP" ]; then
              echo
              echo "ERROR: Could not find Cargo.toml."
              echo "ERROR: Could not find a Ycash Android Node ZIP."
              echo
              echo "Repository files:"
              find . -maxdepth 4 -type f | sort
              exit 1
            fi

            echo
            echo "Found:"
            echo "$ZIP"

            rm -rf .ycash-project
            mkdir -p .ycash-project

            echo
            echo "Extracting project..."
            unzip -q "$ZIP" -d .ycash-project

            # ---------------------------------------------------
            # Check if ZIP was already flattened.
            # ---------------------------------------------------
            if [ -f ".ycash-project/Cargo.toml" ]; then

              echo "ZIP contains project at its root."

              cp -a .ycash-project/. .

            else

              # -------------------------------------------------
              # Find nested Cargo.toml.
              # -------------------------------------------------
              NESTED_CARGO="$(
                find .ycash-project \
                  -type f \
                  -name Cargo.toml \
                  | head -n 1 || true
              )"

              if [ -z "$NESTED_CARGO" ]; then
                echo
                echo "ERROR: Extracted ZIP contains no Cargo.toml."
                echo
                echo "Extracted files:"
                find .ycash-project -maxdepth 6 -type f | sort
                exit 1
              fi

              PROJECT_ROOT="$(dirname "$NESTED_CARGO")"

              echo
              echo "Nested project detected:"
              echo "$PROJECT_ROOT"

              cp -a "$PROJECT_ROOT"/. .
            fi

            rm -rf .ycash-project
          fi

          # =====================================================
          # Verify project root
          # =====================================================

          echo
          echo "=========================================="
          echo "FINAL PROJECT ROOT"
          echo "=========================================="

          pwd

          echo
          echo "Root contents:"
          ls -la

          echo
          echo "Checking required files..."

          test -f Cargo.toml
          test -d crates
          test -d android-app

          echo
          echo "Cargo.toml:"
          ls -lh Cargo.toml

          echo
          echo "Project directories:"

          for dir in \
            crates \
            android-app \
            cpp \
            tests \
            tools \
            .github
          do
            if [ -d "$dir" ]; then
              echo "  OK: $dir/"
            else
              echo "  NOTE: $dir/ not present"
            fi
          done

          echo
          echo "Project root preparation complete."

      # =========================================================
      # 3. JAVA 17
      # =========================================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # =========================================================
      # 4. ANDROID SDK
      # =========================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      # =========================================================
      # 5. ANDROID PLATFORM + NDK
      # =========================================================
      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;35.0.0" \
            "ndk;${ANDROID_NDK}"

          echo
          echo "Android SDK installed."

      # =========================================================
      # 6. RUST
      # =========================================================
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.RUST_TARGET }}

      # =========================================================
      # 7. CONFIGURE ANDROID RUST LINKER
      # =========================================================
      - name: Configure Android Rust linker
        shell: bash
        run: |
          set -e

          NDK="$ANDROID_HOME/ndk/${ANDROID_NDK}"
          LLVM="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          echo "NDK:"
          echo "$NDK"

          echo
          echo "LLVM:"
          echo "$LLVM"

          test -x "$LLVM/aarch64-linux-android${ANDROID_API}-clang"
          test -x "$LLVM/llvm-ar"

          mkdir -p .cargo

          cat > .cargo/config.toml <<EOF
          [target.aarch64-linux-android]
          linker = "$LLVM/aarch64-linux-android${ANDROID_API}-clang"
          ar = "$LLVM/llvm-ar"
          EOF

          echo
          echo "Cargo Android linker configuration:"
          cat .cargo/config.toml

          # cc-rs (used by build scripts such as libsqlite3-sys's
          # "bundled" feature) does not read .cargo/config.toml's
          # `linker` key — it looks for CC_*/AR_* env vars instead.
          # Export the same compiler/archiver here so later cargo
          # build steps can find them.
          echo "CC_aarch64_linux_android=$LLVM/aarch64-linux-android${ANDROID_API}-clang" >> "$GITHUB_ENV"
          echo "CXX_aarch64_linux_android=$LLVM/aarch64-linux-android${ANDROID_API}-clang++" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$LLVM/llvm-ar" >> "$GITHUB_ENV"
          echo "RANLIB_aarch64_linux_android=$LLVM/llvm-ranlib" >> "$GITHUB_ENV"

      # =========================================================
      # 8. VERIFY RUST WORKSPACE
      # =========================================================
      - name: Verify Rust workspace
        shell: bash
        run: |
          set -e

          echo "Rust version:"
          rustc --version

          echo
          echo "Cargo version:"
          cargo --version

          echo
          echo "Checking Cargo workspace..."

          test -f Cargo.toml

          cargo metadata \
            --format-version 1 \
            --no-deps

          echo
          echo "Cargo workspace verified."

      # =========================================================
      # 9. CARGO CACHE
      # =========================================================
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ycash-${{ runner.os }}-${{ env.RUST_TARGET }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ycash-${{ runner.os }}-${{ env.RUST_TARGET }}-
            ycash-${{ runner.os }}-

      # =========================================================
      # 10. BUILD RUST ANDROID NODE
      # =========================================================
      - name: Build Ycash ARM64 Android node
        shell: bash
        run: |
          set -e

          cargo build \
            --release \
            --target "${RUST_TARGET}" \
            -p ycash-android-node

      # =========================================================
      # 11. VERIFY ARM64 NODE
      # =========================================================
      - name: Verify ARM64 node binary
        shell: bash
        run: |
          set -e

          NODE="target/${RUST_TARGET}/release/ycash-android-node"

          test -f "$NODE"
          test -x "$NODE"

          echo "Node binary:"
          ls -lh "$NODE"

          echo
          echo "File type:"
          file "$NODE"

          echo
          echo "ELF information:"
          readelf -h "$NODE" | grep -E \
            "Class:|Machine:|Type:"

          echo
          echo "Native dependencies:"
          readelf -d "$NODE" | grep NEEDED || true

      # =========================================================
      # 12. BUNDLE EXACT RUST NODE INTO APK ASSETS
      #
      # The Rust node ships as a standalone ELF executable that
      # NodeService.java copies out of assets and launches with
      # ProcessBuilder — it is not a JNI shared library, so it is
      # never placed under jniLibs/ and never produces a
      # lib/<abi>/*.so entry in the APK.
      # =========================================================
      - name: Bundle Rust node into Android app
        shell: bash
        run: |
          set -e

          NODE="target/${RUST_TARGET}/release/ycash-android-node"
          ASSETS="android-app/app/src/main/assets"

          mkdir -p "$ASSETS"

          rm -f "$ASSETS/ycash-android-node"

          cp "$NODE" "$ASSETS/ycash-android-node"

          chmod 755 "$ASSETS/ycash-android-node"

          test -f "$ASSETS/ycash-android-node"

          echo "Bundled node:"
          ls -lh "$ASSETS/ycash-android-node"

      # =========================================================
      # 13. VERIFY ANDROID PROJECT
      # =========================================================
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          test -f android-app/settings.gradle
          test -f android-app/app/build.gradle
          test -f android-app/app/src/main/AndroidManifest.xml
          test -f android-app/app/src/main/assets/ycash-android-node

          echo "Android project verified."

      # =========================================================
      # 14. GRADLE
      # =========================================================
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # =========================================================
      # 15. BUILD APK
      #
      # IMPORTANT:
      #
      # Gradle/AGP is the ONLY APK packager.
      #
      # We do NOT:
      #
      # unzip APK
      # modify APK
      # zip APK again
      # =========================================================
      - name: Build Android APK with Gradle
        working-directory: android-app
        shell: bash
        run: |
          set -e

          gradle \
            --no-daemon \
            --stacktrace \
            assembleDebug

      # =========================================================
      # 16. LOCATE GRADLE APK
      # =========================================================
      - name: Locate Gradle APK
        id: locate_apk
        shell: bash
        run: |
          set -e

          APK="android-app/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"

          echo "Gradle APK:"
          ls -lh "$APK"

      # =========================================================
      # 17. VERIFY BUNDLED RUST NODE BEFORE ALIGNMENT
      #
      # This app has no JNI shared library — the Rust node is a
      # standalone executable shipped as an asset and launched
      # via ProcessBuilder (see NodeService.java). There is no
      # lib/arm64-v8a/libycashd.so and no libc++_shared.so to
      # check for; asserting on them made this step fail even
      # though the APK was built correctly.
      # =========================================================
      - name: Verify native libraries in Gradle APK
        shell: bash
        run: |
          set -e

          APK="${{ steps.locate_apk.outputs.apk }}"

          echo "Checking bundled Rust node..."

          unzip -l "$APK" | grep \
            "assets/ycash-android-node"

          echo
          echo "Required bundled files are present."

      # =========================================================
      # 18. GENERATE TEMPORARY DEBUG KEY
      # =========================================================
      - name: Generate temporary debug signing key
        shell: bash
        run: |
          set -e

          rm -f "$CI_KEYSTORE"

          keytool \
            -genkeypair \
            -v \
            -keystore "$CI_KEYSTORE" \
            -storepass "$CI_KEYSTORE_PASSWORD" \
            -keypass "$CI_KEY_PASSWORD" \
            -alias "$CI_KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname \
              "CN=Ycash CI Debug, OU=Development, O=Ycash, L=CI, ST=CI, C=GB"

          test -f "$CI_KEYSTORE"

          echo
          echo "Temporary CI signing key generated."

      # =========================================================
      # 19. ZIPALIGN
      #
      # Operates directly on the complete Gradle APK.
      # No manual APK reconstruction.
      # =========================================================
      - name: Zipalign APK
        shell: bash
        run: |
          set -e

          INPUT="android-app/app/build/outputs/apk/debug/app-debug.apk"
          ALIGNED="android-app/app/build/outputs/apk/debug/ycash-android-node-aligned.apk"

          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"

          test -x "$ZIPALIGN"
          test -f "$INPUT"

          rm -f "$ALIGNED"

          "$ZIPALIGN" \
            -f \
            -p \
            4 \
            "$INPUT" \
            "$ALIGNED"

          test -f "$ALIGNED"

          echo "Aligned APK:"
          ls -lh "$ALIGNED"

      # =========================================================
      # 20. VERIFY ZIPALIGN
      #
      # Check mode requires the same mandatory <align> positional
      # argument as the align step above (4), passed via -p/align
      # rather than -P <pagesize_kb>. The previous invocation
      # used "-P 4" and never supplied <align> at all, so
      # zipalign couldn't parse its arguments and exited with the
      # usage banner (exit code 2) instead of actually checking
      # anything.
      # =========================================================
      - name: Verify zip alignment
        shell: bash
        run: |
          set -e

          ALIGNED="android-app/app/build/outputs/apk/debug/ycash-android-node-aligned.apk"

          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"

          "$ZIPALIGN" \
            -c \
            -p \
            -v \
            4 \
            "$ALIGNED"

      # =========================================================
      # 21. SIGN ALIGNED APK
      # =========================================================
      - name: Sign aligned APK
        shell: bash
        run: |
          set -e

          ALIGNED="android-app/app/build/outputs/apk/debug/ycash-android-node-aligned.apk"

          SIGNED="android-app/app/build/outputs/apk/debug/ycash-android-node-debug-signed.apk"

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          test -x "$APKSIGNER"
          test -f "$ALIGNED"

          rm -f "$SIGNED"

          "$APKSIGNER" sign \
            --ks "$CI_KEYSTORE" \
            --ks-key-alias "$CI_KEY_ALIAS" \
            --ks-pass "pass:$CI_KEYSTORE_PASSWORD" \
            --key-pass "pass:$CI_KEY_PASSWORD" \
            --out "$SIGNED" \
            "$ALIGNED"

          test -f "$SIGNED"

          echo
          echo "Signed APK:"
          ls -lh "$SIGNED"

      # =========================================================
      # 22. VERIFY APK SIGNATURE
      # =========================================================
      - name: Verify APK signature
        shell: bash
        run: |
          set -e

          SIGNED="android-app/app/build/outputs/apk/debug/ycash-android-node-debug-signed.apk"

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          "$APKSIGNER" verify \
            --verbose \
            "$SIGNED"

          echo
          echo "APK signature verification passed."

      # =========================================================
      # 23. VERIFY FINAL APK CONTENTS
      #
      # Same correction as step 17: no JNI shared library exists
      # in this app, so only the bundled asset is checked.
      # =========================================================
      - name: Verify final signed APK contents
        shell: bash
        run: |
          set -e

          SIGNED="android-app/app/build/outputs/apk/debug/ycash-android-node-debug-signed.apk"

          echo "Checking final APK..."

          echo
          echo "Rust node:"
          unzip -l "$SIGNED" | grep \
            "assets/ycash-android-node"

          echo
          echo "Final APK contents verified."

      # =========================================================
      # 24. FINAL APK INFORMATION
      # =========================================================
      - name: Display final APK information
        shell: bash
        run: |
          set -e

          SIGNED="android-app/app/build/outputs/apk/debug/ycash-android-node-debug-signed.apk"

          echo "=========================================="
          echo "FINAL APK"
          echo "=========================================="

          ls -lh "$SIGNED"

          echo
          echo "SHA-256:"
          sha256sum "$SIGNED"

      # =========================================================
      # 25. UPLOAD SIGNED APK
      # =========================================================
      - name: Upload signed debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ycash-android-node-debug-signed
          path: android-app/app/build/outputs/apk/debug/ycash-android-node-debug-signed.apk
          if-no-files-found: error

      # =========================================================
      # 26. UPLOAD RAW ARM64 NODE
      # =========================================================
      - name: Upload ARM64 node
        uses: actions/upload-artifact@v4
        with:
          name: ycash-android-node-arm64
          path: target/${{ env.RUST_TARGET }}/release/ycash-android-node
          if-no-files-found: error

      # =========================================================
      # 27. CLEAN TEMPORARY SIGNING KEY
      # =========================================================
      - name: Remove temporary signing key
        if: always()
        shell: bash
        run: |
          rm -f "$CI_KEYSTORE"

          echo "Temporary signing key removed."
