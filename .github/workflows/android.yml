name: Build Yortal Wallet

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.35.2"
  ANDROID_API: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"
  ANDROID_NDK: "27.2.12479018"

  CI_KEY_ALIAS: "yortal-ci"
  CI_KEYSTORE_PASSWORD: "temporary123"
  CI_KEY_PASSWORD: "temporary123"

jobs:
  build:
    name: Build Yortal Wallet Android
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. JAVA 17
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 3. FLUTTER
      # ============================================================
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # ============================================================
      # 4. ANDROID SDK
      # ============================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager "platform-tools"
          sdkmanager "platforms;android-${ANDROID_API}"
          sdkmanager "build-tools;${ANDROID_BUILD_TOOLS}"
          sdkmanager "ndk;${ANDROID_NDK}"

          yes | sdkmanager --licenses >/dev/null || true

      # ============================================================
      # 5. RUST
      # ============================================================
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-linux-android
            armv7-linux-androideabi
            x86_64-linux-android

      # ============================================================
      # 6. CARGO NDK
      # ============================================================
      - name: Install cargo-ndk
        shell: bash
        run: |
          set -euo pipefail

          cargo install cargo-ndk --locked

          cargo ndk --version

      # ============================================================
      # 7. NATIVE BUILD DEPENDENCIES
      # ============================================================
      - name: Install native build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            protobuf-compiler \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libssl-dev \
            build-essential \
            unzip \
            curl

          protoc --version
          clang --version
          cmake --version

      # ============================================================
      # 8. FLUTTER DEPENDENCIES
      # ============================================================
      - name: Flutter pub get
        shell: bash
        run: |
          set -euo pipefail

          flutter pub get

      # ============================================================
      # 9. DOWNLOAD YCAST SAPLING PARAMETERS
      #
      # USER-SUPPLIED / CORRECTED MAPPING
      #
      # Spend:
      # 1T02YAgRo3Rx6ksXphGuDKadkV5K49RW2
      #
      # Output:
      # 1OfbiqE2uzdJqxFfC8s8h0l_s4KT8_Io6
      #
      # These are downloaded at build time and are not committed
      # into the repository.
      # ============================================================
      - name: Download Ycash Sapling parameters
        shell: bash
        run: |
          set -euo pipefail

          PARAM_DIR="packages/ycash_core_ffi/rust/vendor/yecshell-lib/zcash-params"

          mkdir -p "$PARAM_DIR"

          SPEND_ID="1T02YAgRo3Rx6ksXphGuDKadkV5K49RW2"
          OUTPUT_ID="1OfbiqE2uzdJqxFfC8s8h0l_s4KT8_Io6"

          SPEND_URL="https://drive.google.com/uc?export=download&id=${SPEND_ID}"
          OUTPUT_URL="https://drive.google.com/uc?export=download&id=${OUTPUT_ID}"

          echo "=========================================="
          echo "Downloading Sapling spend parameters"
          echo "=========================================="

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 3 \
            --silent \
            --show-error \
            "$SPEND_URL" \
            --output "$PARAM_DIR/sapling-spend.params"

          echo "=========================================="
          echo "Downloading Sapling output parameters"
          echo "=========================================="

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 3 \
            --silent \
            --show-error \
            "$OUTPUT_URL" \
            --output "$PARAM_DIR/sapling-output.params"

          echo "=========================================="
          echo "Checking parameter files"
          echo "=========================================="

          test -s "$PARAM_DIR/sapling-spend.params"
          test -s "$PARAM_DIR/sapling-output.params"

          echo "Spend parameter:"
          ls -lh "$PARAM_DIR/sapling-spend.params"

          echo "Output parameter:"
          ls -lh "$PARAM_DIR/sapling-output.params"

      # ============================================================
      # 10. VERIFY SAPLING PARAMETERS
      # ============================================================
      - name: Verify Ycash Sapling parameters
        shell: bash
        run: |
          set -euo pipefail

          PARAM_DIR="packages/ycash_core_ffi/rust/vendor/yecshell-lib/zcash-params"

          SPEND="$PARAM_DIR/sapling-spend.params"
          OUTPUT="$PARAM_DIR/sapling-output.params"

          test -f "$SPEND"
          test -f "$OUTPUT"

          test -s "$SPEND"
          test -s "$OUTPUT"

          SPEND_SIZE="$(stat -c%s "$SPEND")"
          OUTPUT_SIZE="$(stat -c%s "$OUTPUT")"

          echo "Sapling spend parameter size: ${SPEND_SIZE} bytes"
          echo "Sapling output parameter size: ${OUTPUT_SIZE} bytes"

          if [ "$SPEND_SIZE" -lt 1000000 ]; then
            echo "::error::Sapling spend parameter appears too small."
            exit 1
          fi

          if [ "$OUTPUT_SIZE" -lt 1000000 ]; then
            echo "::error::Sapling output parameter appears too small."
            exit 1
          fi

          echo "Sapling parameter files passed basic validation."

      # ============================================================
      # 11. RUST CORE TESTS
      # ============================================================
      - name: Test Ycash Rust core
        working-directory: packages/ycash_core_ffi/rust
        shell: bash
        run: |
          set -euo pipefail

          cargo test --all-targets

      # ============================================================
      # 12. FLUTTER TESTS
      # ============================================================
      - name: Run Flutter tests
        shell: bash
        run: |
          set -euo pipefail

          flutter test

      # ============================================================
      # 13. VERIFY ANDROID PROJECT
      # ============================================================
      - name: Inspect Android project
        shell: bash
        run: |
          set -euo pipefail

          test -d android
          test -f android/settings.gradle
          test -f android/app/build.gradle

          echo "Android project detected."

      # ============================================================
      # 14. BUILD NATIVE CORE - ARM64
      # ============================================================
      - name: Build Ycash native core ARM64
        working-directory: packages/ycash_core_ffi/rust
        shell: bash
        run: |
          set -euo pipefail

          cargo ndk \
            -t arm64-v8a \
            -o ../../../../android/app/src/main/jniLibs \
            build --release

      # ============================================================
      # 15. BUILD NATIVE CORE - ARMv7
      # ============================================================
      - name: Build Ycash native core ARMv7
        working-directory: packages/ycash_core_ffi/rust
        shell: bash
        run: |
          set -euo pipefail

          cargo ndk \
            -t armeabi-v7a \
            -o ../../../../android/app/src/main/jniLibs \
            build --release

      # ============================================================
      # 16. BUILD NATIVE CORE - x86_64
      # ============================================================
      - name: Build Ycash native core x86_64
        working-directory: packages/ycash_core_ffi/rust
        shell: bash
        run: |
          set -euo pipefail

          cargo ndk \
            -t x86_64 \
            -o ../../../../android/app/src/main/jniLibs \
            build --release

      # ============================================================
      # 17. VERIFY NATIVE LIBRARIES
      # ============================================================
      - name: Verify native libraries
        shell: bash
        run: |
          set -euo pipefail

          JNI_DIR="android/app/src/main/jniLibs"

          echo "===== Native libraries ====="

          find "$JNI_DIR" \
            -type f \
            -name '*.so' \
            -print \
            | sort

          test -f "$JNI_DIR/arm64-v8a/libycash_core.so"
          test -f "$JNI_DIR/armeabi-v7a/libycash_core.so"
          test -f "$JNI_DIR/x86_64/libycash_core.so"

          file \
            "$JNI_DIR/arm64-v8a/libycash_core.so" \
            "$JNI_DIR/armeabi-v7a/libycash_core.so" \
            "$JNI_DIR/x86_64/libycash_core.so"

      # ============================================================
      # 18. PREPARE GRADLE
      # ============================================================
      - name: Prepare Gradle
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f gradlew ]; then
            echo "::error::Gradle wrapper is missing."
            exit 1
          fi

          chmod +x gradlew

          ./gradlew --version

      # ============================================================
      # 19. BUILD RELEASE APK
      # ============================================================
      - name: Build release APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleRelease

          echo "===== Release APKs ====="

          find "$PWD/app/build/outputs/apk" \
            -type f \
            -name '*.apk' \
            -print

      # ============================================================
      # 20. LOCATE APK AS ABSOLUTE PATH
      # ============================================================
      - name: Locate release APK
        id: apk
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find "$PWD/app/build/outputs/apk" \
              -type f \
              -name '*.apk' \
              -print -quit
          )"

          if [ -z "$APK" ]; then
            echo "::error::No release APK was produced."

            find "$PWD/app/build" \
              -type f \
              | sort \
              | head -300

            exit 1
          fi

          APK="$(realpath "$APK")"

          echo "APK=$APK"

          test -f "$APK"

          file "$APK"
          ls -lh "$APK"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 21. GENERATE TEMPORARY SIGNING KEY
      # ============================================================
      - name: Generate temporary signing key
        shell: bash
        run: |
          set -euo pipefail

          KEYSTORE="$RUNNER_TEMP/yortal-ci.keystore"

          rm -f "$KEYSTORE"

          keytool \
            -genkeypair \
            -v \
            -keystore "$KEYSTORE" \
            -storetype JKS \
            -storepass "$CI_KEYSTORE_PASSWORD" \
            -keypass "$CI_KEY_PASSWORD" \
            -alias "$CI_KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -dname "CN=Yortal Wallet CI, OU=Development, O=Yortal, L=Local, ST=Local, C=GB"

          chmod 600 "$KEYSTORE"

          echo "KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"

      # ============================================================
      # 22. ZIPALIGN
      # ============================================================
      - name: Zipalign APK
        id: aligned
        shell: bash
        run: |
          set -euo pipefail

          INPUT="${{ steps.apk.outputs.apk }}"

          ZIPALIGN="$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/zipalign"

          OUTPUT="$RUNNER_TEMP/Yortal-Wallet-aligned.apk"

          test -f "$INPUT"
          test -x "$ZIPALIGN"

          rm -f "$OUTPUT"

          "$ZIPALIGN" \
            -f \
            -p \
            4 \
            "$INPUT" \
            "$OUTPUT"

          test -f "$OUTPUT"

          echo "Aligned APK:"
          ls -lh "$OUTPUT"

          echo "apk=$OUTPUT" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 23. SIGN FINAL APK
      # ============================================================
      - name: Sign release APK
        id: signed
        shell: bash
        run: |
          set -euo pipefail

          INPUT="${{ steps.aligned.outputs.apk }}"

          APKSIGNER="$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"

          OUTPUT="$RUNNER_TEMP/Yortal-Wallet-SIGNED.apk"

          test -f "$INPUT"
          test -x "$APKSIGNER"
          test -f "$KEYSTORE"

          rm -f "$OUTPUT"

          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-type JKS \
            --ks-pass "pass:$CI_KEYSTORE_PASSWORD" \
            --key-pass "pass:$CI_KEY_PASSWORD" \
            --ks-key-alias "$CI_KEY_ALIAS" \
            --out "$OUTPUT" \
            "$INPUT"

          test -f "$OUTPUT"

          echo "Signed APK:"
          ls -lh "$OUTPUT"

          echo "apk=$OUTPUT" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 24. VERIFY APK SIGNATURE
      # ============================================================
      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          APK="${{ steps.signed.outputs.apk }}"

          APKSIGNER="$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"

          test -f "$APK"

          "$APKSIGNER" verify \
            --verbose \
            "$APK"

          echo "APK signature verified."

      # ============================================================
      # 25. VERIFY APK ALIGNMENT
      # ============================================================
      - name: Verify APK alignment
        shell: bash
        run: |
          set -euo pipefail

          APK="${{ steps.signed.outputs.apk }}"

          ZIPALIGN="$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/zipalign"

          test -f "$APK"

          "$ZIPALIGN" \
            -c \
            -P 4 \
            "$APK"

          echo "APK alignment verified."

      # ============================================================
      # 26. VERIFY NATIVE LIBRARIES INSIDE APK
      # ============================================================
      - name: Verify native core inside APK
        shell: bash
        run: |
          set -euo pipefail

          APK="${{ steps.signed.outputs.apk }}"

          echo "===== APK native libraries ====="

          unzip -l "$APK" \
            | grep 'lib/.*libycash_core.so'

          unzip -l "$APK" \
            | grep 'lib/arm64-v8a/libycash_core.so'

      # ============================================================
      # 27. COPY FINAL APK TO WORKSPACE
      # ============================================================
      - name: Prepare final APK artifact
        shell: bash
        run: |
          set -euo pipefail

          INPUT="${{ steps.signed.outputs.apk }}"

          OUTPUT="$GITHUB_WORKSPACE/Yortal-Wallet-Android-SIGNED.apk"

          test -f "$INPUT"

          rm -f "$OUTPUT"

          cp "$INPUT" "$OUTPUT"

          test -f "$OUTPUT"

          echo "Final APK:"
          ls -lh "$OUTPUT"

      # ============================================================
      # 28. BUILD INFORMATION
      # ============================================================
      - name: Create build information
        shell: bash
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/yortal-build-info.txt" <<EOF
          Yortal Wallet Android Build
          ===========================

          Flutter:
          ${FLUTTER_VERSION}

          Android API:
          ${ANDROID_API}

          Android Build Tools:
          ${ANDROID_BUILD_TOOLS}

          Android NDK:
          ${ANDROID_NDK}

          Native targets:
          ARM64
          ARMv7
          x86_64

          Native core:
          libycash_core.so

          Sapling parameters:
          Spend parameter: 1T02YAgRo3Rx6ksXphGuDKadkV5K49RW2
          Output parameter: 1OfbiqE2uzdJqxFfC8s8h0l_s4KT8_Io6

          Build:
          Release

          APK:
          Yortal-Wallet-Android-SIGNED.apk

          Signing:
          Temporary CI development key

          Permanent production signing:
          NOT USED

          Ycashd:
          NOT embedded in this wallet build.

          Wallet/node architecture:
          Separate development components.

          APK signature:
          Verified

          APK alignment:
          Verified
          EOF

          cat "$RUNNER_TEMP/yortal-build-info.txt"

      # ============================================================
      # 29. UPLOAD APK
      # ============================================================
      - name: Upload Yortal Wallet APK
        uses: actions/upload-artifact@v4
        with:
          name: Yortal-Wallet-Android-SIGNED
          path: ${{ github.workspace }}/Yortal-Wallet-Android-SIGNED.apk
          if-no-files-found: error

      # ============================================================
      # 30. UPLOAD NATIVE LIBRARIES
      # ============================================================
      - name: Upload native Ycash libraries
        uses: actions/upload-artifact@v4
        with:
          name: Yortal-Wallet-Native-Libraries
          path: android/app/src/main/jniLibs/**/*.so
          if-no-files-found: error

      # ============================================================
      # 31. UPLOAD BUILD INFORMATION
      # ============================================================
      - name: Upload build information
        uses: actions/upload-artifact@v4
        with:
          name: Yortal-Wallet-Build-Information
          path: ${{ runner.temp }}/yortal-build-info.txt
          if-no-files-found: error
