name: Build, Sign and Verify Ycash Android Node

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  ANDROID_API: "35"
  ANDROID_NDK: "27.2.12479018"
  RUST_TARGET: "aarch64-linux-android"
  ANDROID_ABI: "arm64-v8a"

  KEYSTORE_FILE: "ci-debug.keystore"
  KEY_ALIAS: "ycash-ci"
  KEYSTORE_PASSWORD: "ycash-ci-password"
  KEY_PASSWORD: "ycash-ci-password"

jobs:
  build-android-node:
    name: Build Ycash Android ARM64 Node
    runs-on: ubuntu-24.04

    steps:
      # ------------------------------------------------------------
      # 1. CHECKOUT
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v5

      # ------------------------------------------------------------
      # 2. PREPARE PROJECT ROOT
      # ------------------------------------------------------------
      - name: Prepare project root
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Preparing project root"
          echo "============================================================"

          if [[ -f Cargo.toml && -d crates && -d android-app ]]; then
            echo "Project root already contains Cargo.toml, crates/, and android-app/."
          else
            echo "Project root does not contain the expected project structure."

            ZIP_FILE="$(find . -maxdepth 2 -type f \( -name '*.zip' -o -name '*.ZIP' \) | head -n 1 || true)"

            if [[ -z "$ZIP_FILE" ]]; then
              echo "ERROR: No project ZIP found." >&2
              exit 1
            fi

            echo "Using project archive: $ZIP_FILE"

            mkdir -p _project_extract
            unzip -q "$ZIP_FILE" -d _project_extract

            PROJECT_ROOT="$(
              find _project_extract -type f -name Cargo.toml -print0 |
                while IFS= read -r -d '' file; do
                  dir="$(dirname "$file")"
                  if [[ -d "$dir/crates" && -d "$dir/android-app" ]]; then
                    echo "$dir"
                    break
                  fi
                done
            )"

            if [[ -z "$PROJECT_ROOT" ]]; then
              echo "ERROR: Could not locate Ycash project root inside archive." >&2
              exit 1
            fi

            echo "Located project root: $PROJECT_ROOT"

            shopt -s dotglob
            cp -a "$PROJECT_ROOT"/. .
            shopt -u dotglob
          fi

          test -f Cargo.toml
          test -d crates
          test -d android-app

          echo "Project root prepared successfully."

      # ------------------------------------------------------------
      # 2B. RESTORE SHELL SCRIPT EXECUTABLE PERMISSIONS
      # ------------------------------------------------------------
      - name: Restore shell script executable permissions
        shell: bash
        run: |
          set -euo pipefail

          find . -type f -name '*.sh' -exec chmod +x {} \;

          echo "Shell script permissions restored."

      # ------------------------------------------------------------
      # 3. VERIFY PROJECT STRUCTURE
      # ------------------------------------------------------------
      - name: Verify project structure
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Verifying project structure"
          echo "============================================================"

          test -f Cargo.toml
          test -d crates
          test -d android-app

          echo
          echo "Cargo workspace:"
          grep -n '^\[workspace\]' Cargo.toml || true

          echo
          echo "Crates:"
          find crates -maxdepth 2 -name Cargo.toml -print | sort

          echo
          echo "Android application:"
          find android-app -maxdepth 2 -type f | sort | head -n 100

          echo
          echo "Project structure verified."

      # ------------------------------------------------------------
      # 4. JAVA 17
      # ------------------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java
        shell: bash
        run: |
          set -euo pipefail

          java -version
          javac -version

      # ------------------------------------------------------------
      # 5. ANDROID SDK / NDK
      # ------------------------------------------------------------
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"

          sdkmanager --version

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;35.0.0" \
            "ndk;${ANDROID_NDK}"

          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail

      - name: Verify Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Verifying Android SDK"
          echo "============================================================"

          sdkmanager --version

          test -d "${ANDROID_HOME}/platform-tools"
          test -d "${ANDROID_HOME}/platforms/android-${ANDROID_API}"
          test -d "${ANDROID_HOME}/build-tools/35.0.0"
          test -d "${ANDROID_HOME}/ndk/${ANDROID_NDK}"

          test -x "${ANDROID_HOME}/platform-tools/adb"
          test -x "${ANDROID_HOME}/build-tools/35.0.0/apksigner"
          test -x "${ANDROID_HOME}/build-tools/35.0.0/zipalign"

          test -x \
            "${ANDROID_HOME}/ndk/${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang"

          echo
          echo "Android SDK verified."
          echo "API:         ${ANDROID_API}"
          echo "Build tools: 35.0.0"
          echo "NDK:         ${ANDROID_NDK}"
          echo "ABI:         ${ANDROID_ABI}"

      # ------------------------------------------------------------
      # 6. RUST
      # ------------------------------------------------------------
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.RUST_TARGET }}

      # ------------------------------------------------------------
      # 7. VERIFY RUST TARGET
      # ------------------------------------------------------------
      - name: Verify Rust target
        shell: bash
        run: |
          set -euo pipefail

          rustc --version
          cargo --version

          echo
          echo "Installed Rust targets:"
          rustup target list --installed

          rustup target list --installed | grep -Fx "${RUST_TARGET}"

          echo
          echo "Rust target ${RUST_TARGET} verified."

      # ------------------------------------------------------------
      # 8. VERIFY TEST FIXTURES
      # ------------------------------------------------------------
      - name: Verify test fixtures
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Checking test fixtures"
          echo "============================================================"

          if [[ -d tests ]]; then
            find tests -maxdepth 3 -type f | sort | head -n 200
          fi

          if [[ -d crates ]]; then
            find crates -type f \
              \( -name '*.json' -o -name '*.dat' -o -name '*.bin' -o -name '*.fixture' \) \
              | sort | head -n 200
          fi

          echo
          echo "Test fixture verification complete."

      # ------------------------------------------------------------
      # 8B. VERIFY PARALLEL 4-WORKER PIPELINE CONFIGURATION
      # ------------------------------------------------------------
      - name: Verify parallel 4-worker pipeline configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Verifying parallel 4-worker pipeline configuration"
          echo "============================================================"

          PIPELINE_CONFIG="config/pipeline.toml"
          ADAPTIVE_SOURCE="crates/state/src/pipeline/adaptive.rs"
          PIPELINE_SOURCE="crates/state/src/pipeline/mod.rs"

          test -f "$PIPELINE_CONFIG"
          test -f "$ADAPTIVE_SOURCE"
          test -f "$PIPELINE_SOURCE"

          echo
          echo "Pipeline configuration:"
          cat "$PIPELINE_CONFIG"

          echo
          echo "============================================================"
          echo "Checking worker configuration"
          echo "============================================================"

          WORKERS="$(
            sed -nE \
              's/^[[:space:]]*max_validation_workers[[:space:]]*=[[:space:]]*([0-9]+)[[:space:]]*$/\1/p' \
              "$PIPELINE_CONFIG"
          )"

          INFLIGHT="$(
            sed -nE \
              's/^[[:space:]]*max_inflight_ranges[[:space:]]*=[[:space:]]*([0-9]+)[[:space:]]*$/\1/p' \
              "$PIPELINE_CONFIG"
          )"

          echo "Validation workers: $WORKERS"
          echo "In-flight ranges:   $INFLIGHT"

          [[ "$WORKERS" == "4" ]] || {
            echo "ERROR: Expected exactly 4 validation workers, got '$WORKERS'." >&2
            exit 1
          }

          [[ "$INFLIGHT" == "4" ]] || {
            echo "ERROR: Expected exactly 4 in-flight ranges, got '$INFLIGHT'." >&2
            exit 1
          }

          echo "4 validation workers verified."
          echo "4 in-flight ranges verified."

          echo
          echo "============================================================"
          echo "Checking range length"
          echo "============================================================"

          grep -Eq \
            'const MAX_RANGE_LEN:[[:space:]]*u64[[:space:]]*=[[:space:]]*16[[:space:]]*;' \
            "$PIPELINE_SOURCE"

          echo "MAX_RANGE_LEN = 16 verified."

          echo
          echo "============================================================"
          echo "Checking adaptive window"
          echo "============================================================"

          grep -Eq 'min_window:[[:space:]]*16' "$ADAPTIVE_SOURCE"
          grep -Eq 'initial_window:[[:space:]]*16' "$ADAPTIVE_SOURCE"
          grep -Eq 'max_window:[[:space:]]*16' "$ADAPTIVE_SOURCE"

          echo "Adaptive window limits verified at 16."

          echo
          echo "============================================================"
          echo "Checking ordered commit configuration"
          echo "============================================================"

          grep -Eq \
            '^[[:space:]]*ordered_state_commit[[:space:]]*=[[:space:]]*true[[:space:]]*$' \
            "$PIPELINE_CONFIG"

          grep -Eq \
            '^[[:space:]]*bounded_commit_buffer[[:space:]]*=[[:space:]]*true[[:space:]]*$' \
            "$PIPELINE_CONFIG"

          echo "Ordered state commit enabled."
          echo "Bounded commit buffer enabled."

          echo
          echo "============================================================"
          echo "Checking ordered commit implementation"
          echo "============================================================"

          if grep -RniE \
            'ordered.*commit|commit.*ordered|next_expected|next.*height' \
            crates/state/src/pipeline \
            >/tmp/ordered-commit-check.txt 2>/dev/null; then

            cat /tmp/ordered-commit-check.txt

            echo
            echo "Ordered commit implementation detected."
          else
            echo "ERROR: Could not detect ordered commit implementation." >&2
            exit 1
          fi

          echo
          echo "============================================================"
          echo "Checking for stale sequential configuration"
          echo "============================================================"

          if grep -Eq \
            '^[[:space:]]*max_validation_workers[[:space:]]*=[[:space:]]*1[[:space:]]*$' \
            "$PIPELINE_CONFIG"; then
            echo "ERROR: max_validation_workers is still 1." >&2
            exit 1
          fi

          if grep -Eq \
            '^[[:space:]]*max_inflight_ranges[[:space:]]*=[[:space:]]*1[[:space:]]*$' \
            "$PIPELINE_CONFIG"; then
            echo "ERROR: max_inflight_ranges is still 1." >&2
            exit 1
          fi

          echo "No stale single-worker configuration found."

          echo
          echo "============================================================"
          echo "PARALLEL PIPELINE CONFIGURATION VERIFIED"
          echo "============================================================"

          echo
          echo "Batch size:             16 blocks"
          echo "Maximum window:         16 blocks"
          echo "In-flight ranges:       4"
          echo "Validation workers:     4"
          echo "Ordered state commit:  ENABLED"
          echo "Bounded commit buffer:  ENABLED"
          echo
          echo "Expected execution:"
          echo "  Fetch multiple ranges"
          echo "        ↓"
          echo "  Validate concurrently with 4 workers"
          echo "        ↓"
          echo "  Buffer completed ranges"
          echo "        ↓"
          echo "  Commit strictly by height"

      # ------------------------------------------------------------
      # 9. RUST WORKSPACE REGRESSION TESTS
      # ------------------------------------------------------------
      - name: Run Rust workspace regression tests
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Running Rust workspace tests"
          echo "============================================================"

          cargo test --workspace --all-targets

      # ------------------------------------------------------------
      # 10. SQLITE SCHEMA ORDERING CHECK
      # ------------------------------------------------------------
      - name: Verify SQLite schema ordering
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Checking SQLite schema ordering"
          echo "============================================================"

          SCHEMA_FILES="$(
            find . -type f \
              \( -name '*.sql' -o -name '*schema*.rs' -o -name '*.rs' \) \
              -print
          )"

          if [[ -z "$SCHEMA_FILES" ]]; then
            echo "No schema files discovered."
            exit 0
          fi

          echo "Schema-related files:"
          printf '%s\n' "$SCHEMA_FILES"

          echo
          echo "SQLite schema ordering check complete."

      # ------------------------------------------------------------
      # 11. ANDROID ARM64 LINKER CONFIGURATION
      # ------------------------------------------------------------
      - name: Configure Android ARM64 linker
        shell: bash
        run: |
          set -euo pipefail

          NDK_ROOT="${ANDROID_NDK_HOME:-${ANDROID_HOME}/ndk/${ANDROID_NDK}}"

          if [[ ! -d "$NDK_ROOT" ]]; then
            echo "ERROR: Android NDK not found at $NDK_ROOT" >&2
            exit 1
          fi

          TOOLCHAIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64"

          if [[ ! -d "$TOOLCHAIN" ]]; then
            echo "ERROR: Android LLVM toolchain not found at $TOOLCHAIN" >&2
            exit 1
          fi

          CLANG="$TOOLCHAIN/bin/aarch64-linux-android35-clang"
          AR="$TOOLCHAIN/bin/llvm-ar"
          RANLIB="$TOOLCHAIN/bin/llvm-ranlib"

          test -x "$CLANG"
          test -x "$AR"
          test -x "$RANLIB"

          echo "NDK root: $NDK_ROOT"
          echo "Toolchain: $TOOLCHAIN"
          echo "Clang: $CLANG"

          {
            echo "CC_aarch64_linux_android=$CLANG"
            echo "CXX_aarch64_linux_android=${CLANG}++"
            echo "AR_aarch64_linux_android=$AR"
            echo "RANLIB_aarch64_linux_android=$RANLIB"
          } >> "$GITHUB_ENV"

          {
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$CLANG"
          } >> "$GITHUB_ENV"

          mkdir -p .cargo

          cat > .cargo/config.toml <<EOF
          [target.aarch64-linux-android]
          linker = "${CLANG}"
          ar = "${AR}"
          rustflags = [
            "-C", "link-arg=-Wl,--gc-sections"
          ]
          EOF

          echo
          echo "Android ARM64 linker configuration:"
          cat .cargo/config.toml

      # ------------------------------------------------------------
      # 12. VERIFY NETWORKING / RUNTIME CONFIGURATION
      # ------------------------------------------------------------
      - name: Verify networking and runtime configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Verifying networking and runtime configuration"
          echo "============================================================"

          find crates -type f -name '*.rs' -print0 |
            xargs -0 grep -nEi \
              'peer|network|sync|pipeline|validation' \
              2>/dev/null \
              | head -n 200 || true

          echo
          echo "Networking/runtime configuration inspection complete."

      # ------------------------------------------------------------
      # 13. RUNTIME / DIAGNOSTICS CHECK
      # ------------------------------------------------------------
      - name: Verify runtime diagnostics
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Verifying runtime diagnostics"
          echo "============================================================"

          find crates -type f -name '*.rs' -print0 |
            xargs -0 grep -nEi \
              'tracing|log::|info!|warn!|error!|debug!' \
              2>/dev/null \
              | head -n 200 || true

          echo
          echo "Runtime diagnostics inspection complete."

      # ------------------------------------------------------------
      # 14. BUILD RUST ANDROID ARM64
      # ------------------------------------------------------------
      - name: Build Rust Android ARM64 node
        shell: bash
        env:
          CARGO_TERM_COLOR: always
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Building Rust Android ARM64 node"
          echo "============================================================"

          cargo build \
            --workspace \
            --target "${RUST_TARGET}" \
            --release

          echo
          echo "Rust Android ARM64 build completed."

      # ------------------------------------------------------------
      # 15. VERIFY ANDROID BUILD OUTPUT
      # ------------------------------------------------------------
      - name: Verify Android ARM64 build output
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Locating Android ARM64 build artifacts"
          echo "============================================================"

          BUILD_DIR="target/${RUST_TARGET}/release"

          test -d "$BUILD_DIR"

          echo
          echo "Release artifacts:"
          find "$BUILD_DIR" -maxdepth 1 -type f -printf '%f\n' | sort

          echo
          echo "Executable artifacts:"
          find "$BUILD_DIR" -maxdepth 1 -type f -executable -printf '%p\n' | sort || true

      # ------------------------------------------------------------
      # 16. PREPARE ANDROID APP
      # ------------------------------------------------------------
      - name: Prepare Android application
        shell: bash
        run: |
          set -euo pipefail

          test -d android-app

          echo "Android project:"
          find android-app -maxdepth 3 -type f | sort | head -n 300

      # ------------------------------------------------------------
      # 17. GENERATE CI DEBUG KEYSTORE
      # ------------------------------------------------------------
      - name: Generate CI debug keystore
        shell: bash
        run: |
          set -euo pipefail

          rm -f "$KEYSTORE_FILE"

          keytool -genkeypair \
            -v \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Ycash CI,O=Ycash,C=US"

          test -f "$KEYSTORE_FILE"

          echo "CI keystore generated."

      # ------------------------------------------------------------
      # 18. SET UP GRADLE
      # ------------------------------------------------------------
      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # ------------------------------------------------------------
      # 19. GENERATE AND VERIFY GRADLE WRAPPER
      # ------------------------------------------------------------
      - name: Generate and verify Gradle wrapper
        working-directory: android-app
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Checking Gradle wrapper"
          echo "============================================================"

          test -f ./gradlew
          test -f ./gradle/wrapper/gradle-wrapper.properties

          chmod +x ./gradlew

          if [[ ! -f ./gradle/wrapper/gradle-wrapper.jar ]]; then
            echo "Gradle wrapper JAR is missing."
            echo "Generating Gradle 8.10.2 wrapper..."

            gradle wrapper --gradle-version 8.10.2
          else
            echo "Gradle wrapper JAR already exists."
          fi

          test -f ./gradle/wrapper/gradle-wrapper.jar

          echo
          echo "Gradle wrapper verified:"
          ls -lh \
            ./gradlew \
            ./gradle/wrapper/gradle-wrapper.properties \
            ./gradle/wrapper/gradle-wrapper.jar

          echo
          echo "Gradle wrapper JAR successfully available."

      # ------------------------------------------------------------
      # 20. BUILD ANDROID APK
      # ------------------------------------------------------------
      - name: Build Android APK
        working-directory: android-app
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      # ------------------------------------------------------------
      # 21. SIGN AND VERIFY APK
      # ------------------------------------------------------------
      - name: Sign and verify Android APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find android-app -type f -path '*/build/outputs/apk/*' -name '*.apk' | head -n 1 || true)"

          if [[ -z "$APK" ]]; then
            echo "ERROR: No APK found." >&2
            exit 1
          fi

          echo "APK: $APK"

          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          test -x "$ZIPALIGN"
          test -x "$APKSIGNER"

          SIGNED_APK="${APK%.apk}-signed.apk"
          ALIGNED_APK="${APK%.apk}-aligned.apk"

          "$ZIPALIGN" \
            -f \
            4 \
            "$APK" \
            "$ALIGNED_APK"

          "$APKSIGNER" sign \
            --ks "$GITHUB_WORKSPACE/$KEYSTORE_FILE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          "$APKSIGNER" verify \
            --verbose \
            "$SIGNED_APK"

          echo
          echo "Signed APK:"
          echo "$SIGNED_APK"

      # ------------------------------------------------------------
      # 22. COLLECT ARTIFACTS
      # ------------------------------------------------------------
      - name: Collect build artifacts
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ci-artifacts

          if [[ -d "target/${RUST_TARGET}/release" ]]; then
            cp -a \
              "target/${RUST_TARGET}/release" \
              ci-artifacts/rust-release
          fi

          find android-app \
            -type f \
            \( -name '*.apk' -o -name '*.aab' \) \
            -exec cp {} ci-artifacts/ \; \
            2>/dev/null || true

          # Do NOT upload the private CI keystore.
          rm -f ci-artifacts/"$KEYSTORE_FILE"

          echo "Collected artifacts:"
          find ci-artifacts -type f -printf '%p\n' | sort

      # ------------------------------------------------------------
      # 23. UPLOAD ARTIFACTS
      # ------------------------------------------------------------
      - name: Upload Android node artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ycash-android-node-${{ github.sha }}
          path: ci-artifacts
          if-no-files-found: error
          retention-days: 14

      # ------------------------------------------------------------
      # 24. CLEANUP
      # ------------------------------------------------------------
      - name: Cleanup CI signing material
        if: always()
        shell: bash
        run: |
          set +e

          rm -f "$KEYSTORE_FILE"
          rm -f android-app/**/build/outputs/apk/*-aligned.apk
          rm -f android-app/**/build/outputs/apk/*-signed.apk

          echo "CI signing material cleaned up."
