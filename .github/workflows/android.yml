name: Build, Sign and Verify Ycash Android Node

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  ANDROID_API: "35"
  ANDROID_NDK: "27.2.12479018"
  RUST_TARGET: "aarch64-linux-android"
  ANDROID_ABI: "arm64-v8a"

  # Temporary CI signing configuration.
  # This keystore is generated during the workflow and is NOT a production key.
  KEYSTORE_FILE: "ci-debug.keystore"
  KEY_ALIAS: "ycash-ci"
  KEYSTORE_PASSWORD: "ycash-ci-password"
  KEY_PASSWORD: "ycash-ci-password"

jobs:
  build-android-node:
    name: Build Ycash Android ARM64 Node
    runs-on: ubuntu-24.04

    steps:

      # ------------------------------------------------------------
      # 1. CHECKOUT
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v5

      # ------------------------------------------------------------
      # 2. PREPARE PROJECT ROOT
      #
      # Supports both:
      #
      #   Layout A:
      #     Cargo.toml
      #     crates/
      #     android-app/
      #
      #   Layout B:
      #     YORTAL-NODE-....zip
      #
      # If the repository contains the project as a ZIP, the ZIP is
      # automatically extracted and copied into the workspace.
      # ------------------------------------------------------------
      - name: Prepare project root from ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Preparing Ycash project root"
          echo "============================================================"

          # If the repository already contains the extracted project,
          # use it directly.
          if [[ -f Cargo.toml && -d crates && -d android-app ]]; then
            echo "Project already exists at repository root."
            exit 0
          fi

          echo "Project not found at repository root."
          echo "Searching for uploaded ZIP..."

          ZIP_FILE="$(
            find "$GITHUB_WORKSPACE" \
              -maxdepth 2 \
              -type f \
              \( -iname '*.zip' \) \
              -print \
              -quit
          )"

          if [[ -z "$ZIP_FILE" ]]; then
            echo "ERROR: No ZIP file was found." >&2
            echo "Expected a ZIP containing the Ycash project." >&2
            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP_FILE"

          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT

          echo
          echo "Extracting ZIP..."

          unzip -q "$ZIP_FILE" -d "$TMP_DIR"

          echo "ZIP extraction completed."

          echo
          echo "Searching extracted contents for project root..."

          PROJECT_ROOT="$(
            find "$TMP_DIR" \
              -type f \
              -name Cargo.toml \
              -print0 |
            while IFS= read -r -d '' cargo_file; do
              candidate="$(dirname "$cargo_file")"

              if [[ -d "$candidate/crates" &&
                    -d "$candidate/android-app" ]]; then
                echo "$candidate"
                break
              fi
            done
          )"

          if [[ -z "$PROJECT_ROOT" ]]; then
            echo "ERROR: Could not find a valid Ycash project root inside ZIP." >&2
            echo
            echo "Expected:"
            echo "  Cargo.toml"
            echo "  crates/"
            echo "  android-app/"
            echo
            echo "Extracted files:"
            find "$TMP_DIR" -maxdepth 5 -type f | sort | head -300
            exit 1
          fi

          echo
          echo "Project root found:"
          echo "$PROJECT_ROOT"

          # Verify the Android node crate before copying.
          if [[ ! -f "$PROJECT_ROOT/crates/ycash-android-node/Cargo.toml" ]]; then
            echo "ERROR: ycash-android-node/Cargo.toml is missing." >&2
            exit 1
          fi

          if [[ ! -f "$PROJECT_ROOT/crates/ycash-android-node/src/main.rs" ]]; then
            echo "ERROR: ycash-android-node/src/main.rs is missing." >&2
            exit 1
          fi

          if [[ ! -f "$PROJECT_ROOT/crates/ycash-android-node/src/runtime.rs" ]]; then
            echo "ERROR: ycash-android-node/src/runtime.rs is missing." >&2
            exit 1
          fi

          echo
          echo "Copying extracted project into GitHub workspace..."

          # Do not copy Git metadata.
          # Do not overwrite the active GitHub workflow.
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            "$PROJECT_ROOT"/ \
            "$GITHUB_WORKSPACE"/

          echo
          echo "============================================================"
          echo "Extracted project structure"
          echo "============================================================"

          test -f Cargo.toml
          test -d crates
          test -d android-app

          echo
          echo "Android node crate:"
          find crates/ycash-android-node -maxdepth 3 -type f | sort

          echo
          echo "Project extraction completed successfully."

      # ------------------------------------------------------------
      # 3. VERIFY PROJECT STRUCTURE
      # ------------------------------------------------------------
      - name: Verify project structure
        shell: bash
        run: |
          set -euo pipefail

          test -f Cargo.toml
          test -d crates
          test -d android-app

          test -f crates/ycash-android-node/Cargo.toml
          test -f crates/ycash-android-node/src/main.rs
          test -f crates/ycash-android-node/src/runtime.rs

          test -f android-app/app/build.gradle
          test -f android-app/app/src/main/AndroidManifest.xml

          test -f android-app/app/src/main/java/com/ycash/androidnode/MainActivity.java
          test -f android-app/app/src/main/java/com/ycash/androidnode/NodeService.java

          echo "Project structure verified."

      # ------------------------------------------------------------
      # 4. JAVA
      # ------------------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # ------------------------------------------------------------
      # 5. ANDROID SDK / NDK
      #
      # IMPORTANT:
      # packages: ''
      #
      # setup-android otherwise attempts to install the legacy
      # "tools" package, which causes sdkmanager to fail.
      # Required SDK packages are installed explicitly below.
      # ------------------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail

          echo "Accepting Android SDK licenses..."

          yes | sdkmanager --licenses >/dev/null || true

          echo
          echo "Installing required Android packages..."

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;35.0.0" \
            "ndk;${ANDROID_NDK}"

          echo
          echo "Android SDK:"
          echo "${ANDROID_SDK_ROOT}"

          echo
          echo "Android NDK:"
          echo "${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK}"

          test -d "${ANDROID_SDK_ROOT}"
          test -d "${ANDROID_SDK_ROOT}/platforms/android-${ANDROID_API}"
          test -d "${ANDROID_SDK_ROOT}/build-tools/35.0.0"
          test -d "${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK}"

          echo
          echo "Android SDK and NDK verified."

      # ------------------------------------------------------------
      # 6. RUST
      # ------------------------------------------------------------
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.RUST_TARGET }}

      # ------------------------------------------------------------
      # 7. VERIFY RUST TARGET
      #
      # Do NOT use:
      #
      #   rustup target list --installed | grep -q ...
      #
      # with pipefail because grep -q can close the pipe early and
      # cause rustup to receive SIGPIPE.
      # ------------------------------------------------------------
      - name: Verify Rust workspace and target
        shell: bash
        run: |
          set -euo pipefail

          echo "Installed Rust targets:"
          rustup target list --installed

          INSTALLED_TARGETS="$(rustup target list --installed)"

          if ! grep -Fx "${RUST_TARGET}" <<< "$INSTALLED_TARGETS" >/dev/null; then
            echo "ERROR: Rust target ${RUST_TARGET} is not installed." >&2
            exit 1
          fi

          echo
          echo "Rust target verified: ${RUST_TARGET}"

          cargo --version
          rustc --version

          test -f Cargo.toml

      # ------------------------------------------------------------
      # 8. RUST REGRESSION TESTS
      # ------------------------------------------------------------
      - name: Run Rust regression tests
        shell: bash
        run: |
          set -euo pipefail

          cargo test --workspace --all-targets

      # ------------------------------------------------------------
      # 9. SQLITE SCHEMA ORDERING CHECK
      # ------------------------------------------------------------
      - name: Verify SQLite schema ordering
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for SQLite schema definitions..."

          if grep -Rni \
            --include='*.rs' \
            --include='*.sql' \
            'CREATE TABLE' \
            crates \
            >/tmp/sqlite-schema-search.txt 2>/dev/null; then

            cat /tmp/sqlite-schema-search.txt

            echo
            echo "SQLite schema definitions found."
          else
            echo "No SQLite CREATE TABLE definitions found in crates."
          fi

      # ------------------------------------------------------------
      # 10. ANDROID LINKER CONFIGURATION
      # ------------------------------------------------------------
      - name: Configure Android ARM64 linker
        shell: bash
        run: |
          set -euo pipefail

          NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK}"
          TOOLCHAIN="${NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin"

          CLANG="${TOOLCHAIN}/aarch64-linux-android35-clang"
          AR="${TOOLCHAIN}/llvm-ar"
          RANLIB="${TOOLCHAIN}/llvm-ranlib"

          test -x "$CLANG"
          test -x "$AR"
          test -x "$RANLIB"

          mkdir -p "$HOME/.cargo"

          cat > "$HOME/.cargo/config.toml" <<EOF
          [target.aarch64-linux-android]
          linker = "${CLANG}"
          ar = "${AR}"
          rustflags = [
            "-C", "link-arg=-Wl,--gc-sections"
          ]
          EOF

          echo "Android linker configuration:"
          cat "$HOME/.cargo/config.toml"

      # ------------------------------------------------------------
      # 11. SOURCE / NETWORKING CHECKS
      # ------------------------------------------------------------
      - name: Verify node networking and protocol sources
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Ycash node networking source..."

          grep -RniE \
            '8833|8832|8834|9067' \
            crates/ycash-android-node \
            >/tmp/ports.txt || true

          cat /tmp/ports.txt || true

          echo
          echo "Checking protocol version..."

          grep -Rni \
            '270014' \
            crates/ycash-android-node \
            >/tmp/protocol.txt || true

          cat /tmp/protocol.txt || true

          echo
          echo "Checking getheaders/getdata..."

          grep -RniE \
            'getheaders|getdata' \
            crates/ycash-android-node \
            >/tmp/p2p_commands.txt || true

          cat /tmp/p2p_commands.txt || true

          echo
          echo "Checking lightwallet RPC methods..."

          grep -RniE \
            'CompactTxStreamer|GetLatestBlock|GetBlockRange|GetLightdInfo' \
            crates/ycash-android-node \
            >/tmp/lightwallet.txt || true

          cat /tmp/lightwallet.txt || true

          echo
          echo "Checking TcpListenerStream..."

          grep -Rni \
            'TcpListenerStream' \
            crates/ycash-android-node \
            >/tmp/tcpstream.txt || true

          cat /tmp/tcpstream.txt || true

          echo
          echo "Checking tokio-stream net feature..."

          grep -Rni \
            'tokio-stream' \
            Cargo.toml \
            crates \
            >/tmp/tokio-stream.txt || true

          cat /tmp/tokio-stream.txt || true

          echo
          echo "Checking for accidental drop(listener)..."

          if grep -Rni \
            'drop(listener)' \
            crates/ycash-android-node \
            >/tmp/drop-listener.txt 2>/dev/null; then

            cat /tmp/drop-listener.txt

            echo
            echo "ERROR: Found drop(listener)." >&2
            exit 1
          else
            echo "No drop(listener) found."
          fi

      # ------------------------------------------------------------
      # 12. ANDROID RUNTIME SOURCE CHECKS
      # ------------------------------------------------------------
      - name: Verify Android runtime integration
        shell: bash
        run: |
          set -euo pipefail

          RUNTIME_DIR="android-app/app/src/main"

          echo "Checking nativeLibraryDir..."

          grep -Rni \
            'nativeLibraryDir' \
            "$RUNTIME_DIR"

          echo
          echo "Checking libycashandroidnode.so..."

          grep -Rni \
            'libycashandroidnode.so' \
            "$RUNTIME_DIR"

          echo
          echo "Checking ProcessBuilder..."

          grep -Rni \
            'ProcessBuilder' \
            "$RUNTIME_DIR"

          echo
          echo "Checking node.log..."

          grep -Rni \
            'node.log' \
            "$RUNTIME_DIR"

          echo
          echo "Checking redirectErrorStream..."

          grep -Rni \
            'redirectErrorStream' \
            "$RUNTIME_DIR"

          echo
          echo "Checking node ports..."

          grep -RniE \
            '8833|8832|8834|9067' \
            "$RUNTIME_DIR"

          echo
          echo "Checking arm64-v8a..."

          grep -Rni \
            'arm64-v8a' \
            android-app

          echo
          echo "Checking doNotStrip..."

          grep -Rni \
            'doNotStrip' \
            android-app

          echo
          echo "Checking extractNativeLibs..."

          grep -Rni \
            'extractNativeLibs' \
            android-app

          echo
          echo "Checking localhost cleartext traffic..."

          grep -Rni \
            'cleartextTrafficPermitted' \
            android-app

      # ------------------------------------------------------------
      # 13. CRASH-SAFE DIAGNOSTICS CHECKS
      # ------------------------------------------------------------
      - name: Verify crash-safe diagnostics
        shell: bash
        run: |
          set -euo pipefail

          APP_SRC="android-app/app/src/main"

          echo "Checking refreshDeviceStatsSafe..."
          grep -Rni \
            'refreshDeviceStatsSafe' \
            "$APP_SRC"

          echo
          echo "Checking refreshNodeLog..."
          grep -Rni \
            'refreshNodeLog' \
            "$APP_SRC"

          echo
          echo "Checking refreshAppErrorLog..."
          grep -Rni \
            'refreshAppErrorLog' \
            "$APP_SRC"

          echo
          echo "Checking safeSetText..."
          grep -Rni \
            'safeSetText' \
            "$APP_SRC"

          echo
          echo "Checking writeAppError..."
          grep -Rni \
            'writeAppError' \
            "$APP_SRC"

          echo
          echo "Checking app-error.log..."
          grep -Rni \
            'app-error.log' \
            "$APP_SRC"

          echo
          echo "Checking UNCAUGHT EXCEPTION..."
          grep -Rni \
            'UNCAUGHT EXCEPTION' \
            "$APP_SRC"

          echo
          echo "Checking DIAGNOSTICS CLICK..."
          grep -Rni \
            'DIAGNOSTICS CLICK' \
            "$APP_SRC"

      # ------------------------------------------------------------
      # 14. CLEAN NATIVE PACKAGE
      # ------------------------------------------------------------
      - name: Clean native package directory
        shell: bash
        run: |
          set -euo pipefail

          rm -rf android-app/app/src/main/jniLibs

          mkdir -p \
            android-app/app/src/main/jniLibs/${ANDROID_ABI}

          echo "Native package directory prepared."

      # ------------------------------------------------------------
      # 15. CARGO CACHE
      # ------------------------------------------------------------
      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # ------------------------------------------------------------
      # 16. BUILD ANDROID ARM64 NATIVE NODE
      # ------------------------------------------------------------
      - name: Build Android ARM64 native node
        shell: bash
        run: |
          set -uo pipefail

          echo "============================================================"
          echo "Building Android ARM64 native Ycash node"
          echo "============================================================"

          bash -x tools/build-android-arm64.sh \
            2>&1 | tee android-arm64-build.log

          status=${PIPESTATUS[0]}

          echo
          echo "============================================================"
          echo "Android ARM64 build exit code: $status"
          echo "============================================================"

          exit "$status"

      # ------------------------------------------------------------
      # 17. ALWAYS UPLOAD NATIVE BUILD LOG
      # ------------------------------------------------------------
      - name: Upload Android ARM64 build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ycash-android-arm64-build-log
          path: android-arm64-build.log
          if-no-files-found: warn

      # ------------------------------------------------------------
      # 18. VERIFY BUILT ELF
      # ------------------------------------------------------------
      - name: Verify Android ARM64 ELF
        shell: bash
        run: |
          set -euo pipefail

          NATIVE_LIB="target/aarch64-linux-android/release/libycashandroidnode.so"

          if [[ ! -f "$NATIVE_LIB" ]]; then
            echo "ERROR: Native library not found:"
            echo "$NATIVE_LIB"
            exit 1
          fi

          echo "Native library:"
          ls -lh "$NATIVE_LIB"

          file "$NATIVE_LIB"

          readelf -h "$NATIVE_LIB" | sed -n '1,80p'

          echo
          echo "Checking ELF machine architecture..."

          ELF_MACHINE="$(
            readelf -h "$NATIVE_LIB" |
            awk -F: '/Machine:/ {print $2}' |
            xargs
          )"

          echo "ELF machine: $ELF_MACHINE"

          if [[ "$ELF_MACHINE" != *"AArch64"* ]]; then
            echo "ERROR: Native library is not AArch64." >&2
            exit 1
          fi

      # ------------------------------------------------------------
      # 19. PACKAGE NATIVE LIBRARY INTO JNI
      # ------------------------------------------------------------
      - name: Package native ARM64 library
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_LIB="target/aarch64-linux-android/release/libycashandroidnode.so"
          DEST_DIR="android-app/app/src/main/jniLibs/${ANDROID_ABI}"
          DEST_LIB="${DEST_DIR}/libycashandroidnode.so"

          test -f "$SOURCE_LIB"

          mkdir -p "$DEST_DIR"

          cp "$SOURCE_LIB" "$DEST_LIB"

          test -f "$DEST_LIB"

          echo "Packaged native library:"
          ls -lh "$DEST_LIB"

          echo
          echo "SHA256:"
          sha256sum "$SOURCE_LIB"
          sha256sum "$DEST_LIB"

          SOURCE_HASH="$(sha256sum "$SOURCE_LIB" | awk '{print $1}')"
          DEST_HASH="$(sha256sum "$DEST_LIB" | awk '{print $1}')"

          if [[ "$SOURCE_HASH" != "$DEST_HASH" ]]; then
            echo "ERROR: Native library hash mismatch." >&2
            exit 1
          fi

          echo "Native package hash verified."

      # ------------------------------------------------------------
      # 20. VERIFY ANDROID PACKAGE
      # ------------------------------------------------------------
      - name: Verify Android native package
        shell: bash
        run: |
          set -euo pipefail

          if [[ -x tools/verify-android-package.sh ]]; then
            bash tools/verify-android-package.sh
          elif [[ -f tools/verify-android-package.sh ]]; then
            bash tools/verify-android-package.sh
          else
            echo "WARNING: tools/verify-android-package.sh not found."
            echo "Performing basic package verification instead."

            test -f \
              "android-app/app/src/main/jniLibs/${ANDROID_ABI}/libycashandroidnode.so"
          fi

      # ------------------------------------------------------------
      # 21. SET UP GRADLE
      # ------------------------------------------------------------
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"

      # ------------------------------------------------------------
      # 22. BUILD DEBUG APK
      # ------------------------------------------------------------
      - name: Build Android debug APK
        working-directory: android-app
        shell: bash
        run: |
          set -euo pipefail

          gradle --version

          gradle \
            --no-daemon \
            --stacktrace \
            assembleDebug

      # ------------------------------------------------------------
      # 23. VERIFY DEBUG APK
      #
      # Capture unzip output first instead of:
      #
      #   unzip -l APK | grep -q ...
      #
      # because grep -q can trigger SIGPIPE under pipefail.
      # ------------------------------------------------------------
      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail

          APK="android-app/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "Debug APK:"
          ls -lh "$APK"

          APK_LISTING="$(unzip -l "$APK")"

          echo "$APK_LISTING"

          if grep -Fq \
            'lib/arm64-v8a/libycashandroidnode.so' \
            <<< "$APK_LISTING"; then

            echo "Native ARM64 library found in APK."
          else
            echo "ERROR: Native ARM64 library is missing from APK." >&2
            exit 1
          fi

          echo
          echo "APK verification successful."

      # ------------------------------------------------------------
      # 24. CREATE TEMPORARY CI KEYSTORE
      # ------------------------------------------------------------
      - name: Create temporary CI signing keystore
        shell: bash
        run: |
          set -euo pipefail

          rm -f "$KEYSTORE_FILE"

          keytool \
            -genkeypair \
            -v \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Ycash CI,O=Ycash,OU=Android"

          test -f "$KEYSTORE_FILE"

          echo "Temporary CI keystore created."

      # ------------------------------------------------------------
      # 25. LOCATE ANDROID BUILD TOOLS
      # ------------------------------------------------------------
      - name: Locate Android signing tools
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS="${ANDROID_SDK_ROOT}/build-tools/35.0.0"

          test -x "${BUILD_TOOLS}/zipalign"
          test -x "${BUILD_TOOLS}/apksigner"

          echo "zipalign:"
          "${BUILD_TOOLS}/zipalign" -h | sed -n '1,20p'

          echo
          echo "apksigner:"
          "${BUILD_TOOLS}/apksigner" version

      # ------------------------------------------------------------
      # 26. ZIPALIGN APK
      # ------------------------------------------------------------
      - name: Zipalign debug APK
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS="${ANDROID_SDK_ROOT}/build-tools/35.0.0"

          INPUT_APK="android-app/app/build/outputs/apk/debug/app-debug.apk"
          ALIGNED_APK="android-app/app/build/outputs/apk/debug/app-debug-aligned.apk"

          rm -f "$ALIGNED_APK"

          "${BUILD_TOOLS}/zipalign" \
            -f \
            -p \
            4 \
            "$INPUT_APK" \
            "$ALIGNED_APK"

          test -f "$ALIGNED_APK"

          "${BUILD_TOOLS}/zipalign" -c -v 4 "$ALIGNED_APK"

      # ------------------------------------------------------------
      # 27. SIGN APK
      # ------------------------------------------------------------
      - name: Sign Android APK
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS="${ANDROID_SDK_ROOT}/build-tools/35.0.0"

          ALIGNED_APK="android-app/app/build/outputs/apk/debug/app-debug-aligned.apk"
          SIGNED_APK="android-app/app/build/outputs/apk/debug/ycash-android-node-signed.apk"

          rm -f "$SIGNED_APK"

          "${BUILD_TOOLS}/apksigner" sign \
            --ks "$KEYSTORE_FILE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:${KEYSTORE_PASSWORD}" \
            --key-pass "pass:${KEY_PASSWORD}" \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          test -f "$SIGNED_APK"

          echo "Signed APK:"
          ls -lh "$SIGNED_APK"

      # ------------------------------------------------------------
      # 28. VERIFY SIGNED APK
      # ------------------------------------------------------------
      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS="${ANDROID_SDK_ROOT}/build-tools/35.0.0"

          SIGNED_APK="android-app/app/build/outputs/apk/debug/ycash-android-node-signed.apk"

          test -f "$SIGNED_APK"

          "${BUILD_TOOLS}/apksigner" verify --verbose "$SIGNED_APK"

          echo
          echo "Signed APK signature verified."

          APK_LISTING="$(unzip -l "$SIGNED_APK")"

          echo "$APK_LISTING"

          if grep -Fq \
            'lib/arm64-v8a/libycashandroidnode.so' \
            <<< "$APK_LISTING"; then

            echo "Signed APK contains ARM64 native library."
          else
            echo "ERROR: Signed APK does not contain ARM64 native library." >&2
            exit 1
          fi

      # ------------------------------------------------------------
      # 29. FINAL SIGNED APK REGRESSION CHECK
      # ------------------------------------------------------------
      - name: Final signed APK regression verification
        shell: bash
        run: |
          set -euo pipefail

          NATIVE_LIB="target/aarch64-linux-android/release/libycashandroidnode.so"
          PACKAGED_LIB="android-app/app/src/main/jniLibs/${ANDROID_ABI}/libycashandroidnode.so"
          SIGNED_APK="android-app/app/build/outputs/apk/debug/ycash-android-node-signed.apk"

          test -f "$NATIVE_LIB"
          test -f "$PACKAGED_LIB"
          test -f "$SIGNED_APK"

          SOURCE_HASH="$(sha256sum "$NATIVE_LIB" | awk '{print $1}')"
          PACKAGE_HASH="$(sha256sum "$PACKAGED_LIB" | awk '{print $1}')"

          echo "Native source SHA256:"
          echo "$SOURCE_HASH"

          echo
          echo "Packaged native SHA256:"
          echo "$PACKAGE_HASH"

          if [[ "$SOURCE_HASH" != "$PACKAGE_HASH" ]]; then
            echo "ERROR: Native source/package hash mismatch." >&2
            exit 1
          fi

          BUILD_TOOLS="${ANDROID_SDK_ROOT}/build-tools/35.0.0"

          "${BUILD_TOOLS}/apksigner" verify "$SIGNED_APK"

          echo
          echo "============================================================"
          echo "FINAL VERIFICATION PASSED"
          echo "============================================================"

          echo
          echo "Signed APK:"
          ls -lh "$SIGNED_APK"

          echo
          echo "SHA256:"
          sha256sum "$SIGNED_APK"

      # ------------------------------------------------------------
      # 30. UPLOAD FINAL APK
      # ------------------------------------------------------------
      - name: Upload signed APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ycash-android-node-signed
          path: android-app/app/build/outputs/apk/debug/ycash-android-node-signed.apk
          if-no-files-found: error

      # ------------------------------------------------------------
      # 31. UPLOAD RAW NATIVE NODE
      # ------------------------------------------------------------
      - name: Upload raw Android ARM64 native node
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ycash-android-node-arm64-native
          path: target/aarch64-linux-android/release/libycashandroidnode.so
          if-no-files-found: error

      # ------------------------------------------------------------
      # 32. UPLOAD DIAGNOSTIC SOURCE FILES
      # ------------------------------------------------------------
      - name: Upload diagnostic source files
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ycash-android-node-diagnostics
          path: |
            android-arm64-build.log
            crates/ycash-android-node/src/main.rs
            crates/ycash-android-node/src/runtime.rs
            android-app/app/src/main/java/com/ycash/androidnode/MainActivity.java
            android-app/app/src/main/java/com/ycash/androidnode/NodeService.java
          if-no-files-found: warn

      # ------------------------------------------------------------
      # 33. CLEAN TEMPORARY SIGNING MATERIAL
      # ------------------------------------------------------------
      - name: Clean temporary signing material
        if: always()
        shell: bash
        run: |
          set +e

          rm -f "$KEYSTORE_FILE"

          echo "Temporary signing material cleaned."

          true
