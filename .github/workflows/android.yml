name: Build, Sign and Verify YORTAL Node (any version)

on:
  workflow_dispatch:
    inputs:
      zip:
        description: "Project ZIP to build (file name). Blank = highest version found."
        required: false
        default: ""
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  ANDROID_API: "35"
  ANDROID_NDK: "27.2.12479018"
  RUST_TARGET: "aarch64-linux-android"
  # YORTAL_VERSION is detected from crates/ycash-android-node/Cargo.toml.
  ANDROID_ABI: "arm64-v8a"

  # Temporary CI signing configuration.
  # Generated during the workflow and NOT a production key.
  KEYSTORE_FILE: "ci-debug.keystore"
  KEY_ALIAS: "ycash-ci"
  KEYSTORE_PASSWORD: "ycash-ci-password"
  KEY_PASSWORD: "ycash-ci-password"

jobs:
  build-android-node:
    name: Build YORTAL Android ARM64 Node
    runs-on: ubuntu-24.04

    steps:

      # ------------------------------------------------------------
      # 1. CHECKOUT
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v5

      # ------------------------------------------------------------
      # 2. PREPARE PROJECT ROOT
      # ------------------------------------------------------------
      - name: Prepare project root from ZIP
        shell: bash
        env:
          ZIP_INPUT: ${{ github.event.inputs.zip }}
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Preparing Ycash project root"
          echo "============================================================"

          if [[ -f Cargo.toml && -d crates && -d android-app ]]; then
            echo "Project already exists at repository root."
            exit 0
          fi

          echo "Project not found at repository root."
          echo "Searching for uploaded ZIP..."

          # Several project ZIPs may be committed. Pick the highest version
          # by name (e.g. YORTAL-NODE-v0_29_0-... beats v0_28_1-...).
          echo "ZIP files in repository:"
          find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -iname '*.zip' -printf '  %f\n' | sort -V || true

          REQUESTED_ZIP="${ZIP_INPUT:-}"
          if [[ -n "$REQUESTED_ZIP" ]]; then
            ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -name "$REQUESTED_ZIP" -print | head -n 1)"
            if [[ -z "$ZIP_FILE" ]]; then
              echo "ERROR: requested ZIP '$REQUESTED_ZIP' not found." >&2
              exit 1
            fi
          else
            # Sort on the file NAME only, so folders don't affect the choice.
            ZIP_FILE="$(
              find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -iname '*.zip' -printf '%f\t%p\n' \
                | sort -V -k1,1 \
                | tail -n 1 \
                | cut -f2
            )"
          fi

          if [[ -z "$ZIP_FILE" ]]; then
            echo "ERROR: No ZIP file was found." >&2
            echo "Expected a ZIP containing the Ycash project." >&2
            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP_FILE"

          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT

          echo
          echo "Extracting ZIP..."

          unzip -q "$ZIP_FILE" -d "$TMP_DIR"

          echo "ZIP extraction completed."

          echo
          echo "Searching extracted contents for project root..."

          PROJECT_ROOT="$(
            find "$TMP_DIR" \
              -type f \
              -name Cargo.toml \
              -print0 |
            while IFS= read -r -d '' cargo_file; do
              candidate="$(dirname "$cargo_file")"

              if [[ -d "$candidate/crates" &&
                    -d "$candidate/android-app" ]]; then
                echo "$candidate"
                break
              fi
            done
          )"

          if [[ -z "$PROJECT_ROOT" ]]; then
            echo "ERROR: Could not find a valid Ycash project root inside ZIP." >&2
            echo
            echo "Expected:"
            echo "  Cargo.toml"
            echo "  crates/"
            echo "  android-app/"
            echo
            echo "Extracted files:"
            find "$TMP_DIR" \
              -maxdepth 5 \
              -type f \
              | sort \
              | sed -n '1,300p'
            exit 1
          fi

          echo
          echo "Project root found:"
          echo "$PROJECT_ROOT"

          test -f "$PROJECT_ROOT/crates/ycash-android-node/Cargo.toml"
          test -f "$PROJECT_ROOT/crates/ycash-android-node/src/main.rs"
          test -f "$PROJECT_ROOT/crates/ycash-android-node/src/runtime.rs"

          echo
          echo "Copying extracted project into GitHub workspace..."

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            "$PROJECT_ROOT"/ \
            "$GITHUB_WORKSPACE"/

          echo
          echo "============================================================"
          echo "Extracted project structure"
          echo "============================================================"

          test -f Cargo.toml
          test -d crates
          test -d android-app

          echo
          echo "Android node crate:"
          find crates/ycash-android-node \
            -maxdepth 3 \
            -type f \
            | sort

          echo
          echo "Project extraction completed successfully."

      # ------------------------------------------------------------
      # 2B. RESTORE PROJECT SCRIPT PERMISSIONS
      # ------------------------------------------------------------
      - name: Restore project script permissions
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Restoring project script executable permissions"
          echo "============================================================"

          if [[ ! -d tools ]]; then
            echo "ERROR: tools directory was not found." >&2
            exit 1
          fi

          echo
          echo "Shell scripts before chmod:"

          find tools \
            -type f \
            -name '*.sh' \
            -printf '%M %p\n' \
            | sort || true

          echo
          echo "Applying executable permissions..."

          while IFS= read -r -d '' script; do
            chmod +x "$script"
          done < <(
            find tools \
              -type f \
              -name '*.sh' \
              -print0
          )

          echo
          echo "Shell scripts after chmod:"

          find tools \
            -type f \
            -name '*.sh' \
            -printf '%M %p\n' \
            | sort

          echo
          echo "Verifying required build scripts..."

          test -f tools/build-android-arm64.sh
          test -f tools/package-node-binary.sh

          test -x tools/build-android-arm64.sh
          test -x tools/package-node-binary.sh

          echo
          echo "Required build scripts are executable."

      # ------------------------------------------------------------
      # 3. VERIFY PROJECT STRUCTURE
      # ------------------------------------------------------------
      - name: Verify project structure
        shell: bash
        run: |
          set -euo pipefail

          test -f Cargo.toml
          test -d crates
          test -d android-app

          test -f crates/ycash-android-node/Cargo.toml
          test -f crates/ycash-android-node/src/main.rs
          test -f crates/ycash-android-node/src/runtime.rs

          # RocksDB state backend (v0.32+).
          test -f crates/state/src/db.rs
          test -f crates/state/src/lib.rs
          test -f crates/state/src/chainstate.rs

          test -f android-app/app/build.gradle
          test -f android-app/app/src/main/AndroidManifest.xml

          test -f android-app/app/src/main/java/com/ycash/androidnode/MainActivity.java
          test -f android-app/app/src/main/java/com/ycash/androidnode/NodeService.java

          test -f tools/build-android-arm64.sh
          test -f tools/package-node-binary.sh

          test -x tools/build-android-arm64.sh
          test -x tools/package-node-binary.sh

          echo "Project structure verified."
          echo "Build scripts are executable."

      # ------------------------------------------------------------
      # 3B. DETECT VERSION + VERIFY SOURCE (works for any version)
      # ------------------------------------------------------------
      - name: Detect YORTAL version
        shell: bash
        run: |
          set -euo pipefail
          CRATE="crates/ycash-android-node/Cargo.toml"
          VERSION="$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' "$CRATE" | head -n 1)"
          if [[ -z "$VERSION" ]]; then
            VERSION="$(sed -n "s/.*versionName '\([^'-]*\).*/\1/p" android-app/app/build.gradle | head -n 1)"
          fi
          if [[ -z "$VERSION" ]]; then
            VERSION="unknown-${GITHUB_RUN_NUMBER}"
          fi
          echo "YORTAL_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Detected YORTAL version: ${VERSION}"
          if [[ -f BUILD_ID.txt ]]; then echo "BUILD_ID: $(cat BUILD_ID.txt)"; fi

      - name: Verify source
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Verifying YORTAL v${YORTAL_VERSION} source"
          echo "============================================================"

          PIPE="crates/ycash-android-node/src/pipeline_sync.rs"
          MAIN="crates/ycash-android-node/src/main.rs"
          CONS="crates/consensus/src/lib.rs"
          STATE="crates/state/src/lib.rs"
          STATE_DB="crates/state/src/db.rs"

          fail=0
          warns=0
          # Hard requirement: file must exist and contain the pattern.
          need() {
            local pattern="$1" file="$2" label="$3"
            if [[ -f "$file" ]] && grep -Fq -- "$pattern" "$file"; then
              echo "PASS: $label"
            else
              echo "FAIL: $label  (missing '$pattern' in $file)" >&2
              fail=1
            fi
          }
          # Informational: reported, never fails the build.
          want() {
            local pattern="$1" file="$2" label="$3"
            if [[ -f "$file" ]] && grep -Fq -- "$pattern" "$file"; then
              echo "OK:   $label"
            else
              echo "WARN: $label  (not found in $file)"
              warns=$((warns+1))
            fi
          }

          # Version strings should agree (warn only)
          want "version = \"${YORTAL_VERSION}\"" crates/ycash-android-node/Cargo.toml "crate version ${YORTAL_VERSION}"
          want "/YcashAndroid:${YORTAL_VERSION}/" "$MAIN" "P2P user agent ${YORTAL_VERSION}"
          want "versionName '${YORTAL_VERSION}-node'" android-app/app/build.gradle "APK versionName"

          # Build-critical files
          need "fn main" "$MAIN" "android node main.rs"
          [[ -f crates/ycash-android-node/src/runtime.rs ]] && echo "PASS: runtime.rs present" || { echo "FAIL: runtime.rs missing" >&2; fail=1; }

          # Consensus safety: if these constants exist they must not have drifted
          if [[ -f "$PIPE" ]] && grep -Fq "ASSUME_VALID_HEIGHT" "$PIPE"; then
            need "pub const ASSUME_VALID_HEIGHT: u64 = 2_250_000;" "$PIPE" "assume-valid checkpoint unchanged"
            need "000003f98b7497fdcd8a6b6d10a93a887c5d47127e24a9dc3a40cb65754d21e7" "$PIPE" "assume-valid hash unchanged"
          else
            echo "INFO: no assume-valid checkpoint in this version"
          fi

          # Feature report (warn only, so older/newer versions still build)
          want "pub fn validate_for_commit_opts" "$CONS" "contextless block validation"
          want "fn committer_loop" "$PIPE" "ordered committer"
          want "sync_channel::<VerifyJob>" "$PIPE" "bounded verify channel"
          want "const HEDGE_AFTER" "$PIPE" "hedged head-of-line range"
          want "pub struct ProofBatch" "$CONS" "batched Sapling proof verification"
          want "pub struct SaplingBatch" crates/ycash-crypto/src/batch.rs "Groth16 batch verifier"

          # State backend (v0.32+: RocksDB replaced SQLite)
          want "pub fn read_view" "$STATE_DB" "RocksDB snapshot read view"
          want "pub const COLUMN_FAMILIES" "$STATE_DB" "column family set"
          want "pub fn apply_prepared_commit" "$STATE" "ordered atomic commit"
          want "fn stage_rollback" "$STATE" "atomic reorg rollback"

          if [[ -f "$PIPE" ]] && grep -Fq "let workers = 1usize;" "$PIPE"; then
            echo "WARN: sequential worker clamp present"; warns=$((warns+1))
          fi

          echo
          echo "Warnings: ${warns}"
          if [[ "$fail" -ne 0 ]]; then
            echo "ERROR: v${YORTAL_VERSION} source verification failed." >&2
            exit 1
          fi
          echo "Source verified."

      # ------------------------------------------------------------
      # 4. JAVA
      # ------------------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # ------------------------------------------------------------
      # 5. ANDROID SDK / NDK
      # ------------------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Installing Android SDK and NDK"
          echo "============================================================"

          echo
          echo "Accepting Android SDK licenses..."

          yes | sdkmanager --licenses >/dev/null || true

          echo
          echo "Installing required Android packages..."

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;35.0.0" \
            "ndk;${ANDROID_NDK}"

          NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK}"

          echo
          echo "Android SDK:"
          echo "${ANDROID_SDK_ROOT}"

          echo
          echo "Installed Android NDK directories:"

          find "${ANDROID_SDK_ROOT}/ndk" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            -printf '%f\n' \
            | sort

          echo
          echo "Requested NDK:"
          echo "$NDK_ROOT"

          test -d "${ANDROID_SDK_ROOT}"
          test -d "${ANDROID_SDK_ROOT}/platforms/android-${ANDROID_API}"
          test -d "${ANDROID_SDK_ROOT}/build-tools/35.0.0"
          test -d "$NDK_ROOT"

          echo
          echo "NDK version information:"

          if [[ -f "$NDK_ROOT/source.properties" ]]; then
            cat "$NDK_ROOT/source.properties"
          fi

          echo
          echo "Android SDK and NDK verified."

      # ------------------------------------------------------------
      # 5B. LIBCLANG (REQUIRED BY THE ROCKSDB STATE BACKEND)
      # ------------------------------------------------------------
      # librocksdb-sys generates its bindings with bindgen, which loads
      # libclang at build-script time. The ubuntu-24.04 runner image has no
      # libclang.so / llvm-config on PATH, so clang-sys panics and even
      # `cargo check` fails before reaching any YORTAL crate. Installing it
      # here (once) covers both the host check and the Android cross-build,
      # because GITHUB_ENV values persist across later steps.
      - name: Install libclang for RocksDB bindings
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Installing libclang / LLVM for bindgen"
          echo "============================================================"

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            libclang-dev \
            llvm-dev

          LLVM_CONFIG="$(command -v llvm-config || true)"

          if [[ -z "$LLVM_CONFIG" ]]; then
            echo "ERROR: llvm-config is still not on PATH after installation." >&2
            exit 1
          fi

          LIBDIR="$($LLVM_CONFIG --libdir)"

          echo
          echo "llvm-config: $LLVM_CONFIG"
          echo "LLVM libdir: $LIBDIR"

          echo
          echo "Shared libclang libraries found:"
          ls -l "$LIBDIR"/libclang*.so* || true

          if ! ls "$LIBDIR"/libclang.so* >/dev/null 2>&1; then
            echo "ERROR: no libclang shared library in $LIBDIR." >&2
            exit 1
          fi

          {
            echo "LIBCLANG_PATH=${LIBDIR}"
            echo "LLVM_CONFIG_PATH=${LLVM_CONFIG}"
          } >> "$GITHUB_ENV"

          echo
          echo "clang version:"
          clang --version | sed -n '1,3p'

          echo
          echo "libclang is available to bindgen."

      # ------------------------------------------------------------
      # 6. RUST
      # ------------------------------------------------------------
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.RUST_TARGET }}

      # ------------------------------------------------------------
      # 6B. CARGO CACHE
      # ------------------------------------------------------------
      # Restored BEFORE the host compile check, because that check is now
      # what compiles the RocksDB C++ sources for the first time. With a cold
      # cache expect roughly 5-15 minutes there, and again for the Android
      # target; with a warm cache both are near-instant.
      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ env.RUST_TARGET }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ env.RUST_TARGET }}-
            ${{ runner.os }}-cargo-

      # ------------------------------------------------------------
      # 7. VERIFY RUST TARGET
      # ------------------------------------------------------------
      - name: Verify Rust workspace and target
        shell: bash
        run: |
          set -euo pipefail

          echo "Installed Rust targets:"
          rustup target list --installed

          INSTALLED_TARGETS="$(rustup target list --installed)"

          if ! grep -Fx "${RUST_TARGET}" <<< "$INSTALLED_TARGETS" >/dev/null; then
            echo "ERROR: Rust target ${RUST_TARGET} is not installed." >&2
            exit 1
          fi

          echo
          echo "Rust target verified: ${RUST_TARGET}"

          cargo --version
          rustc --version

          test -f Cargo.toml

      # ------------------------------------------------------------
      # 8. VERIFY RUST TEST FIXTURES
      # ------------------------------------------------------------
      - name: Verify Rust test fixtures
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking required Rust test fixtures..."

          REQUIRED_FIXTURES=(
            "crates/ycash-crypto/src/tests/res/tree16.dat"
            "crates/ycash-crypto/src/tests/res/tree1023.dat"
          )

          missing=0

          for fixture in "${REQUIRED_FIXTURES[@]}"; do
            if [[ -f "$fixture" ]]; then
              echo "FOUND: $fixture"
              ls -lh "$fixture"
            else
              echo "MISSING: $fixture"
              missing=1
            fi
          done

          if [[ "$missing" -ne 0 ]]; then
            echo
            echo "ERROR: Required Rust test fixtures are missing."
            echo "The Ycash project ZIP must contain the original .dat files."
            exit 1
          fi

          echo
          echo "All Rust test fixtures verified."

      # ------------------------------------------------------------
      # 9. COMPILE CHECK
      # ------------------------------------------------------------
      - name: Compile check (host)
        shell: bash
        run: |
          set -euo pipefail

          echo "LIBCLANG_PATH=${LIBCLANG_PATH:-<not set>}"

          # Surfaces compile errors in the new pipeline before packaging.
          # This also builds the RocksDB C++ sources for the host.
          cargo check --workspace --all-targets

      # ------------------------------------------------------------
      # 10. STATE BACKEND CHECK (RocksDB, formerly SQLite schema check)
      # ------------------------------------------------------------
      - name: Verify RocksDB state backend
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Verifying the state backend"
          echo "============================================================"

          echo
          echo "Checking that no SQLite backend remains..."

          if grep -Rni --include='*.rs' --include='*.toml' 'rusqlite' crates Cargo.toml \
            >/tmp/sqlite-refs.txt 2>/dev/null; then
            cat /tmp/sqlite-refs.txt
            echo
            echo "ERROR: rusqlite references remain after the RocksDB migration." >&2
            exit 1
          fi
          echo "No rusqlite references."

          if grep -Rn --include='*.rs' --include='*.sql' 'CREATE TABLE' crates \
            >/tmp/sql-schema.txt 2>/dev/null; then
            cat /tmp/sql-schema.txt
            echo
            echo "ERROR: SQL schema definitions remain after the RocksDB migration." >&2
            exit 1
          fi
          echo "No SQL schema definitions."

          echo
          echo "Checking the RocksDB dependency..."

          grep -n 'rocksdb' Cargo.toml
          grep -n 'rocksdb' crates/state/Cargo.toml

          echo
          echo "Column families declared in code:"
          sed -n '/pub const COLUMN_FAMILIES/,/];/p' crates/state/src/db.rs

          echo
          echo "Checking that the canonical tip is written in the commit batch..."
          grep -Fq 'w.put_meta(db::META_TIP_HASH' crates/state/src/lib.rs
          grep -Fq 'fn stage_rollback' crates/state/src/lib.rs

          echo
          echo "Checking the Android database path is a directory, not a file..."
          grep -n 'ycash-node.rocksdb' \
            android-app/app/src/main/java/com/ycash/androidnode/NodeService.java

          if grep -Rn 'ycash-node.sqlite' \
            android-app/app/src/main/java crates >/tmp/old-db-path.txt 2>/dev/null; then
            cat /tmp/old-db-path.txt
            echo
            echo "ERROR: the old SQLite database path is still referenced." >&2
            exit 1
          fi

          echo
          echo "RocksDB state backend verified."

      # ------------------------------------------------------------
      # 11. ANDROID ARM64 TOOLCHAIN CONFIGURATION
      # ------------------------------------------------------------
      - name: Configure Android ARM64 linker
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Configuring Android ARM64 toolchain"
          echo "============================================================"

          NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK}"

          if [[ ! -d "$NDK_ROOT" ]]; then
            echo "ERROR: Requested NDK does not exist:"
            echo "$NDK_ROOT"
            exit 1
          fi

          TOOLCHAIN="${NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin"

          if [[ ! -d "$TOOLCHAIN" ]]; then
            echo "ERROR: LLVM toolchain directory does not exist:"
            echo "$TOOLCHAIN"
            exit 1
          fi

          SYSROOT="${NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/sysroot"

          if [[ ! -d "$SYSROOT" ]]; then
            echo "ERROR: NDK sysroot does not exist:"
            echo "$SYSROOT"
            exit 1
          fi

          CLANG="${TOOLCHAIN}/aarch64-linux-android${ANDROID_API}-clang"
          CLANGXX="${TOOLCHAIN}/aarch64-linux-android${ANDROID_API}-clang++"
          AR="${TOOLCHAIN}/llvm-ar"
          RANLIB="${TOOLCHAIN}/llvm-ranlib"
          STRIP="${TOOLCHAIN}/llvm-strip"

          echo
          echo "Checking Android LLVM tools..."

          if [[ ! -x "$CLANG" ]]; then
            echo "ERROR: Android ARM64 Clang not found:"
            echo "$CLANG"
            echo
            echo "Available ARM64 Clang executables:"

            find "$TOOLCHAIN" \
              -maxdepth 1 \
              -type f \
              -name 'aarch64-linux-android*clang*' \
              -printf '%f\n' \
              | sort

            exit 1
          fi

          # RocksDB is C++: the Android clang++ driver is now required too.
          test -x "$CLANGXX"
          test -x "$AR"
          test -x "$RANLIB"
          test -x "$STRIP"

          echo
          echo "FOUND:"
          echo "  $CLANG"
          echo "  $CLANGXX"
          echo "  $AR"
          echo "  $RANLIB"
          echo "  $STRIP"
          echo "  $SYSROOT"

          TOOL_WRAPPER_DIR="$RUNNER_TEMP/android-aarch64-tools"

          rm -rf "$TOOL_WRAPPER_DIR"
          mkdir -p "$TOOL_WRAPPER_DIR"

          cat > "$TOOL_WRAPPER_DIR/aarch64-linux-android-ar" <<EOF
          #!/usr/bin/env bash
          exec "$AR" "\$@"
          EOF

          cat > "$TOOL_WRAPPER_DIR/aarch64-linux-android-ranlib" <<EOF
          #!/usr/bin/env bash
          exec "$RANLIB" "\$@"
          EOF

          cat > "$TOOL_WRAPPER_DIR/aarch64-linux-android-strip" <<EOF
          #!/usr/bin/env bash
          exec "$STRIP" "\$@"
          EOF

          cat > "$TOOL_WRAPPER_DIR/aarch64-linux-android-clang" <<EOF
          #!/usr/bin/env bash
          exec "$CLANG" "\$@"
          EOF

          cat > "$TOOL_WRAPPER_DIR/aarch64-linux-android-clang++" <<EOF
          #!/usr/bin/env bash
          exec "$CLANGXX" "\$@"
          EOF

          cat > "$TOOL_WRAPPER_DIR/aarch64-linux-android${ANDROID_API}-clang" <<EOF
          #!/usr/bin/env bash
          exec "$CLANG" "\$@"
          EOF

          cat > "$TOOL_WRAPPER_DIR/aarch64-linux-android${ANDROID_API}-clang++" <<EOF
          #!/usr/bin/env bash
          exec "$CLANGXX" "\$@"
          EOF

          chmod +x \
            "$TOOL_WRAPPER_DIR/aarch64-linux-android-ar" \
            "$TOOL_WRAPPER_DIR/aarch64-linux-android-ranlib" \
            "$TOOL_WRAPPER_DIR/aarch64-linux-android-strip" \
            "$TOOL_WRAPPER_DIR/aarch64-linux-android-clang" \
            "$TOOL_WRAPPER_DIR/aarch64-linux-android-clang++" \
            "$TOOL_WRAPPER_DIR/aarch64-linux-android${ANDROID_API}-clang" \
            "$TOOL_WRAPPER_DIR/aarch64-linux-android${ANDROID_API}-clang++"

          echo
          echo "============================================================"
          echo "Android ARM64 wrapper tools"
          echo "============================================================"

          ls -la "$TOOL_WRAPPER_DIR"

          export PATH="$TOOL_WRAPPER_DIR:$TOOLCHAIN:$PATH"

          echo "$TOOL_WRAPPER_DIR" >> "$GITHUB_PATH"
          echo "$TOOLCHAIN" >> "$GITHUB_PATH"

          {
            echo "ANDROID_NDK_HOME=$NDK_ROOT"
            echo "NDK_ROOT=$NDK_ROOT"
            echo "ANDROID_NDK_ROOT=$NDK_ROOT"
            echo "ANDROID_NDK_SYSROOT=$SYSROOT"
            echo "AR_aarch64_linux_android=$AR"
            echo "RANLIB_aarch64_linux_android=$RANLIB"
            echo "CC_aarch64_linux_android=$CLANG"
            echo "CXX_aarch64_linux_android=$CLANGXX"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$CLANG"
            # tools/build-android-arm64.sh appends -static-libstdc++ to this
            # value, so libc++ is linked into the executable and no
            # libc++_shared.so has to be packaged beside it.
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS=-C link-arg=-Wl,--gc-sections"
          } >> "$GITHUB_ENV"

          echo
          echo "============================================================"
          echo "Writing Cargo target configuration"
          echo "============================================================"

          mkdir -p "$HOME/.cargo"

          # No [target.*] rustflags here: the environment variable set above
          # would override them silently, which is how the static libc++ flag
          # would otherwise get lost.
          cat > "$HOME/.cargo/config.toml" <<EOF
          [target.aarch64-linux-android]
          linker = "${CLANG}"
          ar = "${AR}"
          EOF

          echo
          echo "Cargo configuration:"
          cat "$HOME/.cargo/config.toml"

          echo
          echo "============================================================"
          echo "Verifying target-prefixed tools"
          echo "============================================================"

          command -v aarch64-linux-android-ar
          command -v aarch64-linux-android-ranlib
          command -v aarch64-linux-android-strip
          command -v aarch64-linux-android-clang
          command -v aarch64-linux-android-clang++
          command -v "aarch64-linux-android${ANDROID_API}-clang"

          echo
          echo "aarch64-linux-android-ar:"
          aarch64-linux-android-ar --version | sed -n '1,5p'

          echo
          echo "aarch64-linux-android-ranlib:"
          aarch64-linux-android-ranlib --version | sed -n '1,5p'

          echo
          echo "aarch64-linux-android-strip:"
          aarch64-linux-android-strip --version | sed -n '1,5p'

          echo
          echo "ARM64 Clang:"
          aarch64-linux-android-clang --version | sed -n '1,5p'

          echo
          echo "ARM64 Clang++:"
          aarch64-linux-android-clang++ --version | sed -n '1,5p'

          echo
          echo "API-level ARM64 Clang:"
          "aarch64-linux-android${ANDROID_API}-clang" --version | sed -n '1,5p'

          echo
          echo "Android ARM64 toolchain configuration completed."

      # ------------------------------------------------------------
      # 12. VERIFY NDK USED BY BUILD SCRIPT
      # ------------------------------------------------------------
      - name: Verify Android NDK selected by build
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Verifying Android NDK selection"
          echo "============================================================"

          echo
          echo "ANDROID_SDK_ROOT:"
          echo "${ANDROID_SDK_ROOT}"

          echo
          echo "ANDROID_NDK:"
          echo "${ANDROID_NDK}"

          echo
          echo "ANDROID_NDK_HOME:"
          echo "${ANDROID_NDK_HOME:-<not set>}"

          echo
          echo "ANDROID_NDK_ROOT:"
          echo "${ANDROID_NDK_ROOT:-<not set>}"

          echo
          echo "NDK sysroot (used by bindgen for the RocksDB headers):"
          echo "${ANDROID_NDK_SYSROOT:-<not set>}"
          test -d "${ANDROID_NDK_SYSROOT}"

          echo
          echo "LIBCLANG_PATH:"
          echo "${LIBCLANG_PATH:-<not set>}"
          test -d "${LIBCLANG_PATH}"

          echo
          echo "Requested NDK directory:"
          ls -ld "${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK}"

          echo
          echo "Installed NDKs:"
          find "${ANDROID_SDK_ROOT}/ndk" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            -printf '%f\n' \
            | sort

          echo
          echo "Build script NDK references:"

          grep -nEi \
            'ANDROID_NDK|NDK_ROOT|ANDROID_NDK_HOME|ANDROID_NDK_ROOT|ndk/' \
            tools/build-android-arm64.sh \
            || true

          echo
          echo "Build script RocksDB cross-compilation setup:"

          grep -nEi \
            'BINDGEN_EXTRA_CLANG_ARGS|CXXSTDLIB|static-libstdc\+\+|libclang|llvm-ar' \
            tools/build-android-arm64.sh \
            || true

      # ------------------------------------------------------------
      # 13. SOURCE / NETWORKING CHECKS
      # ------------------------------------------------------------
      - name: Verify node networking and protocol sources
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Ycash node networking source..."

          grep -RniE \
            '8833|8832|8834|9067' \
            crates/ycash-android-node \
            >/tmp/ports.txt || true

          cat /tmp/ports.txt || true

          echo
          echo "Checking protocol version..."

          grep -Rni \
            '270013' \
            crates/ycash-android-node \
            >/tmp/protocol.txt || true

          cat /tmp/protocol.txt || true

          echo
          echo "Checking getheaders/getdata..."

          grep -RniE \
            'getheaders|getdata' \
            crates/ycash-android-node \
            >/tmp/p2p_commands.txt || true

          cat /tmp/p2p_commands.txt || true

          echo
          echo "Checking lightwallet RPC methods..."

          grep -RniE \
            'CompactTxStreamer|GetLatestBlock|GetBlockRange|GetLightdInfo' \
            crates/ycash-android-node \
            >/tmp/lightwallet.txt || true

          cat /tmp/lightwallet.txt || true

          echo
          echo "Checking TcpListenerStream..."

          grep -Rni \
            'TcpListenerStream' \
            crates/ycash-android-node \
            >/tmp/tcpstream.txt || true

          cat /tmp/tcpstream.txt || true

          echo
          echo "Checking tokio-stream net feature..."

          grep -Rni \
            'tokio-stream' \
            Cargo.toml \
            crates \
            >/tmp/tokio-stream.txt || true

          cat /tmp/tokio-stream.txt || true

          echo
          echo "Checking for accidental drop(listener)..."

          if grep -Rni \
            'drop(listener)' \
            crates/ycash-android-node \
            >/tmp/drop-listener.txt 2>/dev/null; then

            cat /tmp/drop-listener.txt

            echo
            echo "ERROR: Found drop(listener)." >&2
            exit 1
          else
            echo "No drop(listener) found."
          fi

      # ------------------------------------------------------------
      # 14. ANDROID RUNTIME SOURCE CHECKS
      # ------------------------------------------------------------
      - name: Verify Android runtime integration
        shell: bash
        run: |
          set -euo pipefail

          RUNTIME_DIR="android-app/app/src/main"

          echo "Checking nativeLibraryDir..."
          grep -Rni 'nativeLibraryDir' "$RUNTIME_DIR"

          echo
          echo "Checking libycashandroidnode.so..."
          grep -Rni 'libycashandroidnode.so' "$RUNTIME_DIR"

          echo
          echo "Checking ProcessBuilder..."
          grep -Rni 'ProcessBuilder' "$RUNTIME_DIR"

          echo
          echo "Checking node.log..."
          grep -Rni 'node.log' "$RUNTIME_DIR"

          echo
          echo "Checking redirectErrorStream..."
          grep -Rni 'redirectErrorStream' "$RUNTIME_DIR"

          echo
          echo "Checking node ports..."
          grep -RniE '8833|8832|8834|9067' "$RUNTIME_DIR"

          echo
          echo "Checking arm64-v8a..."
          grep -Rni 'arm64-v8a' android-app

          echo
          echo "Checking doNotStrip..."
          grep -Rni 'doNotStrip' android-app

          echo
          echo "Checking extractNativeLibs..."
          grep -Rni 'extractNativeLibs' android-app

          echo
          echo "Checking Android cleartext traffic configuration..."

          MANIFEST="android-app/app/src/main/AndroidManifest.xml"

          if grep -Fni \
            'android:usesCleartextTraffic="true"' \
            "$MANIFEST"; then

            echo "Android cleartext traffic is explicitly enabled."
          else
            echo "ERROR: android:usesCleartextTraffic=\"true\" was not found in AndroidManifest.xml." >&2
            exit 1
          fi

      # ------------------------------------------------------------
      # 15. CRASH-SAFE DIAGNOSTICS CHECKS
      # ------------------------------------------------------------
      - name: Verify crash-safe diagnostics
        shell: bash
        run: |
          set -euo pipefail

          APP_SRC="android-app/app/src/main"

          echo "Checking refreshDeviceStatsSafe..."
          grep -Rni 'refreshDeviceStatsSafe' "$APP_SRC"

          echo
          echo "Checking refreshNodeLog..."
          grep -Rni 'refreshNodeLog' "$APP_SRC"

          echo
          echo "Checking refreshAppErrorLog..."
          grep -Rni 'refreshAppErrorLog' "$APP_SRC"

          echo
          echo "Checking safeSetText..."
          grep -Rni 'safeSetText' "$APP_SRC"

          echo
          echo "Checking writeAppError..."
          grep -Rni 'writeAppError' "$APP_SRC"

          echo
          echo "Checking app-error.log..."
          grep -Rni 'app-error.log' "$APP_SRC"

          echo
          echo "Checking UNCAUGHT EXCEPTION..."
          grep -Rni 'UNCAUGHT EXCEPTION' "$APP_SRC"

          echo
          echo "Checking DIAGNOSTICS CLICK..."
          grep -Rni 'DIAGNOSTICS CLICK' "$APP_SRC"

      # ------------------------------------------------------------
      # 16. CLEAN NATIVE PACKAGE
      # ------------------------------------------------------------
      - name: Clean native package directory
        shell: bash
        run: |
          set -euo pipefail

          rm -rf android-app/app/src/main/jniLibs

          mkdir -p \
            android-app/app/src/main/jniLibs/${ANDROID_ABI}

          echo "Native package directory prepared."

      # ------------------------------------------------------------
      # 18. FINAL TOOLCHAIN CHECK
      # ------------------------------------------------------------
      - name: Final Android ARM64 toolchain check
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Final Android ARM64 toolchain check"
          echo "============================================================"

          echo
          echo "Target:"
          echo "${RUST_TARGET}"

          echo
          echo "CC:"
          command -v aarch64-linux-android-clang

          echo
          echo "CXX:"
          command -v aarch64-linux-android-clang++

          echo
          echo "AR:"
          command -v aarch64-linux-android-ar

          echo
          echo "RANLIB:"
          command -v aarch64-linux-android-ranlib

          echo
          echo "STRIP:"
          command -v aarch64-linux-android-strip

          echo
          echo "Resolved tool paths:"
          readlink -f "$(command -v aarch64-linux-android-clang)"
          readlink -f "$(command -v aarch64-linux-android-clang++)"
          readlink -f "$(command -v aarch64-linux-android-ar)"
          readlink -f "$(command -v aarch64-linux-android-ranlib)"
          readlink -f "$(command -v aarch64-linux-android-strip)"

          echo
          echo "bindgen / RocksDB environment:"
          echo "  LIBCLANG_PATH=${LIBCLANG_PATH:-<not set>}"
          echo "  ANDROID_NDK_SYSROOT=${ANDROID_NDK_SYSROOT:-<not set>}"
          echo "  CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS=${CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS:-<not set>}"

          echo
          echo "Rust target:"
          rustup target list --installed

          echo
          echo "Cargo target configuration:"
          cat "$HOME/.cargo/config.toml"

          echo
          echo "NDK:"
          echo "${ANDROID_NDK_HOME}"

          echo
          echo "Final toolchain check passed."

      # ------------------------------------------------------------
      # 19. BUILD ANDROID ARM64 NATIVE NODE
      # ------------------------------------------------------------
      - name: Build Android ARM64 native node
        shell: bash
        run: |
          set -uo pipefail

          echo "============================================================"
          echo "Building Android ARM64 native Ycash node"
          echo "============================================================"

          echo
          echo "Environment:"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          echo "ANDROID_NDK=${ANDROID_NDK}"
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME:-}"
          echo "RUST_TARGET=${RUST_TARGET}"
          echo "ANDROID_ABI=${ANDROID_ABI}"
          echo "LIBCLANG_PATH=${LIBCLANG_PATH:-}"

          echo
          echo "NOTE: this step cross-compiles the RocksDB C++ sources for"
          echo "      ARM64. On a cold cache that takes several minutes."

          echo
          echo "============================================================"
          echo "Checking native build scripts"
          echo "============================================================"

          test -f tools/build-android-arm64.sh
          test -f tools/package-node-binary.sh

          echo
          echo "Build script before chmod:"
          ls -lh tools/build-android-arm64.sh

          echo
          echo "Package script before chmod:"
          ls -lh tools/package-node-binary.sh

          echo
          echo "============================================================"
          echo "Restoring executable permissions"
          echo "============================================================"

          chmod +x \
            tools/build-android-arm64.sh \
            tools/package-node-binary.sh

          echo
          echo "Native build scripts after chmod:"
          ls -l \
            tools/build-android-arm64.sh \
            tools/package-node-binary.sh

          echo
          echo "Verifying executable permissions..."

          test -x tools/build-android-arm64.sh
          test -x tools/package-node-binary.sh

          echo
          echo "Executable permissions verified."

          echo
          echo "============================================================"
          echo "Starting Android ARM64 native build"
          echo "============================================================"

          bash -x tools/build-android-arm64.sh \
            2>&1 | tee android-arm64-build.log

          status=${PIPESTATUS[0]}

          echo
          echo "============================================================"
          echo "Android ARM64 build exit code: $status"
          echo "============================================================"

          if [[ "$status" -ne 0 ]]; then
            exit "$status"
          fi

          echo
          echo "============================================================"
          echo "Checking native build outputs"
          echo "============================================================"

          CARGO_BINARY="target/${RUST_TARGET}/release/ycash-android-node"
          NATIVE_LIB="android-app/app/src/main/jniLibs/${ANDROID_ABI}/libycashandroidnode.so"

          test -f "$CARGO_BINARY"
          test -f "$NATIVE_LIB"

          echo
          echo "Cargo executable:"
          ls -lh "$CARGO_BINARY"

          echo
          echo "Cargo executable type:"
          file "$CARGO_BINARY"

          echo
          echo "Android native library:"
          ls -lh "$NATIVE_LIB"

          echo
          echo "Android native library type:"
          file "$NATIVE_LIB"

          echo
          echo "Native build and packaging completed successfully."

      # ------------------------------------------------------------
      # 20. ALWAYS UPLOAD NATIVE BUILD LOG
      # ------------------------------------------------------------
      - name: Upload Android ARM64 build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ycash-android-arm64-build-log
          path: android-arm64-build.log
          if-no-files-found: warn

      # ------------------------------------------------------------
      # 21. VERIFY BUILT ARM64 NATIVE LIBRARY
      # ------------------------------------------------------------
      - name: Verify Android ARM64 native library
        shell: bash
        run: |
          set -euo pipefail

          CARGO_BINARY="target/${RUST_TARGET}/release/ycash-android-node"
          NATIVE_LIB="android-app/app/src/main/jniLibs/${ANDROID_ABI}/libycashandroidnode.so"

          test -f "$CARGO_BINARY"
          test -f "$NATIVE_LIB"

          echo "Cargo executable:"
          ls -lh "$CARGO_BINARY"

          echo
          echo "Cargo executable type:"
          file "$CARGO_BINARY"

          echo
          echo "Android packaged native library:"
          ls -lh "$NATIVE_LIB"

          echo
          echo "Native library type:"
          file "$NATIVE_LIB"

          echo
          echo "Reading ELF header..."

          readelf -h "$NATIVE_LIB" | sed -n '1,80p'

          echo
          echo "Checking ELF machine architecture..."

          ELF_MACHINE="$(
            readelf -h "$NATIVE_LIB" |
            awk -F: '/Machine:/ {print $2}' |
            xargs
          )"

          echo "ELF machine: $ELF_MACHINE"

          if [[ "$ELF_MACHINE" != *"AArch64"* ]]; then
            echo "ERROR: Native library is not AArch64." >&2
            exit 1
          fi

          echo
          echo "Checking packaged file is an ELF executable..."

          FILE_DESC="$(file -b "$NATIVE_LIB")"

          echo "$FILE_DESC"

          case "$FILE_DESC" in
            *ELF*executable*|*ELF*pie*executable*)
              echo "ELF executable verified."
              ;;
            *)
              echo "ERROR: Packaged native library is not an ELF executable." >&2
              exit 1
              ;;
          esac

          echo
          echo "============================================================"
          echo "Checking shared library dependencies"
          echo "============================================================"

          # RocksDB pulls in libc++. The build links it statically, so nothing
          # named libc++_shared.so may appear here: the node ships as a single
          # executable and nothing else would be packaged beside it.
          NEEDED="$(readelf -d "$NATIVE_LIB" | awk '/NEEDED/ {print $NF}' | tr -d '[]')"

          echo "$NEEDED"

          if grep -Fq 'libc++_shared.so' <<< "$NEEDED"; then
            echo
            echo "ERROR: the node links libc++_shared.so, which is not packaged in the APK." >&2
            echo "       tools/build-android-arm64.sh must link libc++ statically." >&2
            exit 1
          fi

          echo
          echo "No shared libc++ dependency."

          echo
          echo "AArch64 Android native library verified successfully."

      # ------------------------------------------------------------
      # 22. VERIFY NATIVE LIBRARY PACKAGE
      # ------------------------------------------------------------
      - name: Verify native ARM64 library package
        shell: bash
        run: |
          set -euo pipefail

          CARGO_BINARY="target/${RUST_TARGET}/release/ycash-android-node"
          PACKAGED_LIB="android-app/app/src/main/jniLibs/${ANDROID_ABI}/libycashandroidnode.so"

          test -f "$CARGO_BINARY"
          test -f "$PACKAGED_LIB"

          echo "Cargo executable:"
          ls -lh "$CARGO_BINARY"

          echo
          echo "Packaged Android native library:"
          ls -lh "$PACKAGED_LIB"

          echo
          echo "Cargo executable SHA256:"
          sha256sum "$CARGO_BINARY"

          echo
          echo "Packaged native library SHA256:"
          sha256sum "$PACKAGED_LIB"

          echo
          echo "Checking packaged native library permissions..."

          if [[ ! -x "$PACKAGED_LIB" ]]; then
            echo "ERROR: Packaged native library is not executable." >&2
            exit 1
          fi

          echo "Packaged native library executable permission verified."

          echo
          echo "Native ARM64 package verification completed."

      # ------------------------------------------------------------
      # 23. VERIFY ANDROID PACKAGE
      # ------------------------------------------------------------
      - name: Verify Android native package
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f tools/verify-android-package.sh ]]; then
            chmod +x tools/verify-android-package.sh
            bash tools/verify-android-package.sh
          else
            echo "WARNING: tools/verify-android-package.sh not found."
            echo "Performing basic package verification instead."

            test -f \
              "android-app/app/src/main/jniLibs/${ANDROID_ABI}/libycashandroidnode.so"
          fi

      # ------------------------------------------------------------
      # 24. SET UP GRADLE
      # ------------------------------------------------------------
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"

      # ------------------------------------------------------------
      # 25. BUILD DEBUG APK
      # ------------------------------------------------------------
      - name: Build Android debug APK
        working-directory: android-app
        shell: bash
        run: |
          set -euo pipefail

          gradle --version

          gradle \
            --no-daemon \
            --stacktrace \
            assembleDebug

      # ------------------------------------------------------------
      # 26. VERIFY DEBUG APK
      # ------------------------------------------------------------
      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail

          APK="android-app/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "Debug APK:"
          ls -lh "$APK"

          APK_LISTING="$(unzip -l "$APK")"

          echo "$APK_LISTING"

          if grep -Fq \
            "lib/${ANDROID_ABI}/libycashandroidnode.so" \
            <<< "$APK_LISTING"; then

            echo "Native ARM64 library found in APK."
          else
            echo "ERROR: Native ARM64 library is missing from APK." >&2
            exit 1
          fi

          echo
          echo "APK verification successful."

      # ------------------------------------------------------------
      # 27. CREATE TEMPORARY CI KEYSTORE
      # ------------------------------------------------------------
      - name: Create temporary CI signing keystore
        shell: bash
        run: |
          set -euo pipefail

          rm -f "$KEYSTORE_FILE"

          keytool \
            -genkeypair \
            -v \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Ycash CI,O=Ycash,OU=Android"

          test -f "$KEYSTORE_FILE"

          echo "Temporary CI keystore created."

      # ------------------------------------------------------------
      # 28. LOCATE ANDROID BUILD TOOLS
      # ------------------------------------------------------------
      - name: Locate Android signing tools
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Locating Android signing tools"
          echo "============================================================"

          BUILD_TOOLS="${ANDROID_SDK_ROOT}/build-tools/35.0.0"

          ZIPALIGN="${BUILD_TOOLS}/zipalign"
          APKSIGNER="${BUILD_TOOLS}/apksigner"

          echo
          echo "Build-tools directory:"
          echo "$BUILD_TOOLS"

          echo
          echo "Checking zipalign..."

          test -x "$ZIPALIGN"

          echo "zipalign found:"
          ls -lh "$ZIPALIGN"

          echo
          echo "============================================================"
          echo "zipalign usage"
          echo "============================================================"

          # zipalign does NOT support -h.
          # Running it without arguments prints its usage and exits non-zero.
          ZIPALIGN_OUTPUT="$("$ZIPALIGN" 2>&1 || true)"

          echo "$ZIPALIGN_OUTPUT"

          if ! grep -Fq "Zip alignment utility" <<< "$ZIPALIGN_OUTPUT"; then
            echo "ERROR: zipalign did not return expected utility information." >&2
            exit 1
          fi

          echo
          echo "zipalign verified successfully."

          echo
          echo "Checking apksigner..."

          test -x "$APKSIGNER"

          echo "apksigner found:"
          ls -lh "$APKSIGNER"

          echo
          echo "============================================================"
          echo "apksigner version"
          echo "============================================================"

          "$APKSIGNER" version

          echo
          echo "============================================================"
          echo "Android signing tools verified"
          echo "============================================================"

      # ------------------------------------------------------------
      # 29. ZIPALIGN APK
      # ------------------------------------------------------------
      - name: Zipalign debug APK
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS="${ANDROID_SDK_ROOT}/build-tools/35.0.0"

          INPUT_APK="android-app/app/build/outputs/apk/debug/app-debug.apk"
          ALIGNED_APK="android-app/app/build/outputs/apk/debug/app-debug-aligned.apk"

          rm -f "$ALIGNED_APK"

          "${BUILD_TOOLS}/zipalign" \
            -f \
            -p \
            4 \
            "$INPUT_APK" \
            "$ALIGNED_APK"

          test -f "$ALIGNED_APK"

          "${BUILD_TOOLS}/zipalign" \
            -c \
            -v \
            4 \
            "$ALIGNED_APK"

      # ------------------------------------------------------------
      # 30. SIGN APK
      # ------------------------------------------------------------
      - name: Sign Android APK
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS="${ANDROID_SDK_ROOT}/build-tools/35.0.0"

          ALIGNED_APK="android-app/app/build/outputs/apk/debug/app-debug-aligned.apk"
          SIGNED_APK="android-app/app/build/outputs/apk/debug/ycash-android-node-signed.apk"

          rm -f "$SIGNED_APK"

          "${BUILD_TOOLS}/apksigner" sign \
            --ks "$KEYSTORE_FILE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:${KEYSTORE_PASSWORD}" \
            --key-pass "pass:${KEY_PASSWORD}" \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          test -f "$SIGNED_APK"

          echo "Signed APK:"
          ls -lh "$SIGNED_APK"

      # ------------------------------------------------------------
      # 31. VERIFY SIGNED APK
      # ------------------------------------------------------------
      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS="${ANDROID_SDK_ROOT}/build-tools/35.0.0"

          SIGNED_APK="android-app/app/build/outputs/apk/debug/ycash-android-node-signed.apk"

          test -f "$SIGNED_APK"

          "${BUILD_TOOLS}/apksigner" \
            verify \
            --verbose \
            "$SIGNED_APK"

          echo
          echo "Signed APK signature verified."

          APK_LISTING="$(unzip -l "$SIGNED_APK")"

          if grep -Fq \
            "lib/${ANDROID_ABI}/libycashandroidnode.so" \
            <<< "$APK_LISTING"; then

            echo "Signed APK contains ARM64 native library."
          else
            echo "ERROR: Signed APK does not contain ARM64 native library." >&2
            exit 1
          fi

      # ------------------------------------------------------------
      # 32. FINAL SIGNED APK REGRESSION CHECK
      # ------------------------------------------------------------
      - name: Final signed APK regression verification
        shell: bash
        run: |
          set -euo pipefail

          CARGO_BINARY="target/${RUST_TARGET}/release/ycash-android-node"
          PACKAGED_LIB="android-app/app/src/main/jniLibs/${ANDROID_ABI}/libycashandroidnode.so"
          SIGNED_APK="android-app/app/build/outputs/apk/debug/ycash-android-node-signed.apk"

          test -f "$CARGO_BINARY"
          test -f "$PACKAGED_LIB"
          test -f "$SIGNED_APK"

          echo "Cargo executable:"
          ls -lh "$CARGO_BINARY"

          echo
          echo "Packaged native library:"
          ls -lh "$PACKAGED_LIB"

          echo
          echo "Native library type:"
          file "$PACKAGED_LIB"

          echo
          echo "Native package SHA256:"
          sha256sum "$PACKAGED_LIB"

          BUILD_TOOLS="${ANDROID_SDK_ROOT}/build-tools/35.0.0"

          echo
          echo "Verifying signed APK..."

          "${BUILD_TOOLS}/apksigner" \
            verify \
            "$SIGNED_APK"

          echo
          echo "Checking signed APK contents..."

          APK_LISTING="$(unzip -l "$SIGNED_APK")"

          if grep -Fq \
            "lib/${ANDROID_ABI}/libycashandroidnode.so" \
            <<< "$APK_LISTING"; then

            echo "Signed APK contains ARM64 native library."
          else
            echo "ERROR: Signed APK does not contain ARM64 native library." >&2
            exit 1
          fi

          echo
          echo "============================================================"
          echo "FINAL VERIFICATION PASSED"
          echo "============================================================"

          echo
          echo "Signed APK:"
          ls -lh "$SIGNED_APK"

          echo
          echo "SHA256:"
          sha256sum "$SIGNED_APK"

      # ------------------------------------------------------------
      # 33. UPLOAD FINAL APK
      # ------------------------------------------------------------
      - name: Upload signed APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: yortal-node-v${{ env.YORTAL_VERSION }}-signed
          path: android-app/app/build/outputs/apk/debug/ycash-android-node-signed.apk
          if-no-files-found: error

      # ------------------------------------------------------------
      # 34. UPLOAD RAW NATIVE NODE
      # ------------------------------------------------------------
      - name: Upload raw Android ARM64 native node
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: yortal-node-v${{ env.YORTAL_VERSION }}-arm64-native
          path: android-app/app/src/main/jniLibs/${{ env.ANDROID_ABI }}/libycashandroidnode.so
          if-no-files-found: error

      # ------------------------------------------------------------
      # 35. UPLOAD DIAGNOSTIC SOURCE FILES
      # ------------------------------------------------------------
      - name: Upload diagnostic source files
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ycash-android-node-diagnostics
          path: |
            android-arm64-build.log
            crates/ycash-android-node/src/main.rs
            crates/ycash-android-node/src/runtime.rs
            crates/ycash-android-node/src/pipeline_sync.rs
            crates/consensus/src/lib.rs
            config/pipeline.toml
            crates/state/src/lib.rs
            crates/state/src/db.rs
            crates/state/src/chainstate.rs
            crates/state/Cargo.toml
            Cargo.toml
            tools/build-android-arm64.sh
            BUILD_ID.txt
            *.md
            android-app/app/src/main/java/com/ycash/androidnode/MainActivity.java
            android-app/app/src/main/java/com/ycash/androidnode/NodeService.java
          if-no-files-found: warn

      # ------------------------------------------------------------
      # 36. CLEAN TEMPORARY SIGNING MATERIAL
      # ------------------------------------------------------------
      - name: Clean temporary signing material
        if: always()
        shell: bash
        run: |
          set +e

          rm -f "$KEYSTORE_FILE"

          echo "Temporary signing material cleaned."

          true
