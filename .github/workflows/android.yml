name: Build Ycash Android Node

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  ANDROID_API: "35"
  ANDROID_NDK: "27.2.12479018"
  RUST_TARGET: "aarch64-linux-android"
  VCPKG_TRIPLET: "arm64-android"

  # Pinned vcpkg environment for reproducible dependency builds.
  # Change only deliberately when updating the dependency environment.
  VCPKG_COMMIT: "2025.12.12"

  CI_KEY_ALIAS: "ycash-temp"
  CI_KEYSTORE_PASSWORD: "temporary123"
  CI_KEY_PASSWORD: "temporary123"

  # Network/build resilience.
  GIT_TERMINAL_PROMPT: "0"
  VCPKG_DISABLE_METRICS: "1"

jobs:
  build:
    name: Build Android ARM64 Ycash Node
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          retry-fetches: true

      # ============================================================
      # 2. FIND AND EXTRACT PROJECT ZIP
      # ============================================================
      - name: Find project ZIP
        id: find_zip
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find "$GITHUB_WORKSPACE" \
            -maxdepth 1 \
            -type f \
            -iname '*.zip' \
            -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "::error::No ZIP file found in repository root."
            exit 1
          fi

          echo "Using ZIP: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/extracted"
          mkdir -p "$GITHUB_WORKSPACE/extracted"

          unzip -q -o \
            "${{ steps.find_zip.outputs.zip }}" \
            -d "$GITHUB_WORKSPACE/extracted"

          echo "===== Extracted files ====="

          find "$GITHUB_WORKSPACE/extracted" \
            -maxdepth 5 \
            -type f \
            | sort \
            | head -300

      # ============================================================
      # 3. LOCATE ANDROID PROJECT
      # ============================================================
      - name: Locate Android project
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="$(find "$GITHUB_WORKSPACE/extracted" \
            -name settings.gradle.kts \
            -type f \
            -print -quit)"

          if [ -z "$PROJECT" ]; then
            echo "::error::Could not find settings.gradle.kts."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT")"
          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"

          echo "Android project: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 4. CREATE DEFAULT YCASH CONFIG
      # ============================================================
      - name: Create default ycash.conf
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          CONFIG_DIR="app/src/main/assets/ycash"
          CONFIG_FILE="$CONFIG_DIR/ycash.conf"

          mkdir -p "$CONFIG_DIR"

          cat > "$CONFIG_FILE" <<'EOF'
          # ============================================================
          # Ycash Android Node Configuration
          # ============================================================

          server=1
          listen=1

          rpcbind=127.0.0.1
          rpcallowip=127.0.0.1

          txindex=1
          EOF

          test -f "$CONFIG_FILE"

          echo "===== DEFAULT YCASH CONFIG ====="
          cat "$CONFIG_FILE"

      # ============================================================
      # 5. FIX JVM TARGETS
      # ============================================================
      - name: Fix Kotlin/Java JVM target mismatch
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_FILE="app/build.gradle.kts"

          if [ ! -f "$GRADLE_FILE" ]; then
            echo "::error::$GRADLE_FILE not found."
            exit 1
          fi

          if grep -q "compileOptions" "$GRADLE_FILE"; then
            echo "compileOptions already present."
          else
            python3 - "$GRADLE_FILE" <<'PYEOF'
          import sys

          path = sys.argv[1]

          with open(path, encoding="utf-8") as f:
              content = f.read()

          patch = r'''
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          '''

          marker = "buildFeatures { buildConfig = true }"

          if marker in content:
              content = content.replace(
                  marker,
                  marker + "\n" + patch,
                  1
              )
          elif "\ndependencies" in content:
              content = content.replace(
                  "\n}\n\ndependencies",
                  "\n" + patch + "\n}\n\ndependencies",
                  1
              )

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          PYEOF
          fi

      # ============================================================
      # 6. SET UP JAVA
      # ============================================================
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ============================================================
      # 7. ANDROID SDK / NDK
      # ============================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages with retry
        shell: bash
        run: |
          set -euo pipefail

          retry() {
            local attempts=5
            local delay=10
            local n=1

            until "$@"; do
              if [ "$n" -ge "$attempts" ]; then
                echo "::error::Command failed after $attempts attempts."
                return 1
              fi

              echo "Attempt $n failed. Retrying in ${delay}s..."
              sleep "$delay"

              n=$((n + 1))
              delay=$((delay * 2))
            done
          }

          retry sdkmanager "platform-tools"
          retry sdkmanager "platforms;android-${ANDROID_API}"
          retry sdkmanager "build-tools;35.0.0"
          retry sdkmanager "ndk;${ANDROID_NDK}"

          yes | sdkmanager --licenses >/dev/null || true

      # ============================================================
      # 8. RUST
      # ============================================================
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.RUST_TARGET }}

      # ============================================================
      # 9. LOCATE YCASHD
      # ============================================================
      - name: Locate ycashd source
        id: ycashd
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="$(
            find "$GITHUB_WORKSPACE/extracted" \
              -type f \
              -name configure.ac \
              -path '*ycashd*' \
              -print -quit || true
          )"

          if [ -z "$SOURCE" ]; then
            SOURCE="$(
              find "$GITHUB_WORKSPACE/extracted" \
                -type f \
                -name configure.ac \
                -print -quit || true
            )"
          fi

          if [ -z "$SOURCE" ]; then
            echo "::error::Could not locate ycashd source."
            exit 1
          fi

          YDIR="$(dirname "$SOURCE")"
          YDIR="$(cd "$YDIR" && pwd)"

          echo "ycashd source: $YDIR"
          echo "ycashd_dir=$YDIR" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 10. INSPECT SOURCE
      # ============================================================
      - name: Inspect source tree
        shell: bash
        run: |
          set -euo pipefail

          YDIR="${{ steps.ycashd.outputs.ycashd_dir }}"

          ls -la "$YDIR"

          test -f "$YDIR/configure.ac"
          test -f "$YDIR/Makefile.am"

      # ============================================================
      # 11. ANDROID ARM64 TOOLCHAIN
      # ============================================================
      - name: Configure Android ARM64 environment
        shell: bash
        run: |
          set -euo pipefail

          NDK="$ANDROID_HOME/ndk/$ANDROID_NDK"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          test -x "$TOOLCHAIN/aarch64-linux-android35-clang"
          test -x "$TOOLCHAIN/aarch64-linux-android35-clang++"

          echo "CC=$TOOLCHAIN/aarch64-linux-android35-clang" >> "$GITHUB_ENV"
          echo "CXX=$TOOLCHAIN/aarch64-linux-android35-clang++" >> "$GITHUB_ENV"
          echo "AR=$TOOLCHAIN/llvm-ar" >> "$GITHUB_ENV"
          echo "RANLIB=$TOOLCHAIN/llvm-ranlib" >> "$GITHUB_ENV"
          echo "STRIP=$TOOLCHAIN/llvm-strip" >> "$GITHUB_ENV"

          echo "$TOOLCHAIN" >> "$GITHUB_PATH"

          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"

      # ============================================================
      # 12. LOCATE MATCHING NDK LIBC++
      # ============================================================
      - name: Locate matching NDK libc++ runtime
        id: libcxx
        shell: bash
        run: |
          set -euo pipefail

          NDK="$ANDROID_NDK_HOME"

          LIBCXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so"

          if [ ! -f "$LIBCXX" ]; then
            echo "::error::Matching libc++_shared.so was not found."

            find "$NDK" \
              -name libc++_shared.so \
              -type f \
              -print

            exit 1
          fi

          file "$LIBCXX"
          ls -lh "$LIBCXX"

          echo "libcxx=$LIBCXX" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 13. CARGO ANDROID LINKER
      # ============================================================
      - name: Point Cargo at the NDK linker
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.cargo"

          cat > "$HOME/.cargo/config.toml" <<EOF
          [target.aarch64-linux-android]
          linker = "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API}-clang"
          EOF

          cat "$HOME/.cargo/config.toml"

      # ============================================================
      # 14. INSTALL BUILD TOOLS
      # ============================================================
      - name: Install autotools and build utilities
        shell: bash
        run: |
          set -euo pipefail

          retry() {
            local attempts=5
            local delay=10
            local n=1

            until "$@"; do
              if [ "$n" -ge "$attempts" ]; then
                return 1
              fi

              sleep "$delay"
              n=$((n + 1))
              delay=$((delay * 2))
            done
          }

          retry sudo apt-get update

          retry sudo apt-get install -y \
            autoconf \
            autoconf-archive \
            automake \
            libtool \
            pkg-config \
            curl \
            unzip \
            git

      # ============================================================
      # 15. SET UP PINNED VCPKG
      # ============================================================
      - name: Set up pinned vcpkg
        shell: bash
        run: |
          set -euo pipefail

          VCPKG_DIR="$HOME/vcpkg"

          if [ -d "$VCPKG_DIR/.git" ]; then
            echo "Existing vcpkg checkout found."
          else
            echo "Cloning vcpkg..."

            git clone \
              --depth 1 \
              https://github.com/microsoft/vcpkg.git \
              "$VCPKG_DIR"
          fi

          cd "$VCPKG_DIR"

          echo "Checking out pinned vcpkg version: $VCPKG_COMMIT"

          git fetch \
            --depth 1 \
            origin \
            "$VCPKG_COMMIT"

          git checkout "$VCPKG_COMMIT"

          ./bootstrap-vcpkg.sh -disableMetrics

          echo "VCPKG_ROOT=$VCPKG_DIR" >> "$GITHUB_ENV"

          echo
          echo "===== VCPKG VERSION ====="
          ./vcpkg version

      # ============================================================
      # 16. CACHE VCPKG DOWNLOADS
      # ============================================================
      - name: Cache vcpkg downloads
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.VCPKG_ROOT }}/downloads
          key: vcpkg-downloads-${{ runner.os }}-${{ env.VCPKG_COMMIT }}
          restore-keys: |
            vcpkg-downloads-${{ runner.os }}-

      # ============================================================
      # 17. CACHE VCPKG INSTALLED PACKAGES
      # ============================================================
      - name: Cache vcpkg installed dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.VCPKG_ROOT }}/installed
            ${{ env.VCPKG_ROOT }}/buildtrees
          key: vcpkg-installed-${{ runner.os }}-${{ env.VCPKG_TRIPLET }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('**/vcpkg.json', '**/vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-installed-${{ runner.os }}-${{ env.VCPKG_TRIPLET }}-${{ env.VCPKG_COMMIT }}-
            vcpkg-installed-${{ runner.os }}-${{ env.VCPKG_TRIPLET }}-

      # ============================================================
      # 18. BUILD ANDROID DEPENDENCIES
      # ============================================================
      - name: Build Boost, libevent, libsodium for Android ARM64
        shell: bash
        run: |
          set -euo pipefail

          retry() {
            local attempts=5
            local delay=10
            local n=1

            until "$@"; do
              if [ "$n" -ge "$attempts" ]; then
                echo "::error::Dependency command failed after $attempts attempts."
                return 1
              fi

              echo "Dependency command failed. Retrying in ${delay}s..."
              sleep "$delay"

              n=$((n + 1))
              delay=$((delay * 2))
            done
          }

          retry "$VCPKG_ROOT/vcpkg" install \
            boost-system \
            boost-filesystem \
            boost-program-options \
            boost-thread \
            boost-chrono \
            boost-signals2 \
            boost-multi-index \
            boost-assign \
            boost-format \
            boost-iostreams \
            boost-interprocess \
            boost-math \
            boost-random \
            boost-uuid \
            boost-dynamic-bitset \
            boost-scope-exit \
            libevent \
            libsodium \
            --triplet "$VCPKG_TRIPLET" \
            --clean-after-build

          VCPKG_INSTALLED="$VCPKG_ROOT/installed/$VCPKG_TRIPLET"

          test -d "$VCPKG_INSTALLED/include/boost"
          test -f "$VCPKG_INSTALLED/include/sodium.h"

          echo "VCPKG_INSTALLED=$VCPKG_INSTALLED" >> "$GITHUB_ENV"

          echo
          echo "===== VCPKG INSTALLED ====="
          ls -la "$VCPKG_INSTALLED"

      # ============================================================
      # 19. VERIFY DEPENDENCIES BEFORE YCASH BUILD
      # ============================================================
      - name: Verify Android dependencies
        shell: bash
        run: |
          set -euo pipefail

          test -d "$VCPKG_INSTALLED/include/boost"
          test -f "$VCPKG_INSTALLED/include/sodium.h"

          test -d "$VCPKG_INSTALLED/lib"

          echo "Boost:"
          ls "$VCPKG_INSTALLED/lib" | grep boost | head -30 || true

          echo
          echo "libevent:"
          ls "$VCPKG_INSTALLED/lib" | grep event | head -30 || true

          echo
          echo "libsodium:"
          ls "$VCPKG_INSTALLED/lib" | grep sodium || true

          echo
          echo "Android dependencies verified."

      # ============================================================
      # 20. BUILD REAL YCASHD
      # ============================================================
      - name: Build ycashd for Android ARM64
        working-directory: ${{ steps.ycashd.outputs.ycashd_dir }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Starting Android ARM64 ycashd build..."

          find . -name "*.sh" -exec chmod +x {} +

          rustup show
          rustup target add aarch64-linux-android

          if [ -x ./autogen.sh ]; then
            ./autogen.sh
          fi

          export PKG_CONFIG_LIBDIR="$VCPKG_INSTALLED/lib/pkgconfig"
          unset PKG_CONFIG_PATH || true

          export CPPFLAGS="-I$VCPKG_INSTALLED/include"
          export LDFLAGS="-L$VCPKG_INSTALLED/lib"

          ./configure \
            --host=aarch64-linux-android \
            --with-boost="$VCPKG_INSTALLED" \
            --enable-online-rust \
            --disable-wallet \
            --disable-mining \
            --disable-tests \
            --disable-bench

          make -j"$(nproc)"

      # ============================================================
      # 21. FIND YCASHD BINARY
      # ============================================================
      - name: Find ycashd binary
        id: binary
        shell: bash
        run: |
          set -euo pipefail

          YDIR="${{ steps.ycashd.outputs.ycashd_dir }}"

          BIN="$(
            find "$YDIR" \
              -type f \
              \( -name ycashd -o -name ycashd.exe \) \
              -perm -111 \
              -print -quit || true
          )"

          if [ -z "$BIN" ]; then
            echo "::error::Android ARM64 ycashd binary was not produced."

            find "$YDIR" \
              -type f \
              -perm -111 \
              | head -100

            exit 1
          fi

          BIN="$(cd "$(dirname "$BIN")" && pwd)/$(basename "$BIN")"

          file "$BIN"
          ls -lh "$BIN"

          echo "binary=$BIN" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 22. INSPECT YCASHD ELF DEPENDENCIES
      # ============================================================
      - name: Inspect ycashd native dependencies
        shell: bash
        run: |
          set -euo pipefail

          BIN="${{ steps.binary.outputs.binary }}"

          file "$BIN"

          echo "===== DT_NEEDED ====="

          readelf -d "$BIN" \
            | grep "NEEDED" \
            || true

      # ============================================================
      # 23. PACKAGE YCASHD + MATCHING LIBC++
      # ============================================================
      - name: Package ycashd and libc++ into Android application
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.locate.outputs.project_dir }}"
          BIN="${{ steps.binary.outputs.binary }}"
          LIBCXX="${{ steps.libcxx.outputs.libcxx }}"

          JNI_DIR="$PROJECT/app/src/main/jniLibs/arm64-v8a"

          mkdir -p "$JNI_DIR"

          rm -f "$JNI_DIR/libycashd.so"
          rm -f "$JNI_DIR/libc++_shared.so"

          cp "$BIN" "$JNI_DIR/libycashd.so"

          if [ -x "${STRIP:-}" ]; then
            "$STRIP" --strip-unneeded "$JNI_DIR/libycashd.so"
          fi

          chmod 755 "$JNI_DIR/libycashd.so"

          cp "$LIBCXX" "$JNI_DIR/libc++_shared.so"

          chmod 644 "$JNI_DIR/libc++_shared.so"

          test -f "$JNI_DIR/libycashd.so"
          test -f "$JNI_DIR/libc++_shared.so"

          echo "===== PACKAGED NATIVE LIBRARIES ====="

          ls -lh "$JNI_DIR/libycashd.so"
          ls -lh "$JNI_DIR/libc++_shared.so"

      # ============================================================
      # 24. VERIFY PACKAGED NATIVE LIBRARIES
      # ============================================================
      - name: Verify packaged native libraries
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.locate.outputs.project_dir }}"

          DAEMON="$PROJECT/app/src/main/jniLibs/arm64-v8a/libycashd.so"
          LIBCXX="$PROJECT/app/src/main/jniLibs/arm64-v8a/libc++_shared.so"

          test -f "$DAEMON"
          test -f "$LIBCXX"

          file "$DAEMON"
          file "$LIBCXX"

          readelf -d "$DAEMON" \
            | grep "NEEDED" \
            || true

      # ============================================================
      # 25. VERIFY PACKAGED YCASHD
      # ============================================================
      - name: Verify packaged ycashd
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.locate.outputs.project_dir }}"
          DAEMON="$PROJECT/app/src/main/jniLibs/arm64-v8a/libycashd.so"

          test -f "$DAEMON"
          test -x "$DAEMON"

          file "$DAEMON"

          if ! file "$DAEMON" | grep -qi "pie executable"; then
            echo "::error::ycashd is not a PIE executable."
            exit 1
          fi

      # ============================================================
      # 26. CONFIRM NATIVE LIBRARY PACKAGING SETTINGS
      # ============================================================
      - name: Confirm native library packaging
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="app/src/main/AndroidManifest.xml"
          GRADLE_FILE="app/build.gradle.kts"

          test -f "$MANIFEST"
          test -f "$GRADLE_FILE"

          if ! grep -q 'android:extractNativeLibs="true"' "$MANIFEST"; then
            echo "::error::extractNativeLibs=true was not found."
            exit 1
          fi

          if ! grep -q 'useLegacyPackaging = true' "$GRADLE_FILE"; then
            echo "::error::useLegacyPackaging=true was not found."
            exit 1
          fi

          echo "Native library packaging settings confirmed."

      # ============================================================
      # 27. VERIFY DEFAULT YCASH CONFIG
      # ============================================================
      - name: Verify default ycash.conf
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          CONFIG_FILE="app/src/main/assets/ycash/ycash.conf"

          test -f "$CONFIG_FILE"
          test -s "$CONFIG_FILE"

          echo "===== CONFIG ====="
          cat "$CONFIG_FILE"

      # ============================================================
      # 28. PREPARE GRADLE
      # ============================================================
      - name: Prepare Gradle
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f gradlew ]; then

            if ! command -v gradle >/dev/null 2>&1; then

              GRADLE_VERSION="8.7"

              curl --retry 5 \
                   --retry-delay 10 \
                   --retry-all-errors \
                   -fsSL \
                   "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
                   -o "$RUNNER_TEMP/gradle.zip"

              rm -rf "$RUNNER_TEMP/gradle"

              unzip -q \
                "$RUNNER_TEMP/gradle.zip" \
                -d "$RUNNER_TEMP"

              export PATH="$RUNNER_TEMP/gradle/gradle-${GRADLE_VERSION}/bin:$PATH"
            fi

            gradle wrapper \
              --gradle-version 8.7
          fi

          chmod +x gradlew

          ./gradlew --version

      # ============================================================
      # 29. GENERATE TEMPORARY SIGNING KEY
      # ============================================================
      - name: Generate temporary signing key
        shell: bash
        run: |
          set -euo pipefail

          KEYSTORE="$RUNNER_TEMP/ycash-temp-release.keystore"

          rm -f "$KEYSTORE"

          keytool \
            -genkeypair \
            -v \
            -keystore "$KEYSTORE" \
            -storetype JKS \
            -storepass "$CI_KEYSTORE_PASSWORD" \
            -keypass "$CI_KEY_PASSWORD" \
            -alias "$CI_KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -dname "CN=Ycash Temporary Build, OU=Development, O=Ycash, L=Local, ST=Local, C=GB"

          chmod 600 "$KEYSTORE"

          echo "KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"

      # ============================================================
      # 30. BUILD RELEASE APK
      # ============================================================
      - name: Build release APK
        id: build_apk
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --refresh-dependencies \
            assembleRelease

          find "$PWD/app/build/outputs/apk" \
            -type f \
            -name '*.apk' \
            -print

      # ============================================================
      # 31. LOCATE APK
      # ============================================================
      - name: Locate APK
        id: unsigned_apk
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find "$PWD/app/build/outputs/apk" \
              -type f \
              -name '*.apk' \
              -print -quit
          )"

          if [ -z "$APK" ]; then
            echo "::error::No APK was produced."
            exit 1
          fi

          APK="$(realpath "$APK")"

          file "$APK"
          ls -lh "$APK"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 32. VERIFY CONFIG INSIDE APK
      # ============================================================
      - name: Verify ycash.conf inside APK
        shell: bash
        run: |
          set -euo pipefail

          APK="${{ steps.unsigned_apk.outputs.apk }}"

          test -f "$APK"

          unzip -l "$APK" \
            | grep -q 'assets/ycash/ycash.conf'

          TEMP_CONFIG="$RUNNER_TEMP/ycash.conf"

          unzip -p "$APK" \
            'assets/ycash/ycash.conf' \
            > "$TEMP_CONFIG"

          test -s "$TEMP_CONFIG"

          echo "===== PACKAGED YCASH CONFIG ====="
          cat "$TEMP_CONFIG"

      # ============================================================
      # 33. VERIFY NATIVE LIBRARIES INSIDE APK
      # ============================================================
      - name: Verify native libraries inside APK
        shell: bash
        run: |
          set -euo pipefail

          APK="${{ steps.unsigned_apk.outputs.apk }}"

          unzip -l "$APK" \
            | grep -q 'lib/arm64-v8a/libycashd.so'

          unzip -l "$APK" \
            | grep -q 'lib/arm64-v8a/libc++_shared.so'

          echo "Both ARM64 native libraries are present."

      # ============================================================
      # 34. ZIPALIGN APK
      # ============================================================
      - name: Zipalign APK
        id: aligned
        shell: bash
        run: |
          set -euo pipefail

          INPUT="${{ steps.unsigned_apk.outputs.apk }}"

          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          ALIGNED="$RUNNER_TEMP/YcashNode-Android-ARM64-aligned.apk"

          "$ZIPALIGN" \
            -f \
            -p \
            4 \
            "$INPUT" \
            "$ALIGNED"

          test -f "$ALIGNED"

          echo "apk=$ALIGNED" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 35. SIGN FINAL APK
      # ============================================================
      - name: Sign final APK with temporary CI key
        id: signed
        shell: bash
        run: |
          set -euo pipefail

          INPUT="${{ steps.aligned.outputs.apk }}"

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          SIGNED="$RUNNER_TEMP/YcashNode-Android-ARM64-SIGNED.apk"

          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-type JKS \
            --ks-pass "pass:$CI_KEYSTORE_PASSWORD" \
            --key-pass "pass:$CI_KEY_PASSWORD" \
            --ks-key-alias "$CI_KEY_ALIAS" \
            --out "$SIGNED" \
            "$INPUT"

          test -f "$SIGNED"

          echo "apk=$SIGNED" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 36. VERIFY APK SIGNATURE
      # ============================================================
      - name: Verify final APK signature
        shell: bash
        run: |
          set -euo pipefail

          APK="${{ steps.signed.outputs.apk }}"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose \
            "$APK"

      # ============================================================
      # 37. VERIFY APK ALIGNMENT
      # ============================================================
      - name: Verify APK alignment
        shell: bash
        run: |
          set -euo pipefail

          APK="${{ steps.signed.outputs.apk }}"

          "$ANDROID_HOME/build-tools/35.0.0/zipalign" \
            -c \
            -p \
            4 \
            "$APK"

      # ============================================================
      # 38. FINAL SIGNED APK CONFIG VERIFICATION
      # ============================================================
      - name: Verify final signed APK ycash.conf
        shell: bash
        run: |
          set -euo pipefail

          APK="${{ steps.signed.outputs.apk }}"

          unzip -l "$APK" \
            | grep -q 'assets/ycash/ycash.conf'

          echo "===== FINAL SIGNED APK CONFIG ====="

          unzip -p "$APK" \
            'assets/ycash/ycash.conf'

      # ============================================================
      # 39. FINAL NATIVE LIBRARY VERIFICATION
      # ============================================================
      - name: Verify final signed APK native libraries
        shell: bash
        run: |
          set -euo pipefail

          APK="${{ steps.signed.outputs.apk }}"

          unzip -l "$APK" \
            | grep -q 'lib/arm64-v8a/libycashd.so'

          unzip -l "$APK" \
            | grep -q 'lib/arm64-v8a/libc++_shared.so'

          echo "libycashd.so PRESENT"
          echo "libc++_shared.so PRESENT"

      # ============================================================
      # 40. FINAL APK INSPECTION
      # ============================================================
      - name: Inspect final APK
        shell: bash
        run: |
          set -euo pipefail

          APK="${{ steps.signed.outputs.apk }}"

          echo "=========================================="
          echo "FINAL Ycash NODE APK"
          echo "=========================================="

          ls -lh "$APK"
          file "$APK"

          echo
          echo "===== SIGNATURE ====="

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose \
            "$APK"

          echo
          echo "===== CONTENTS ====="

          unzip -l "$APK" \
            | grep -E \
              'lib/arm64-v8a|assets/ycash/ycash.conf|AndroidManifest.xml' \
            | head -100

      # ============================================================
      # 41. COPY FINAL APK TO WORKSPACE
      # ============================================================
      - name: Prepare final APK artifact
        shell: bash
        run: |
          set -euo pipefail

          APK="${{ steps.signed.outputs.apk }}"
          OUT="$GITHUB_WORKSPACE/YcashNode-Android-ARM64-SIGNED.apk"

          cp "$APK" "$OUT"

          test -f "$OUT"

          ls -lh "$OUT"

      # ============================================================
      # 42. UPLOAD SIGNED ANDROID APK
      # ============================================================
      - name: Upload signed Android APK
        uses: actions/upload-artifact@v4
        with:
          name: YcashNode-Android-ARM64-SIGNED
          path: ${{ github.workspace }}/YcashNode-Android-ARM64-SIGNED.apk
          if-no-files-found: error

      # ============================================================
      # 43. UPLOAD YCASHD SEPARATELY
      # ============================================================
      - name: Upload ycashd ARM64 binary
        uses: actions/upload-artifact@v4
        with:
          name: ycashd-Android-ARM64-unstripped
          path: ${{ steps.binary.outputs.binary }}
          if-no-files-found: error

      # ============================================================
      # 44. CREATE BUILD INFORMATION
      # ============================================================
      - name: Create build information
        shell: bash
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/ycash-build-info.txt" <<EOF
          Ycash Android Node
          ==================

          Architecture:
          ARM64 / aarch64

          Android API:
          ${ANDROID_API}

          Android NDK:
          ${ANDROID_NDK}

          Rust target:
          ${RUST_TARGET}

          vcpkg:
          ${VCPKG_COMMIT}

          Vcpkg downloads:
          Cached

          Vcpkg installed dependencies:
          Cached

          Network retry:
          Enabled

          Build:
          Release

          APK:
          YcashNode-Android-ARM64-SIGNED.apk

          Signing:
          Temporary CI-generated development key

          ycashd:
          Embedded as libycashd.so

          C++ runtime:
          Matching libc++_shared.so

          Default configuration:
          assets/ycash/ycash.conf

          Configuration editing:
          Android application should copy the packaged config
          into its writable private node directory on first launch.

          APK signature:
          Verified

          APK alignment:
          Verified
          EOF

          cat "$RUNNER_TEMP/ycash-build-info.txt"

      # ============================================================
      # 45. UPLOAD BUILD INFORMATION
      # ============================================================
      - name: Upload build information
        uses: actions/upload-artifact@v4
        with:
          name: YcashNode-build-information
          path: ${{ runner.temp }}/ycash-build-info.txt
          if-no-files-found: error
