name: Build, Sign and Verify Ycash Android Node

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  ANDROID_API: "35"
  ANDROID_NDK: "27.2.12479018"
  RUST_TARGET: "aarch64-linux-android"

  # Temporary CI signing.
  # A new debug keystore is generated for each workflow run.
  CI_KEYSTORE: "${{ github.workspace }}/ci-debug.keystore"
  CI_KEY_ALIAS: "ycash-debug"
  CI_KEYSTORE_PASSWORD: "ycash-debug-password"
  CI_KEY_PASSWORD: "ycash-debug-password"

jobs:
  build:
    name: Build, Align, Sign and Verify Ycash Android Node
    runs-on: ubuntu-24.04

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # 2. PREPARE PROJECT ROOT
      #
      # Supports:
      #
      # A) Project already extracted at repository root:
      #
      #    Cargo.toml
      #    crates/
      #    android-app/
      #
      # OR
      #
      # B) Repository contains ANY ZIP containing the project.
      # =========================================================
      - name: Prepare project root
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "PREPARING YCASH PROJECT ROOT"
          echo "=========================================="

          pwd

          echo
          echo "Repository contents:"
          ls -la

          if [ -f "Cargo.toml" ] && \
             [ -d "crates" ] && \
             [ -d "android-app" ]; then

            echo
            echo "Valid Ycash project already exists at repository root."

          else

            echo
            echo "Searching all ZIP files recursively..."

            ZIP=""

            mapfile -d '' ZIP_FILES < <(
              find . \
                -type f \
                -iname '*.zip' \
                -not -path './.git/*' \
                -print0 \
                | sort -z
            )

            if [ "${#ZIP_FILES[@]}" -eq 0 ]; then
              echo "ERROR: No ZIP files found."
              exit 1
            fi

            echo
            echo "ZIP files discovered:"

            for candidate in "${ZIP_FILES[@]}"; do
              echo "  - $candidate"
            done

            for candidate in "${ZIP_FILES[@]}"; do

              echo
              echo "------------------------------------------"
              echo "Checking:"
              echo "$candidate"
              echo "------------------------------------------"

              if ! unzip -tq "$candidate" >/dev/null 2>&1; then
                echo "SKIP: Invalid/corrupted ZIP."
                continue
              fi

              if ! unzip -Z1 "$candidate" 2>/dev/null \
                | grep -qE '(^|/)Cargo\.toml$'; then
                echo "SKIP: No Cargo.toml."
                continue
              fi

              if ! unzip -Z1 "$candidate" 2>/dev/null \
                | grep -qE '(^|/)crates(/|/)'; then
                echo "SKIP: No crates/."
                continue
              fi

              if ! unzip -Z1 "$candidate" 2>/dev/null \
                | grep -qE '(^|/)android-app(/|/)'; then
                echo "SKIP: No android-app/."
                continue
              fi

              ZIP="$candidate"

              echo
              echo "VALID PROJECT ZIP FOUND:"
              echo "$ZIP"

              break
            done

            if [ -z "$ZIP" ]; then
              echo
              echo "ERROR: No valid Ycash project ZIP found."
              exit 1
            fi

            rm -rf .ycash-project
            mkdir -p .ycash-project

            unzip -q "$ZIP" -d .ycash-project

            PROJECT_ROOT=""

            while IFS= read -r -d '' cargo_file; do

              candidate_root="$(dirname "$cargo_file")"

              if [ -d "$candidate_root/crates" ] && \
                 [ -d "$candidate_root/android-app" ]; then

                PROJECT_ROOT="$candidate_root"

                echo
                echo "PROJECT ROOT:"
                echo "$PROJECT_ROOT"

                break
              fi

            done < <(
              find .ycash-project \
                -type f \
                -name Cargo.toml \
                -print0
            )

            if [ -z "$PROJECT_ROOT" ]; then
              echo
              echo "ERROR: Could not locate valid project root."
              find .ycash-project -maxdepth 8 -type f | sort
              exit 1
            fi

            cp -a "$PROJECT_ROOT"/. .

            rm -rf .ycash-project

          fi

          echo
          echo "=========================================="
          echo "FINAL PROJECT ROOT CHECK"
          echo "=========================================="

          test -f Cargo.toml
          test -d crates
          test -d android-app

          echo
          echo "Cargo.toml:"
          ls -lh Cargo.toml

          echo
          echo "Required directories:"

          for dir in crates android-app; do
            test -d "$dir"
            echo "OK: $dir/"
          done

          echo
          echo "PROJECT ROOT READY"

      # =========================================================
      # 3. JAVA 17
      # =========================================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # =========================================================
      # 4. ANDROID SDK
      # =========================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      # =========================================================
      # 5. ANDROID PLATFORM + NDK
      # =========================================================
      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;35.0.0" \
            "ndk;${ANDROID_NDK}"

          echo
          echo "Android SDK installed."

      # =========================================================
      # 6. RUST
      # =========================================================
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.RUST_TARGET }}

      # =========================================================
      # 7. CONFIGURE ANDROID RUST LINKER
      # =========================================================
      - name: Configure Android Rust linker
        shell: bash
        run: |
          set -euo pipefail

          NDK="$ANDROID_HOME/ndk/${ANDROID_NDK}"
          LLVM="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          test -x "$LLVM/aarch64-linux-android${ANDROID_API}-clang"
          test -x "$LLVM/aarch64-linux-android${ANDROID_API}-clang++"
          test -x "$LLVM/llvm-ar"
          test -x "$LLVM/llvm-ranlib"

          mkdir -p .cargo

          cat > .cargo/config.toml <<EOF
          [target.aarch64-linux-android]
          linker = "$LLVM/aarch64-linux-android${ANDROID_API}-clang"
          ar = "$LLVM/llvm-ar"
          EOF

          echo "CC_aarch64_linux_android=$LLVM/aarch64-linux-android${ANDROID_API}-clang" >> "$GITHUB_ENV"
          echo "CXX_aarch64_linux_android=$LLVM/aarch64-linux-android${ANDROID_API}-clang++" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$LLVM/llvm-ar" >> "$GITHUB_ENV"
          echo "RANLIB_aarch64_linux_android=$LLVM/llvm-ranlib" >> "$GITHUB_ENV"

          echo
          echo "Cargo configuration:"
          cat .cargo/config.toml

      # =========================================================
      # 8. VERIFY RUST WORKSPACE
      # =========================================================
      - name: Verify Rust workspace
        shell: bash
        run: |
          set -euo pipefail

          rustc --version
          cargo --version

          test -f Cargo.toml

          cargo metadata \
            --format-version 1 \
            --no-deps

          echo
          echo "Cargo workspace verified."

      # =========================================================
      # 9. CARGO CACHE
      # =========================================================
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ycash-${{ runner.os }}-${{ env.RUST_TARGET }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ycash-${{ runner.os }}-${{ env.RUST_TARGET }}-
            ycash-${{ runner.os }}-

      # =========================================================
      # 10. BUILD RUST ANDROID NODE
      # =========================================================
      - name: Build Ycash ARM64 Android node
        shell: bash
        run: |
          set -euo pipefail

          cargo build \
            --release \
            --target "${RUST_TARGET}" \
            -p ycash-android-node

      # =========================================================
      # 11. VERIFY ARM64 NODE
      #
      # IMPORTANT:
      # The node is an Android ARM64 PIE executable.
      # It is NOT treated as a normal desktop Linux executable.
      # =========================================================
      - name: Verify ARM64 Android node
        shell: bash
        run: |
          set -euo pipefail

          NODE="target/${RUST_TARGET}/release/ycash-android-node"

          test -f "$NODE"
          test -x "$NODE"

          echo "=========================================="
          echo "NODE BINARY"
          echo "=========================================="

          ls -lh "$NODE"

          echo
          echo "File:"
          file "$NODE"

          echo
          echo "ELF header:"
          readelf -h "$NODE" | grep -E \
            "Class:|Machine:|Type:"

          echo
          echo "Program headers:"
          readelf -l "$NODE" | grep -E \
            "Type|INTERP|GNU_STACK|GNU_RELRO" || true

          echo
          echo "Native dependencies:"
          readelf -d "$NODE" | grep NEEDED || true

          echo
          echo "SHA-256:"
          sha256sum "$NODE"

          # -----------------------------------------------------
          # Must be 64-bit ARM.
          # -----------------------------------------------------
          file "$NODE" | grep -Ei \
            "ARM aarch64|ARM64|aarch64"

          # -----------------------------------------------------
          # Must be PIE executable.
          # ET_DYN is expected for Android PIE executables.
          # -----------------------------------------------------
          readelf -h "$NODE" | grep -q \
            "Type:[[:space:]]*DYN"

          echo
          echo "ARM64 + PIE verification PASSED."

      # =========================================================
      # 12. PREPARE ANDROID NATIVE LIBRARY DIRECTORY
      #
      # Android extracts native libraries into:
      #
      #    ApplicationInfo.nativeLibraryDir
      #
      # The Android runtime code can therefore execute the
      # bundled node from the extracted native-library path
      # rather than trying to execute directly from assets.
      # =========================================================
      - name: Prepare Android ARM64 native node
        shell: bash
        run: |
          set -euo pipefail

          NODE="target/${RUST_TARGET}/release/ycash-android-node"

          JNI_LIBS="android-app/app/src/main/jniLibs/arm64-v8a"
          NATIVE_NODE="$JNI_LIBS/libycashandroidnode.so"

          mkdir -p "$JNI_LIBS"

          # Remove legacy asset executable.
          rm -f \
            android-app/app/src/main/assets/ycash-android-node

          # Remove stale native copy.
          rm -f "$NATIVE_NODE"

          cp "$NODE" "$NATIVE_NODE"

          chmod 755 "$NATIVE_NODE"

          test -f "$NATIVE_NODE"

          echo "Native node:"
          ls -lh "$NATIVE_NODE"

          echo
          echo "Native node type:"
          file "$NATIVE_NODE"

          echo
          echo "Native node SHA-256:"
          sha256sum "$NATIVE_NODE"

          echo
          echo "Native node prepared."

      # =========================================================
      # 13. VERIFY NO LEGACY ASSET NODE
      # =========================================================
      - name: Verify legacy asset node is absent
        shell: bash
        run: |
          set -euo pipefail

          if [ -f \
            android-app/app/src/main/assets/ycash-android-node
          ]; then

            echo "ERROR: Legacy asset node still exists."
            exit 1
          fi

          echo "Legacy asset node correctly absent."

      # =========================================================
      # 14. VERIFY ANDROID NATIVE NODE
      # =========================================================
      - name: Verify Android native node
        shell: bash
        run: |
          set -euo pipefail

          NODE="android-app/app/src/main/jniLibs/arm64-v8a/libycashandroidnode.so"

          test -f "$NODE"

          file "$NODE" | grep -Ei \
            "ARM aarch64|ARM64|aarch64"

          readelf -h "$NODE" | grep -q \
            "Type:[[:space:]]*DYN"

          echo
          echo "Android ARM64 native node verification PASSED."

      # =========================================================
      # 15. VERIFY ANDROID PROJECT
      # =========================================================
      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          test -f android-app/settings.gradle
          test -f android-app/app/build.gradle
          test -f android-app/app/src/main/AndroidManifest.xml

          test -f \
            android-app/app/src/main/jniLibs/arm64-v8a/libycashandroidnode.so

          echo
          echo "Android project verified."

      # =========================================================
      # 16. CHECK ANDROID MANIFEST
      #
      # extractNativeLibs=false can prevent extraction on
      # supported configurations, which would break the
      # executable-from-nativeLibraryDir approach.
      #
      # We therefore fail if the manifest explicitly disables
      # extraction.
      # =========================================================
      - name: Verify native library extraction configuration
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="android-app/app/src/main/AndroidManifest.xml"

          test -f "$MANIFEST"

          if grep -Eq \
            'extractNativeLibs[[:space:]]*=[[:space:]]*"false"' \
            "$MANIFEST"; then

            echo
            echo "ERROR:"
            echo "AndroidManifest.xml explicitly sets"
            echo "extractNativeLibs=\"false\"."
            echo
            echo "The node execution design requires the native"
            echo "library to be extracted into nativeLibraryDir."

            exit 1
          fi

          echo
          echo "Native library extraction configuration OK."

      # =========================================================
      # 17. SET UP GRADLE
      # =========================================================
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # =========================================================
      # 18. BUILD APK
      # =========================================================
      - name: Build Android APK
        working-directory: android-app
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            assembleDebug

      # =========================================================
      # 19. LOCATE APK
      # =========================================================
      - name: Locate Gradle APK
        id: locate_apk
        shell: bash
        run: |
          set -euo pipefail

          APK="android-app/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"

          echo
          echo "APK:"
          ls -lh "$APK"

      # =========================================================
      # 20. VERIFY NATIVE NODE INSIDE APK
      # =========================================================
      - name: Verify ARM64 native node in APK
        shell: bash
        run: |
          set -euo pipefail

          APK="${{ steps.locate_apk.outputs.apk }}"

          echo "=========================================="
          echo "APK NATIVE NODE CHECK"
          echo "=========================================="

          unzip -l "$APK" \
            | grep \
            "lib/arm64-v8a/libycashandroidnode.so"

          echo
          echo "Checking for legacy asset executable..."

          if unzip -l "$APK" \
            | grep -q "assets/ycash-android-node"; then

            echo
            echo "ERROR:"
            echo "Legacy assets/ycash-android-node exists in APK."

            exit 1
          fi

          echo
          echo "Native node packaging PASSED."

      # =========================================================
      # 21. EXTRACT AND VERIFY APK NATIVE NODE
      #
      # This checks the actual ELF stored in the APK.
      # =========================================================
      - name: Extract and verify APK native node
        shell: bash
        run: |
          set -euo pipefail

          APK="${{ steps.locate_apk.outputs.apk }}"

          rm -rf apk-native-check
          mkdir -p apk-native-check

          unzip -q "$APK" \
            "lib/arm64-v8a/libycashandroidnode.so" \
            -d apk-native-check

          NODE="apk-native-check/lib/arm64-v8a/libycashandroidnode.so"

          test -f "$NODE"

          echo "Extracted APK node:"
          ls -lh "$NODE"

          echo
          echo "File:"
          file "$NODE"

          echo
          echo "ELF:"
          readelf -h "$NODE" | grep -E \
            "Class:|Machine:|Type:"

          echo
          echo "SHA-256:"
          sha256sum "$NODE"

          file "$NODE" | grep -Ei \
            "ARM aarch64|ARM64|aarch64"

          readelf -h "$NODE" | grep -q \
            "Type:[[:space:]]*DYN"

          echo
          echo "APK native node verification PASSED."

      # =========================================================
      # 22. GENERATE TEMPORARY DEBUG KEY
      # =========================================================
      - name: Generate temporary debug signing key
        shell: bash
        run: |
          set -euo pipefail

          rm -f "$CI_KEYSTORE"

          keytool \
            -genkeypair \
            -v \
            -keystore "$CI_KEYSTORE" \
            -storepass "$CI_KEYSTORE_PASSWORD" \
            -keypass "$CI_KEY_PASSWORD" \
            -alias "$CI_KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname \
              "CN=Ycash CI Debug, OU=Development, O=Ycash, L=CI, ST=CI, C=GB"

          test -f "$CI_KEYSTORE"

          echo
          echo "Temporary CI signing key generated."

      # =========================================================
      # 23. ZIPALIGN
      # =========================================================
      - name: Zipalign APK
        shell: bash
        run: |
          set -euo pipefail

          INPUT="android-app/app/build/outputs/apk/debug/app-debug.apk"

          ALIGNED="android-app/app/build/outputs/apk/debug/ycash-android-node-aligned.apk"

          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"

          test -x "$ZIPALIGN"
          test -f "$INPUT"

          rm -f "$ALIGNED"

          "$ZIPALIGN" \
            -f \
            -p \
            4 \
            "$INPUT" \
            "$ALIGNED"

          test -f "$ALIGNED"

          echo
          echo "Aligned APK:"
          ls -lh "$ALIGNED"

      # =========================================================
      # 24. VERIFY ZIPALIGN
      # =========================================================
      - name: Verify zip alignment
        shell: bash
        run: |
          set -euo pipefail

          ALIGNED="android-app/app/build/outputs/apk/debug/ycash-android-node-aligned.apk"

          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"

          "$ZIPALIGN" \
            -c \
            -p \
            -v \
            4 \
            "$ALIGNED"

          echo
          echo "Zip alignment verification PASSED."

      # =========================================================
      # 25. SIGN ALIGNED APK
      # =========================================================
      - name: Sign aligned APK
        shell: bash
        run: |
          set -euo pipefail

          ALIGNED="android-app/app/build/outputs/apk/debug/ycash-android-node-aligned.apk"

          SIGNED="android-app/app/build/outputs/apk/debug/ycash-android-node-debug-signed.apk"

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          test -x "$APKSIGNER"
          test -f "$ALIGNED"

          rm -f "$SIGNED"

          "$APKSIGNER" sign \
            --ks "$CI_KEYSTORE" \
            --ks-key-alias "$CI_KEY_ALIAS" \
            --ks-pass "pass:$CI_KEYSTORE_PASSWORD" \
            --key-pass "pass:$CI_KEY_PASSWORD" \
            --out "$SIGNED" \
            "$ALIGNED"

          test -f "$SIGNED"

          echo
          echo "Signed APK:"
          ls -lh "$SIGNED"

      # =========================================================
      # 26. VERIFY APK SIGNATURE
      # =========================================================
      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          SIGNED="android-app/app/build/outputs/apk/debug/ycash-android-node-debug-signed.apk"

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          "$APKSIGNER" verify \
            --verbose \
            "$SIGNED"

          echo
          echo "APK signature verification PASSED."

      # =========================================================
      # 27. VERIFY FINAL APK NATIVE NODE
      # =========================================================
      - name: Verify final signed APK native node
        shell: bash
        run: |
          set -euo pipefail

          SIGNED="android-app/app/build/outputs/apk/debug/ycash-android-node-debug-signed.apk"

          echo "=========================================="
          echo "FINAL SIGNED APK CHECK"
          echo "=========================================="

          unzip -l "$SIGNED" \
            | grep \
            "lib/arm64-v8a/libycashandroidnode.so"

          if unzip -l "$SIGNED" \
            | grep -q "assets/ycash-android-node"; then

            echo
            echo "ERROR: Legacy asset node found."
            exit 1
          fi

          echo
          echo "Final native node packaging PASSED."

      # =========================================================
      # 28. FINAL APK INFORMATION
      # =========================================================
      - name: Display final APK information
        shell: bash
        run: |
          set -euo pipefail

          SIGNED="android-app/app/build/outputs/apk/debug/ycash-android-node-debug-signed.apk"

          echo
          echo "=========================================="
          echo "FINAL APK"
          echo "=========================================="

          ls -lh "$SIGNED"

          echo
          echo "SHA-256:"
          sha256sum "$SIGNED"

          echo
          echo "=========================================="
          echo "BUILD VERIFICATION COMPLETE"
          echo "=========================================="

      # =========================================================
      # 29. UPLOAD SIGNED APK
      # =========================================================
      - name: Upload signed debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ycash-android-node-debug-signed
          path: android-app/app/build/outputs/apk/debug/ycash-android-node-debug-signed.apk
          if-no-files-found: error

      # =========================================================
      # 30. UPLOAD RAW ARM64 NODE
      # =========================================================
      - name: Upload ARM64 node
        uses: actions/upload-artifact@v4
        with:
          name: ycash-android-node-arm64
          path: target/${{ env.RUST_TARGET }}/release/ycash-android-node
          if-no-files-found: error

      # =========================================================
      # 31. UPLOAD BUILD DIAGNOSTICS
      # =========================================================
      - name: Create build diagnostics
        if: always()
        shell: bash
        run: |
          set +e

          mkdir -p build-diagnostics

          echo "==========================================" \
            > build-diagnostics/summary.txt

          echo "YCASH ANDROID NODE BUILD DIAGNOSTICS" \
            >> build-diagnostics/summary.txt

          echo "==========================================" \
            >> build-diagnostics/summary.txt

          echo >> build-diagnostics/summary.txt

          echo "Date:" >> build-diagnostics/summary.txt
          date -u >> build-diagnostics/summary.txt

          echo >> build-diagnostics/summary.txt

          echo "Rust:" >> build-diagnostics/summary.txt
          rustc --version >> build-diagnostics/summary.txt 2>&1

          echo >> build-diagnostics/summary.txt

          echo "Cargo:" >> build-diagnostics/summary.txt
          cargo --version >> build-diagnostics/summary.txt 2>&1

          echo >> build-diagnostics/summary.txt

          echo "Android API:" >> build-diagnostics/summary.txt
          echo "$ANDROID_API" >> build-diagnostics/summary.txt

          echo >> build-diagnostics/summary.txt

          echo "Android NDK:" >> build-diagnostics/summary.txt
          echo "$ANDROID_NDK" >> build-diagnostics/summary.txt

          echo >> build-diagnostics/summary.txt

          echo "Rust target:" >> build-diagnostics/summary.txt
          echo "$RUST_TARGET" >> build-diagnostics/summary.txt

          echo >> build-diagnostics/summary.txt

          echo "Native node location:" \
            >> build-diagnostics/summary.txt

          echo \
            "android-app/app/src/main/jniLibs/arm64-v8a/libycashandroidnode.so" \
            >> build-diagnostics/summary.txt

          echo >> build-diagnostics/summary.txt

          echo "Node files:" >> build-diagnostics/summary.txt

          find \
            android-app/app/src/main/jniLibs \
            -type f \
            -print \
            2>/dev/null \
            >> build-diagnostics/summary.txt

          echo >> build-diagnostics/summary.txt

          echo "APK files:" >> build-diagnostics/summary.txt

          find \
            android-app/app/build/outputs \
            -type f \
            -print \
            2>/dev/null \
            >> build-diagnostics/summary.txt

          echo >> build-diagnostics/summary.txt

          echo "Repository Git status:" \
            >> build-diagnostics/summary.txt

          git status --short \
            >> build-diagnostics/summary.txt 2>&1

          echo
          cat build-diagnostics/summary.txt

      # =========================================================
      # 32. UPLOAD BUILD DIAGNOSTICS
      # =========================================================
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ycash-android-node-build-diagnostics
          path: build-diagnostics
          if-no-files-found: warn

      # =========================================================
      # 33. CLEAN TEMPORARY SIGNING KEY
      # =========================================================
      - name: Remove temporary signing key
        if: always()
        shell: bash
        run: |
          rm -f "$CI_KEYSTORE"

          echo "Temporary signing key removed."
